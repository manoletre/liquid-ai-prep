<script>
const LESSON = {"id": "l14", "title": "Lesson 14 · Quantization: scales, groups and the bit ladder", "h1": "Quantization: how a 2.4 GB model becomes 0.7 GB", "sub": "Lesson 14 · a recall warm-up, then 3 new ideas: quantize = one scale + rounding (and why outliers hurt), giving each small group its own scale, and the bit ladder (what Q8_0 / Q4_K_M mean and how you actually quantize). Answers your open questions “How do I quantize a model? How does the process work?” and “What is the order of all quantizations?”. Builds on yesterday's bytes-per-parameter math. Have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up: write quantize(w, bits, g) and dequantize(q, s) in numpy for symmetric absmax quantization with groups of g (assume len(w) is a multiple of g). Return the ints and one scale per group.", "model": "<pre><code>import numpy as np\n\ndef quantize(w, bits=4, g=32):\n    t = 2 ** (bits - 1) - 1              # ticks per side: 7 for int4\n    W = w.reshape(-1, g)                  # one row per group\n    s = np.abs(W).max(axis=1, keepdims=True) / t\n    s[s == 0] = 1.0                       # all-zero group: avoid divide by 0\n    q = np.clip(np.round(W / s), -t, t).astype(np.int8)\n    return q, s\n\ndef dequantize(q, s):\n    return (q * s).reshape(-1)\n\nw = np.array([0.14, -0.07, 0.21, 0.03, 1.4, -0.8, 0.62, 0.13])\nq, s = quantize(w, 4, 4)\nprint(dequantize(q, s))   # [0.15 -0.06 0.21 0.03 1.4 -0.8 0.6 0.2]</code></pre>Say out loud: the zero-group guard and the clip are the two edge cases interviewers look for."}, {"id": "d2", "q": "Predict, then run: rng = np.random.default_rng(0); w = rng.normal(0, 0.02, 4096); w[7] = 1.0. Compare the mean absolute error of 4-bit quantization with g = 4096 (one scale) vs g = 32. Which is bigger, and roughly by how much?", "model": "One scale: \\(s=1.0/7\\approx0.14\\), far bigger than typical weights (≈ 0.02), so almost every weight rounds to 0 and the mean error is about the mean |w| ≈ 0.016. With g = 32, only the outlier's group is coarse; the others get \\(s\\approx\\max|w_{\\text{group}}|/7\\approx0.007\\), so the error drops to roughly 0.002, about <b>8–10× smaller</b>. Exact numbers depend on the seed; the point is the gap."}, {"id": "d3", "q": "Interview: “How would you quantize a model to run on a laptop, and what does Q4_K_M mean?” Answer in under a minute.", "model": "Post-training quantization: take the trained bf16 weights, split each tensor into small groups, give each group a scale \\(s=\\max|w|/(2^{b-1}-1)\\), store round(w/s) as low-bit integers plus the scales, and dequantize on the fly at inference. Groups keep outliers from ruining everyone else's precision. In llama.cpp I'd convert to GGUF and run llama-quantize. Q4_K_M is a 4-bit k-quant (blocks in super-blocks with quantized scales), with a medium share of sensitive tensors kept at higher precision, about 4.8–4.9 bits per weight. I'd start at Q4_K_M, check quality on my own eval set against bf16, and move up to Q5/Q6/Q8 if it drops too much, especially for a small model."}, {"id": "d4", "q": "Your DR Congo project with Jeff runs a small local model for privacy. A field laptop has 4 GB of RAM free for the model. Using today's math, which of LFM2-1.2B bf16 / Q8_0 / Q4_K_M would you try first, and what would you check before shipping it?", "model": "All three fit on weights alone (2.4 / ≈ 1.28 / ≈ 0.73 GB), but the runtime also needs the KV cache and activations, so leave headroom. I'd try <b>Q8_0</b> first: about half the memory of bf16 and usually no visible quality loss, and it's also faster on a memory-bound laptop. Drop to Q4_K_M only if speed or memory is tight. Before shipping: run the same eval prompts (in the languages the field team uses) on bf16 and the quantized model and compare, because small models lose more from quantization."}], "key": ["qs", "qint", "qhat", "grp", "bpw", "ptq", "fp16", "bf16", "trn", "val", "lora_r", "lora_a", "lora_scale"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "trn": ["train set", "Data gradient descent fits on. Its score can't tell memorizing from learning."], "val": ["validation (dev) set", "Held-out data for every choice: λ, learning rate, epochs, which model."], "tst": ["test set", "Held-out data measured once at the very end. The number you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."], "loraW": ["W · frozen base", "Pretrained weight matrix kept frozen in LoRA; δ still flows through it, but no ∂L/∂W is stored."], "loraA": ["A · LoRA down", "Trainable r × d_in factor. With B forms the low-rank update ΔW = BA."], "loraB": ["B · LoRA up", "Trainable d_out × r factor. Together with A: rank(BA) ≤ r."], "lora_r": ["r · LoRA rank", "Width of the adapter. Capacity of ΔW. Typical 4–64; r ≪ d. GRPO often uses r = 32."], "lora_a": ["α · LoRA alpha", "Strength knob. Effective scale of the adapter is α/r. Often set to r or 2r."], "lora_drop": ["LoRA dropout", "Randomly zeros adapter activations each forward pass; regularizes the update so it doesn't rely on one direction."], "temp": ["T · temperature", "Divides every logit before softmax: p ∝ e^{z/T}. T < 1 sharper, T > 1 flatter, T → 0 greedy."], "topk": ["top-k", "Keep only the k most likely tokens, then renormalize. A fixed count."], "topp": ["top-p (nucleus)", "Keep the fewest top tokens whose probabilities add up to ≥ p, then renormalize. Adapts to how sure the model is."], "minp": ["min_p", "Keep token i only if p_i ≥ p_min · p_max, then renormalize. The cutoff moves with the top token."], "pmax": ["p_max", "Probability of the single most likely token at this step."], "lora_scale": ["α/r · LoRA scale", "Multiplier on BA in the forward pass. Keeps update size stable when you change r."], "fp32": ["fp32 · single precision", "32 bits = 4 bytes: 1 sign, 8 exponent, 23 mantissa. Gap near 1 ≈ 1.2e-7. Used for master weights and optimizer state."], "fp16": ["fp16 · half precision", "16 bits = 2 bytes: 1 sign, 5 exponent, 10 mantissa. Fine ticks (≈ 0.001 near 1) but max 65,504; tiny gradients underflow."], "bf16": ["bf16 · bfloat16", "16 bits = 2 bytes: 1 sign, 8 exponent, 7 mantissa. fp32's range with coarse ticks (≈ 0.008 near 1). Needs Ampere or newer (not a T4)."], "expo": ["exponent bits", "Pick the power of two (the size bucket). More exponent bits → bigger range."], "mant": ["mantissa bits · m", "The fraction digits inside a bucket: 2^m ticks per bucket. More mantissa bits → finer spacing."], "spacing": ["gap (spacing)", "Distance to the next representable number: 2^k / 2^m in [2^k, 2^(k+1)). Anything between ticks is rounded."], "master": ["fp32 master weights", "Full-precision copy of the weights the optimizer updates, so updates smaller than the 16-bit gap aren't lost."], "lscale": ["S · loss scale", "Multiply the loss by S so fp16 gradients stay above underflow; divide by S in fp32 before the update."], "adam": ["AdamW m, v", "Per-weight running averages of the gradient (m) and squared gradient (v), kept in fp32: 8 bytes per trainable param."], "qs": ["s · scale", "Tick spacing of the quantization ruler: s = max|w| / (ticks per side). One per tensor, or one per group."], "qint": ["q · quantized integer", "round(w / s), stored in b bits: int8 holds −127…127, int4 holds −7…7."], "qhat": ["ŵ · dequantized weight", "q · s, what the model actually computes with. Off from w by at most s / 2."], "grp": ["g · group size", "How many consecutive weights share one scale (often 32–128). Smaller g fits better but stores more scales."], "bpw": ["bits per weight", "b + 16 / g: the integer bits plus each group's 16-bit scale spread over its g weights."], "ptq": ["PTQ · post-training quantization", "Quantize an already-trained model: compute scales, round, store. No retraining (vs QAT, which trains with the rounding)."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: overfitting and LoRA's knobs", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "overfit", "title": "Lesson 08 · overfitting vs underfitting", "html": "Read the <b>gap</b> first. Train 0.08 vs val 0.55 is a big gap: the model memorized the training set → overfitting. Fixes reduce variance: more data, L2, dropout, early stopping, a smaller model. If train and val were both bad and close (0.40 / 0.42), that's underfitting, and more regularization would make it <i>worse</i>.", "start": 0.7, "end": 8.8}, {"key": "lora", "title": "Lesson 11 · LoRA r and α", "html": "The adapter's output is multiplied by \\(\\alpha/r\\). r = 16, α = 32 → 2. Doubling r to 32 at α = 32 → 1, so each direction pushes half as hard. Keep \\(\\alpha/r\\) fixed (α = 64) when you change r. Think of r as capacity, \\(\\alpha/r\\) as strength, dropout as regularization.", "start": 8.8, "end": 17.4}, {"key": "bridge", "title": "Bridge to today", "html": "GB = params (billions) × bytes per param, so LFM2-1.2B in bf16 is 2.4 GB of weights. Most of those 16 bits buy precision a model can live without. Today: store each weight in 8 or 4 bits. That's <b>quantization</b>.", "start": 17.4, "end": 26.4}], "check": {"id": "c1", "q": "(a) Train 0.40, validation 0.42. Would you add dropout? Why or why not? (b) LoRA r = 8, α = 8. What's the scale, and if the adapter seems too weak, name two knobs you could turn.", "model": "(a) <b>No.</b> Both are bad and the gap is tiny → underfitting. Dropout adds regularization and would make it worse; add capacity (a bigger model, higher LoRA r), train longer, or raise the learning rate. (b) Scale \\(8/8=\\)<b>1</b>. Raise α (e.g. 16 → scale 2) for a stronger update, or raise r for more capacity (and raise α with it to keep the scale), or raise the learning rate."}, "hook": {"id": "h1", "q": "From memory. (a) Train loss 0.08, validation loss 0.55. What's going on, and name three things that would help. (b) LoRA with r = 16 and α = 32: what is the adapter's scale? If you double r to 32 and leave α alone, what happens to the scale, and what α would keep it the same? (c) From Lesson 13: how many GB are LFM2-1.2B's weights in bf16?", "model": "(a) Big gap between train and validation → <b>overfitting</b> (high variance). Helps: more data, L2 / weight decay, dropout, early stopping, a smaller model. (Train 0.40 / val 0.42 would be underfitting, where more regularization hurts.) (b) Scale \\(\\alpha/r=32/16=\\)<b>2</b>. With r = 32 it drops to <b>1</b>, so the update is half as strong; set <b>α = 64</b> to keep 2. (c) \\(1.2\\times2=\\)<b>2.4 GB</b>."}, "duration": 26.4}, {"title": "Quantize = one scale, then round", "short": "Scale & round", "video": "media/ch2-scale-round.mp4", "poster": "media/ch2-scale-round-poster.jpg", "steps": [{"key": "idea", "title": "The idea: a ruler with 255 ticks", "html": "An int8 can only be one of 255 values, −127 … 127. So choose a ruler with tick spacing \\(s\\), snap every weight to its nearest tick, and store just the tick number \\(q\\) (1 byte) plus the single number \\(s\\).", "start": 0.7, "end": 10.55}, {"key": "formula", "title": "Where the formula comes from", "html": "$$s=\\frac{\\max|w|}{127},\\qquad q=\\mathrm{round}\\!\\left(\\frac{w}{s}\\right),\\qquad \\hat w=q\\cdot s$$ Dividing by \\(\\max|w|/127\\) puts the biggest weight exactly on tick ±127, so nothing overflows. Rounding to the nearest tick moves a weight at most half a tick, so the error is at most \\(s/2\\). This is called <b>absmax</b> (symmetric) quantization.", "start": 10.55, "end": 19.85}, {"key": "ex1", "title": "Worked example 1: a tidy tensor", "html": "\\(w=[0.50,\\,-1.27,\\,0.30,\\,0.024]\\). \\(\\max|w|=1.27\\), so \\(s=0.01\\). \\(w/s=[50,\\,-127,\\,30,\\,2.4]\\) → \\(q=[50,\\,-127,\\,30,\\,2]\\). Dequantize: \\(\\hat w=[0.50,\\,-1.27,\\,0.30,\\,0.02]\\). Errors 0, 0, 0, 0.004, all ≤ \\(s/2=0.005\\). Four bytes instead of eight in bf16.", "start": 19.85, "end": 29.65}, {"key": "ex2", "title": "Worked example 2 (edge case): one outlier", "html": "\\(w=[0.53,\\,-0.34,\\,0.024,\\,12.7]\\). Now \\(\\max|w|=12.7\\), so \\(s=0.1\\), a ruler 10× coarser. \\(w/s=[5.3,\\,-3.4,\\,0.24,\\,127]\\) → \\(q=[5,\\,-3,\\,0,\\,127]\\) → \\(\\hat w=[0.5,\\,-0.3,\\,0,\\,12.7]\\). The 0.024 became <b>0</b>, and every weight's error budget grew to 0.05. Real LLM weights and activations do have such outliers, which is why the next chapter exists.", "start": 29.65, "end": 39.45}, {"key": "faded", "title": "Your turn: finish the last weight", "html": "int8, \\(w=[0.8,\\,-2.54,\\,1.013]\\). \\(s=2.54/127=0.02\\). 0.8 → 40 → 0.80. −2.54 → −127 → −2.54. And 1.013: \\(1.013/0.02=50.65\\) → \\(q=\\)? \\(\\hat w=\\)? Is the error within \\(s/2\\)? <details><summary>Check your last step</summary>\\(q=\\)<b>51</b>, \\(\\hat w=51\\times0.02=\\)<b>1.02</b>, error 0.007 ≤ 0.01 ✓.</details>", "start": 39.45, "end": 49.15}], "check": {"id": "c2", "q": "int4 holds −7 … 7, so \\(s=\\max|w|/7\\). (a) Quantize \\(w=[1.4,\\,-0.62,\\,0.13]\\): give s, q, ŵ and each error. Are they all within s/2? (b) A weight of 7.0 joins the tensor. Redo q and ŵ for the three original weights.", "model": "(a) \\(s=1.4/7=\\)<b>0.2</b>. \\(w/s=[7,\\,-3.1,\\,0.65]\\) → \\(q=[7,\\,-3,\\,1]\\) → \\(\\hat w=[1.4,\\,-0.6,\\,0.2]\\). Errors 0, 0.02, 0.07, all ≤ 0.1 ✓. (b) \\(s=7/7=1\\): \\(q=[1,\\,-1,\\,0]\\) → \\(\\hat w=[1,\\,-1,\\,0]\\). The outlier made the ruler 5× coarser: 1.4 became 1, −0.62 became −1, and 0.13 vanished."}, "hook": {"id": "h2", "q": "A weight tensor's values all lie between −1.27 and 1.27. You must store each one as an int8 (whole numbers from −127 to 127). (a) Propose a rule to turn a weight into an integer and back. (b) What's the worst rounding error per weight? (c) Now one weight in the tensor is 12.7. What changes?", "model": "(a) Pick a scale \\(s=\\max|w|/127=0.01\\), store \\(q=\\mathrm{round}(w/s)\\), and get back \\(\\hat w=q\\cdot s\\). (b) Rounding moves at most half a tick: \\(s/2=\\)<b>0.005</b>. (c) Now \\(s=12.7/127=0.1\\), ten times coarser: the worst error grows to <b>0.05</b>, and small weights like 0.024 round to <b>0</b>."}, "duration": 49.15}, {"title": "Groups: each block gets its own scale", "short": "Groups", "video": "media/ch3-groups.mp4", "poster": "media/ch3-groups-poster.jpg", "steps": [{"key": "idea", "title": "The idea: one ruler per block", "html": "With a single scale, the biggest weight in the whole tensor sets everyone's ruler. Instead, cut the weights into consecutive <b>groups</b> of \\(g\\) (often 32 to 128) and give each group its own \\(s=\\max|w_{\\text{group}}|/7\\). An outlier now only coarsens its own group.", "start": 0.7, "end": 8.35}, {"key": "ex1", "title": "Worked example 1: one scale for all 8 weights", "html": "int4, \\(s=1.4/7=0.2\\). Group A: \\(w/s=[0.7,\\,-0.35,\\,1.05,\\,0.15]\\) → \\(q=[1,\\,0,\\,1,\\,0]\\) → \\(\\hat w_A=[0.2,\\,0,\\,0.2,\\,0]\\) (true values 0.14, −0.07, 0.21, 0.03). Group B: \\(w/s=[7,\\,-4,\\,3.1,\\,0.65]\\) → \\(q=[7,\\,-4,\\,3,\\,1]\\) → \\(\\hat w_B=[1.4,\\,-0.8,\\,0.6,\\,0.2]\\), fine. Half of group A became exactly 0. With only 7 ticks per side, a shared ruler is brutal.", "start": 8.35, "end": 18.15}, {"key": "ex2", "title": "Worked example 2: one scale per group of 4", "html": "Group A: \\(s_A=0.21/7=0.03\\). \\(w/s_A=[4.67,\\,-2.33,\\,7,\\,1]\\) → \\(q=[5,\\,-2,\\,7,\\,1]\\) → \\(\\hat w_A=[0.15,\\,-0.06,\\,0.21,\\,0.03]\\), errors ≤ 0.01 ✓. Group B keeps \\(s_B=0.2\\), same as before. The price: two scales stored instead of one.", "start": 18.15, "end": 27.95}, {"key": "cost", "title": "What groups cost: bits per weight", "html": "Each group stores \\(g\\) integers of \\(b\\) bits plus one 16-bit scale, so the scale's 16 bits are shared by \\(g\\) weights: $$\\text{bits per weight}=b+\\frac{16}{g}$$ \\(b=4,\\ g=32\\): 4.5 (llama.cpp's <b>Q4_0</b>). \\(b=8,\\ g=32\\): 8.5 (<b>Q8_0</b>). \\(b=4,\\ g=128\\): 4.125, cheaper but cruder. Edge case \\(g=1\\): \\(4+16=20\\) bits, worse than plain bf16.", "start": 27.95, "end": 38.2}, {"key": "faded", "title": "Your turn: b = 4, g = 64", "html": "Each group: 64 × 4 = 256 bits of integers + 16 for the scale = 272 bits for 64 weights. Bits per weight \\(=4+16/64=\\)? <details><summary>Check your last step</summary><b>4.25</b> bits per weight (272 / 64).</details>", "start": 38.2, "end": 46.7}], "check": {"id": "c3", "q": "(a) int4, one group \\(w=[0.09,\\,-0.28,\\,0.13,\\,0.05]\\) with its own scale: give s, q, ŵ. (b) The same four weights, but the whole tensor shares \\(s=0.2\\) (set by a 1.4 elsewhere): give q and ŵ. (c) With b = 4 and g = 32, how many GB are LFM2-1.2B's weights?", "model": "(a) \\(s=0.28/7=\\)<b>0.04</b>. \\(w/s=[2.25,\\,-7,\\,3.25,\\,1.25]\\) → \\(q=[2,\\,-7,\\,3,\\,1]\\) → \\(\\hat w=[0.08,\\,-0.28,\\,0.12,\\,0.04]\\). (b) \\(w/s=[0.45,\\,-1.4,\\,0.65,\\,0.25]\\) → \\(q=[0,\\,-1,\\,1,\\,0]\\) → \\(\\hat w=[0,\\,-0.2,\\,0.2,\\,0]\\): two weights vanish. (c) \\(4+16/32=4.5\\) bits → \\(1.2\\times4.5/8=\\)<b>0.675 GB</b>."}, "hook": {"id": "h3", "q": "With int4 (−7 … 7), a tensor has a block of small weights [0.14, −0.07, 0.21, 0.03] next to a block of big ones [1.4, −0.8, 0.62, 0.13]. (a) With one scale for the whole tensor, what happens to the small block? (b) How could you fix it, and what does the fix cost?", "model": "(a) One scale: \\(s=1.4/7=0.2\\), so the small block becomes \\(q=[1,0,1,0]\\) → \\(\\hat w=[0.2,\\,0,\\,0.2,\\,0]\\). It's wiped out. (b) Give each block (<b>group</b>) its own scale: \\(s_A=0.21/7=0.03\\) → \\(\\hat w_A=[0.15,\\,-0.06,\\,0.21,\\,0.03]\\). The cost is storing one 16-bit scale per group: bits per weight \\(=b+16/g\\)."}, "duration": 46.7}, {"title": "The bit ladder, the names, and how you actually quantize", "short": "Bit ladder", "video": "media/ch4-bit-ladder.mp4", "poster": "media/ch4-bit-ladder-poster.jpg", "steps": [{"key": "bridge", "title": "Recap: the two pieces from today", "html": "Error per weight ≤ \\(s/2\\), with \\(s=\\max|w|/(\\text{ticks per side})\\). Bits per weight \\(=b+16/g\\). And from Lesson 13: GB = params (billions) × bits per weight / 8. Now: how far down can you go?", "start": 0.7, "end": 7.6}, {"key": "levels", "title": "Worked example 1: what each bit costs", "html": "Ticks per side \\(=2^{b-1}-1\\): 8 bits → 127, 6 → 31, 5 → 15, 4 → 7, 3 → 3, 2 → 1. Each bit you drop halves the ticks, doubles \\(s\\), and doubles the worst error. With \\(\\max|w|=1.27\\): 8-bit \\(s=0.01\\), 4-bit \\(s=1.27/7\\approx0.18\\), about 18× coarser. Edge case, 2 bits: one tick per side, so every weight becomes \\(-s\\), 0 or \\(+s\\).", "start": 7.6, "end": 17.4}, {"key": "ladder", "title": "Worked example 2: LFM2-1.2B down the ladder", "html": "Weights only: fp32 \\(1.2\\times32/8=\\)4.8 GB · bf16 2.4 GB · Q8_0 \\(1.2\\times8.5/8\\approx\\)1.28 GB · Q4_0 \\(1.2\\times4.5/8\\approx\\)0.68 GB. Rule of thumb (not a law): 8 bits is usually indistinguishable from bf16, 5–6 bits lose a little, 4 bits is the common default for running models locally, and at 3 and 2 bits quality drops fast, especially for small models like a 1.2B. <b>Order, biggest to smallest: fp32, bf16/fp16, Q8, Q6, Q5, Q4, Q3, Q2.</b>", "start": 17.4, "end": 28.4}, {"key": "names", "title": "Reading the names on GGUF files", "html": "GGUF is the file format llama.cpp (and tools built on it, like LM Studio) runs. The number is the bits per integer. <b>_0</b> is the simple scheme you just learned: blocks of 32 with one scale. <b>_K</b> means “k-quants”: blocks grouped into super-blocks, with the scales themselves quantized to save space. <b>_S / _M / _L</b> (small / medium / large) say how many sensitive tensors are kept at more bits. So Q4_K_M averages about 4.8–4.9 bits per weight, not exactly 4.", "start": 28.4, "end": 38.2}, {"key": "process", "title": "How you actually quantize (PTQ)", "html": "<b>Post-training quantization</b>, no retraining: (1) start from the trained bf16 checkpoint; (2) pick \\(b\\) and \\(g\\); (3) for each group, compute \\(s\\), round, store \\(q\\) and \\(s\\); (4) at inference, dequantize on the fly inside each matrix multiply. In practice: llama.cpp's <code>convert_hf_to_gguf.py</code> then <code>llama-quantize model-f16.gguf model-Q4_K_M.gguf Q4_K_M</code>; or in Hugging Face, bitsandbytes with <code>load_in_4bit=True</code> (what QLoRA uses). GPTQ and AWQ use the same ruler idea but use a small calibration set to round more cleverly. QAT (training with the rounding in the loop) is the next lesson.", "start": 38.2, "end": 49.2}, {"key": "faded", "title": "Your turn: LFM2-2.6B at Q4_0", "html": "Bits per weight \\(=4+16/32=4.5\\). GB \\(=2.6\\times4.5/8=\\)? <details><summary>Check your last step</summary>\\(\\approx\\)<b>1.46 GB</b> (vs 5.2 GB in bf16).</details>", "start": 49.2, "end": 56.5}], "check": {"id": "c4", "q": "(a) LFM2-1.2B at Q8_0 (8.5 bits): how many GB? Does it fit in 1 GB? Does Q4_0 (4.5 bits)? (b) In one or two sentences: why does 4-bit lose much more than half of 8-bit's precision? (c) Name the four steps of post-training quantization.", "model": "(a) Q8_0: \\(1.2\\times8.5/8\\approx\\)<b>1.28 GB</b>, doesn't fit. Q4_0: \\(1.2\\times4.5/8\\approx\\)<b>0.68 GB</b>, fits (with room left for the KV cache). (b) The number of ticks per side is \\(2^{b-1}-1\\): 127 at 8 bits, 7 at 4 bits, so the spacing and the worst error are about <b>18×</b> bigger, not 2×. (c) Start from the trained checkpoint → choose bits and group size → per group compute the scale, round, store ints + scales → dequantize on the fly at inference."}, "hook": {"id": "h4", "q": "You want LFM2-1.2B on a phone with about 1 GB free for weights. (a) What's the most bits per weight you can afford? (b) Going from 8-bit to 4-bit halves the memory. Does it also just halve the precision? (c) Put these in order from largest to smallest file: Q4_K_M, bf16, Q8_0, Q2_K, Q6_K.", "model": "(a) 1 GB / 1.2B params ≈ 0.83 bytes ≈ <b>6.7 bits</b> per weight, so something in the 4–6 bit range. (b) <b>No.</b> int8 has 127 ticks per side and int4 only 7, so the tick spacing is \\(127/7\\approx\\)<b>18× coarser</b>; each bit you drop doubles the rounding error. (c) <b>bf16 > Q8_0 > Q6_K > Q4_K_M > Q2_K</b>."}, "duration": 56.5}], "summary": ["Quantize = pick a scale \\(s=\\max|w|/(2^{b-1}-1)\\), store \\(q=\\mathrm{round}(w/s)\\) in b bits, and use \\(\\hat w=q\\cdot s\\). The worst error is \\(s/2\\). One big outlier makes \\(s\\) big for everyone, and small weights round to 0.", "Groups give every block of g weights its own scale, so an outlier only hurts its block. The cost is the scales: bits per weight \\(=b+16/g\\) (Q4_0 = 4.5, Q8_0 = 8.5).", "Each bit you drop doubles the rounding error (8 → 4 bits is ≈ 18× coarser). Order: fp32 > bf16 > Q8 > Q6 > Q5 > Q4 > Q3 > Q2; 8-bit is usually lossless, 4-bit the common local default. PTQ = scale, round, store, dequantize on the fly (llama.cpp llama-quantize, bitsandbytes 4-bit; GPTQ/AWQ round smarter with calibration data). QAT is next."]};

function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
