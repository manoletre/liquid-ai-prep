<script>
const LESSON = {"id": "l09", "title": "Lesson 9 · Backprop by hand on a tiny network", "h1": "Backprop by hand on a tiny network", "sub": "Lesson 9 · a recall warm-up, then 3 new ideas, one per chapter: a nudge gets multiplied by every local slope it passes (the chain rule on a chain of boxes), the backward pass (a δ for every node, δ × input for every weight), and where paths split the δs add, written as matrices at the end for the coding round. A slow redo of what Lesson 4 rushed. Every number works on paper, so have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up: in plain numpy, write the forward and backward pass for a 2-layer net. X has shape (N, d), W1 is (d, H), there's a ReLU, w2 has shape (H,), y has shape (N,), and the loss is ½·MSE. Return the gradients for W1, b1, w2 and b2.", "model": "<pre><code># forward: save what backward needs\nZ = X @ W1 + b1             # (N, H)\nH = np.maximum(Z, 0)        # ReLU\nyhat = H @ w2 + b2          # (N,)\nloss = 0.5 * np.mean((yhat - y) ** 2)\n\n# backward: same two rules, averaged over N\ndy  = (yhat - y) / N        # δ at the top   (N,)\ndw2 = H.T @ dy              # δ × input      (H,)\ndb2 = dy.sum()\ndH  = np.outer(dy, w2)      # δ_h = δ · w2   (N, H)\ndZ  = dH * (Z > 0)          # ReLU gate\ndW1 = X.T @ dZ              # δ × input      (d, H)\ndb1 = dZ.sum(axis=0)</code></pre>Say these out loud: every shape, why you keep Z (for the gate) and H (for dw2), the 1/N from the mean, and that a bias is a weight whose input is always 1, so its gradient is just δ summed over the batch."}, {"id": "d2", "q": "How would you check that your backward pass is correct?", "model": "A <b>gradient check</b>, which is Chapter 2's nudge test. For a few weights, compute (L(w + ε) − L(w − ε)) / 2ε with ε ≈ 1e-5 in float64, and compare it with the analytic gradient. Relative error around 1e-7 is fine; around 1e-2 means a bug. Watch out for the ReLU kink at 0 and for randomness such as dropout, which should be off during the check."}, {"id": "d3", "q": "Your loss won't move, and half your hidden units output 0 for every input. What's going on, and what do you try?", "model": "<b>Dead ReLUs</b> (Chapter 3, example 2). Those units have z &lt; 0 for every input, so ReLU′ = 0, no δ gets through, and their incoming weights never update. Common causes are too large a learning rate, which knocked the weights into the negative region, and bad initialization or negative biases. Try a lower lr, He initialization, a leaky ReLU or GELU, and check the share of units that are active."}, {"id": "d4", "q": "Why do deep nets with sigmoid activations train slowly in their early layers?", "model": "Nudges multiply (Chapter 2). Every sigmoid on the way back multiplies δ by its slope p(1 − p), which is at most ¼. Through 10 layers that's at most (¼)¹⁰ ≈ 1e-6, so the early layers barely get any gradient. This is the <b>vanishing gradient</b> problem. ReLU's slope is 1 when it's on, and residual connections give δ a path that skips the multiplications."}, {"id": "d5", "q": "LoRA freezes the base weight W and trains a small update BA beside it. During backprop, what is still computed for the frozen layer, and what is skipped? Why does that save memory?", "model": "δ <b>still flows through W</b> (Wᵀδ), because the layers below need it. What's skipped is <b>∂L/∂W</b>, along with storing it and its Adam state (two more tensors the size of W). Only ∂L/∂A and ∂L/∂B are kept, and with r = 32 those are tiny next to W. You still need the saved activations for the backward pass, so activation memory doesn't shrink much."}], "key": ["xin", "w", "hid", "yhat", "loss", "delta", "relu", "eta"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "xin": ["x · input", "The number (or vector) fed into the network."], "hid": ["h · hidden unit", "A middle value, h = ReLU(z). Saved on the forward pass because the backward pass reuses it."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Starts as ŷ − y (or p − y) and is passed backward."], "relu": ["ReLU", "max(0, z). Slope 1 when z > 0, 0 when z < 0, so an OFF unit passes no gradient back."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: PPO clip on both sides, one L2 step, underfit vs dropout, CE = H + KL", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "clip", "title": "Lesson 1: the PPO clip, both sides", "html": "With \\(\\epsilon=0.1\\) the range is \\([0.9,\\,1.1]\\), and the objective is \\(\\min(\\rho A,\\ \\mathrm{clip}(\\rho,0.9,1.1)A)\\) with \\(A=+2\\). <b>ρ = 0.85:</b> \\(\\min(1.70,\\,1.80)=1.70\\). That's the unclipped term, so the slope is nonzero and the good response still gets pushed up. <b>ρ = 1.15:</b> \\(\\min(2.30,\\,2.20)=2.20\\). That's the clipped term, which is flat in ρ, so the <b>gradient is 0</b>. Clipping only stops moves that go further in the direction the advantage wants.", "start": 0.0, "end": 9.9}, {"key": "l2", "title": "Lesson 8: one L2 step", "html": "$$w\\leftarrow(1-2\\eta\\lambda)\\,w-\\eta g$$ \\(1-2\\cdot0.05\\cdot2=0.8\\). Decay: \\(0.8\\cdot10=8\\). Data step: \\(-\\eta g=-0.05\\cdot(-1)=+0.05\\). New \\(w=\\)<b>8.05</b>. The 2 comes from \\(\\tfrac{d}{dw}w^2=2w\\).", "start": 9.9, "end": 18.3}, {"key": "bv", "title": "Lesson 8: diagnose first, then pick a lever", "html": "Train 25% and val 26%: the <b>level</b> is high and the <b>gap</b> is tiny, so it's <b>underfit</b>. Dropout and a bigger \\(\\lambda\\) are regularizers. They fight overfitting and make underfitting <i>worse</i>. Instead, add capacity, train longer, or weaken \\(\\lambda\\). (The numbers are made up.)", "start": 18.3, "end": 26.35}, {"key": "kl", "title": "Lesson 6: CE = H + KL, and which way KL blows up", "html": "\\(H(P,Q)=H(P)+D_{KL}(P\\|Q)\\), so \\(D_{KL}=1.1-0.8=\\)<b>0.3 bits</b>. With \\(P=[\\tfrac34,\\tfrac14]\\) and \\(Q=[1,0]\\), \\(D_{KL}(P\\|Q)\\) contains \\(\\tfrac14\\log_2\\frac{1/4}{0}=\\)<b>∞</b>, because Q rules out an outcome P allows. \\(D_{KL}(Q\\|P)=1\\cdot\\log_2\\frac{1}{3/4}=\\log_2\\tfrac43\\approx\\)<b>0.415 bits</b>, because Q's zero term drops out.", "start": 26.35, "end": 34.95}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) PPO with ε = 0.1 and a bad response (A = −1) whose ratio fell to ρ = 0.85. Clipped or not, and is there a gradient? (Compare ρA with clip(ρ)·A.) (b) Pure decay: w = −3, g = 0, η = 0.1, λ = 1. What is the new w? (c) L1 or L2: which one gives exact zeros, and why, in one sentence? (d) Training lowers cross-entropy from 1.4 to 1.2 bits on data with H(P) = 1.0 bit. What happened to the KL?", "model": "(a) ρA = −0.85 and clip(0.85)·A = 0.9·(−1) = −0.90. The min is −0.90, the clipped term, so it's <b>clipped and the gradient is 0</b>: the bad response has already been pushed down past 1 − ε for this batch. (b) Multiplier 1 − 2·0.1·1 = 0.8, so w = 0.8·(−3) = <b>−2.4</b>. It shrinks toward 0 from below. (c) <b>L1.</b> Its push toward 0, λ·sign(w), stays the same size however small w gets, so it can land exactly on 0 (the diamond's corners). L2's push 2λw fades as w shrinks. (d) KL went from 1.4 − 1.0 = 0.4 to 1.2 − 1.0 = <b>0.2 bits</b>. H(P) is fixed by the data, so all of the improvement came out of the KL."}, "hook": {"id": "h1", "q": "From memory, four quick ones. (a) PPO with ε = 0.1 and a good response (A = +2). Case 1: ρ = 1.15. Case 2: ρ = 0.85. For each, is it clipped, and does it still get a gradient? (b) One L2 step: w = 10, data gradient g = −1, η = 0.05, λ = 2. What is the new w? (c) Train WER 25%, val WER 26% (made-up numbers). Underfit or overfit? Would more dropout help? (d) H(P) = 0.8 bits and H(P,Q) = 1.1 bits: what is D_KL(P‖Q)? With P = [¾, ¼] and Q = [1, 0], which of D(P‖Q) and D(Q‖P) is infinite? Compute the other one.", "model": "(a) The range is [0.9, 1.1]. <b>ρ = 1.15: clipped.</b> min(ρA, clip·A) = min(2.30, 2.20) = 2.20, the flat clipped term, so the <b>gradient is 0</b>: the response has already been pushed up enough for this batch. <b>ρ = 0.85: not clipped.</b> min(1.70, 1.80) = 1.70, the unclipped term, so the gradient is nonzero: a good response that became less likely can always be pushed back up. (b) Multiplier 1 − 2·0.05·2 = 0.8. New w = 0.8·10 − 0.05·(−1) = 8 + 0.05 = <b>8.05</b>. (c) Both are high and the gap is tiny, so it's <b>underfit</b>. Dropout is a regularizer, so it would make this <b>worse</b>. Add capacity, train longer, or weaken λ. (d) D_KL = 1.1 − 0.8 = <b>0.3 bits</b>. <b>D(P‖Q) = ∞</b>, because Q gives 0 to an outcome P allows. D(Q‖P) = 1·log₂(1 ÷ ¾) = log₂(4/3) ≈ <b>0.415 bits</b>."}, "duration": 34.95}, {"title": "Nudges multiply: the chain rule on a chain of boxes", "short": "Chain rule", "video": "media/ch2-nudges-multiply.mp4", "poster": "media/ch2-nudges-multiply-poster.jpg", "steps": [{"key": "recap", "title": "Bridge: Lesson 7 was already a chain", "html": "Logistic regression is three boxes: \\(w\\to z=wx\\to p=\\sigma(z)\\to L=-\\log p\\). Its gradient was a product of one local slope per box: $$\\frac{dL}{dw}=\\frac{dL}{dp}\\cdot\\frac{dp}{dz}\\cdot\\frac{dz}{dw}=(p-y)\\,x$$ A neural network is the same thing with more boxes. This whole lesson applies that one rule, carefully.", "start": 0.0, "end": 7.6}, {"key": "fwd", "title": "Forward pass: left to right, saving every value", "html": "Chain: \\(a=3x\\), then \\(L=a^2\\). At \\(x=1\\): \\(a=3\\) and \\(L=9\\). Write each value down, because the backward pass will need them.", "start": 7.6, "end": 15.2}, {"key": "local", "title": "Each box's local slope", "html": "A box's <b>local slope</b> is how much its output moves per unit of its own input, and nothing more. For the \\(\\times3\\) box, \\(\\frac{da}{dx}=3\\). For the square, \\(\\frac{dL}{da}=2a=6\\), using the saved \\(a=3\\). Each box only needs the value it saw on the way forward.", "start": 15.2, "end": 21.6}, {"key": "ex1", "title": "Worked example 1: nudges multiply", "html": "Nudge \\(x\\) by \\(+0.01\\). The \\(\\times3\\) box turns that into \\(+0.03\\) on \\(a\\), and the square turns it into about \\(6\\times0.03=0.18\\) on \\(L\\). So $$\\frac{dL}{dx}=\\frac{dL}{da}\\cdot\\frac{da}{dx}=6\\cdot3=18$$ Check: \\(3.03^2=9.1809\\), a change of \\(0.1809\\approx18\\times0.01\\) ✓. This is the <b>chain rule</b>: a nudge gets multiplied by every slope it passes.", "start": 21.6, "end": 28.6}, {"key": "ex2", "title": "Worked example 2 (edge case): an OFF ReLU", "html": "\\(\\mathrm{ReLU}(z)=\\max(0,z)\\) passes positive values and blocks negative ones. Its slope is 1 for \\(z>0\\) and 0 for \\(z<0\\) (at exactly 0, code usually uses 0). Take the chain \\(z=-2x,\\ h=\\mathrm{ReLU}(z),\\ L=(h-1)^2\\) at \\(x=1\\): \\(z=-2,\\ h=0,\\ L=1\\). The slopes are \\(-2\\), \\(0\\) and \\(2(h-1)=-2\\), and their product is \\((-2)\\cdot0\\cdot(-2)=\\)<b>0</b>. A small nudge to \\(x\\) leaves \\(z\\) negative, so \\(h\\) stays 0 and \\(L\\) doesn't move.", "start": 28.6, "end": 38.3}, {"key": "faded", "title": "Your turn: multiply the slopes", "html": "\\(a=x-3,\\ L=a^2\\) at \\(x=2\\): \\(a=-1,\\ L=1\\). The slopes are \\(\\frac{da}{dx}=1\\) and \\(\\frac{dL}{da}=2a=-2\\). <details><summary>Check your last step</summary>\\(\\frac{dL}{dx}=(-2)\\cdot1=\\)<b>−2</b>. It's negative, so increasing \\(x\\) lowers \\(L\\): move \\(x\\) up toward 3, where \\(L=0\\). Gradient descent does exactly this: \\(x\\leftarrow x-\\eta\\cdot(-2)\\).</details>", "start": 38.3, "end": 45.5}], "check": {"id": "c2", "q": "x = 0.5 → z = 4x → h = ReLU(z) → L = (h − 3)². (a) Run the forward pass. (b) Write each box's local slope. (c) Compute dL/dx. Which way should x move? (d) Redo (c) for x = −0.5.", "model": "(a) z = 2, h = 2, L = (2 − 3)² = <b>1</b>. (b) dz/dx = 4. dh/dz = 1, because z = 2 &gt; 0. dL/dh = 2(h − 3) = −2. (c) dL/dx = 4 · 1 · (−2) = <b>−8</b>. It's negative, so <b>increase x</b>: that raises h toward 3. (d) z = −2, so h = 0 and L = 9. The ReLU's slope is 0, so dL/dx = 4 · 0 · (−6) = <b>0</b>. The loss is high, but a small nudge can't help, because the ReLU is off."}, "hook": {"id": "h2", "q": "A chain of two boxes: x → a = 3x → L = a². At x = 1 you get a = 3 and L = 9. If you nudge x up by 0.01, about how much does L change? So what is dL/dx? (No calculus needed: think about what each box does to a small nudge.)", "model": "The ×3 box turns a 0.01 nudge into 0.03 on a. Near a = 3 the square changes by about 2a = 6 per unit of a, so L moves by about 6 × 0.03 = <b>0.18</b>. So dL/dx ≈ 0.18 / 0.01 = <b>18 = 6 · 3</b>, the product of the two boxes' local slopes. That product is the chain rule. Check: 3.03² = 9.1809, a change of 0.1809."}, "duration": 45.5}, {"title": "The backward pass: a δ for every node, a gradient for every weight", "short": "Backward", "video": "media/ch3-backward-pass.mp4", "poster": "media/ch3-backward-pass-poster.jpg", "steps": [{"key": "recap", "title": "Bridge: two pieces you already have", "html": "Tiny network: \\(z=w_1x\\), \\(h=\\mathrm{ReLU}(z)\\), \\(\\hat y=w_2h\\), \\(L=\\tfrac12(\\hat y-y)^2\\). From Chapter 2: a nudge is multiplied by each local slope it passes. From Lesson 7: a weight's gradient is error × input, \\((p-y)x\\). Backprop does both at once, walking from the loss back to the input.", "start": 0.0, "end": 8.0}, {"key": "fwd", "title": "Worked example 1: the forward pass", "html": "\\(x=1,\\ w_1=2,\\ w_2=1,\\ y=3\\). \\(z=2\\cdot1=2\\), \\(h=\\mathrm{ReLU}(2)=2\\), \\(\\hat y=1\\cdot2=2\\), \\(L=\\tfrac12(2-3)^2=\\)<b>0.5</b>. Save \\(z\\), \\(h\\) and \\(\\hat y\\).", "start": 8.0, "end": 15.9}, {"key": "delta", "title": "Start at the end: δŷ = ŷ − y", "html": "Give every node a <b>δ</b> (delta): \\(\\delta_{\\text{node}}=\\partial L/\\partial\\,\\text{node}\\), how much \\(L\\) moves per nudge of that node. At the top: $$\\delta_{\\hat y}=\\frac{d}{d\\hat y}\\tfrac12(\\hat y-y)^2=\\hat y-y=2-3=-1$$ The ½ is there to cancel the 2 from the square. A negative δ means raising \\(\\hat y\\) would lower the loss.", "start": 15.9, "end": 22.1}, {"key": "back", "title": "Walk back: multiply by each local slope", "html": "$$\\delta_{\\text{in}}=\\delta_{\\text{out}}\\times(\\text{local slope})$$ The box \\(\\hat y=w_2h\\) has slope \\(w_2\\) with respect to \\(h\\), so \\(\\delta_h=\\delta_{\\hat y}\\cdot w_2=(-1)\\cdot1=-1\\). The ReLU's slope is 1 because \\(z=2>0\\), so \\(\\delta_z=\\delta_h\\cdot1=-1\\). Each step reuses a value saved on the way forward.", "start": 22.1, "end": 28.2}, {"key": "wgrad", "title": "Weight gradients: the δ after the weight × its input", "html": "For a box \\(\\text{out}=w\\cdot\\text{in}\\), the slope with respect to \\(w\\) is \\(\\text{in}\\), so $$\\frac{\\partial L}{\\partial w}=\\delta_{\\text{out}}\\times\\text{in}$$ \\(\\frac{\\partial L}{\\partial w_2}=\\delta_{\\hat y}\\cdot h=(-1)\\cdot2=\\)<b>−2</b>. \\(\\frac{\\partial L}{\\partial w_1}=\\delta_z\\cdot x=(-1)\\cdot1=\\)<b>−1</b>. This has the same shape as Lesson 7's \\((p-y)x\\): the δ just after the weight, times what came in.", "start": 28.2, "end": 35.2}, {"key": "update", "title": "One update, and a check that it worked", "html": "With \\(\\eta=0.1\\): \\(w_2\\leftarrow1-0.1\\cdot(-2)=1.2\\) and \\(w_1\\leftarrow2-0.1\\cdot(-1)=2.1\\). New forward pass: \\(z=h=2.1\\), \\(\\hat y=1.2\\cdot2.1=2.52\\), \\(L=\\tfrac12(0.48)^2\\approx0.12\\), down from 0.5 ✓. Both gradients were negative because \\(\\hat y\\) was too low, so both weights went up.", "start": 35.2, "end": 41.9}, {"key": "ex2", "title": "Worked example 2 (edge case): a dead ReLU", "html": "\\(x=1,\\ w_1=-1,\\ w_2=2,\\ y=1\\): \\(z=-1\\), \\(h=0\\), \\(\\hat y=0\\), \\(L=0.5\\). \\(\\delta_{\\hat y}=-1\\). \\(\\frac{\\partial L}{\\partial w_2}=\\delta_{\\hat y}\\cdot h=0\\) because \\(h=0\\), like a feature with \\(x=0\\) in Lesson 7. \\(\\delta_h=(-1)\\cdot2=-2\\), but \\(\\delta_z=\\delta_h\\cdot\\mathrm{ReLU}'(-1)=0\\), so \\(\\frac{\\partial L}{\\partial w_1}=0\\). The loss is 0.5 and nothing learns: this is a <b>dead ReLU</b>. Common fixes are a leaky ReLU, careful initialization, and a smaller learning rate.", "start": 41.9, "end": 49.5}, {"key": "faded", "title": "Your turn: the last step", "html": "\\(x=2,\\ w_1=1,\\ w_2=-1,\\ y=0\\): \\(z=2,\\ h=2,\\ \\hat y=-2,\\ L=2\\). \\(\\delta_{\\hat y}=-2\\), \\(\\frac{\\partial L}{\\partial w_2}=(-2)\\cdot2=-4\\), \\(\\delta_h=(-2)\\cdot(-1)=2\\), \\(\\delta_z=2\\cdot1=2\\). <details><summary>Check your last step: ∂L/∂w₁</summary>\\(\\delta_z\\cdot x=2\\cdot2=\\)<b>4</b>. It's positive, so \\(w_1\\) goes down. With \\(w_2=-1\\), a smaller \\(h\\) makes \\(\\hat y\\) less negative, closer to \\(y=0\\).</details>", "start": 49.5, "end": 57.3}], "check": {"id": "c3", "q": "Same network: z = w₁x, h = ReLU(z), ŷ = w₂h, L = ½(ŷ − y)². Take x = 3, w₁ = 1, w₂ = 2, y = 4. (a) Run the forward pass. (b) Compute δŷ, ∂L/∂w₂, δh, δz and ∂L/∂w₁. (c) Which way does each weight move? Why is ∂L/∂w₁ the bigger one? (d) Change w₁ to −1. Which gradients become 0, and why?", "model": "(a) z = 3, h = 3, ŷ = 6, L = ½(6 − 4)² = <b>2</b>. (b) δŷ = 6 − 4 = <b>2</b>. ∂L/∂w₂ = δŷ · h = 2 · 3 = <b>6</b>. δh = δŷ · w₂ = 2 · 2 = <b>4</b>. δz = 4 · 1 = <b>4</b>, since z &gt; 0. ∂L/∂w₁ = δz · x = 4 · 3 = <b>12</b>. (c) Both gradients are positive, so <b>both weights go down</b>, which lowers ŷ toward 4. ∂L/∂w₁ is bigger because on the way back its signal was multiplied by w₂ = 2 and then by x = 3. (d) z = −3, so h = 0 and ŷ = 0. ∂L/∂w₂ = δŷ · h = <b>0</b>, because h = 0. δz = δh · ReLU′(−3) = 0, so ∂L/∂w₁ = <b>0</b>. Both are 0: the ReLU is dead."}, "hook": {"id": "h3", "q": "Tiny network: z = w₁x, h = ReLU(z), ŷ = w₂h, L = ½(ŷ − y)². Take x = 1, w₁ = 2, w₂ = 1, y = 3. (a) Run the forward pass. (b) Should w₁ and w₂ go up or down? (c) Try to compute ∂L/∂w₂ and ∂L/∂w₁.", "model": "(a) z = 2, h = 2, ŷ = 2, L = ½(2 − 3)² = <b>0.5</b>. (b) ŷ is too low (2 &lt; 3) and everything on the path is positive, so <b>both should go up</b>. (c) Start at the end: δŷ = ŷ − y = −1. ∂L/∂w₂ = δŷ · h = <b>−2</b>. Walk back: δh = δŷ · w₂ = −1, and δz = δh · 1 = −1 (the ReLU is on). ∂L/∂w₁ = δz · x = <b>−1</b>. Both gradients are negative, so gradient descent raises both weights."}, "duration": 57.3}, {"title": "Where paths split, gradients add, and the matrix form", "short": "Paths add", "video": "media/ch4-paths-add.mp4", "poster": "media/ch4-paths-add-poster.jpg", "steps": [{"key": "recap", "title": "Bridge: the two rules from Chapter 3", "html": "\\(\\delta_{\\text{in}}=\\delta_{\\text{out}}\\times\\) local slope, and \\(\\partial L/\\partial w=\\) the δ just after \\(w\\) × the input it multiplied. In the new network \\(x\\) feeds <b>two</b> hidden units, \\(h_1=\\mathrm{ReLU}(a_1x)\\) and \\(h_2=\\mathrm{ReLU}(a_2x)\\). Then \\(\\hat y=v_1h_1+v_2h_2\\) and \\(L=\\tfrac12(\\hat y-y)^2\\). What is \\(x\\)'s δ when it reaches the loss along two paths?", "start": 0.0, "end": 6.9}, {"key": "fwd", "title": "Worked example 1: the forward pass", "html": "\\(x=1,\\ a_1=1,\\ a_2=2,\\ v_1=v_2=1,\\ y=2\\). \\(h_1=\\mathrm{ReLU}(1)=1\\), \\(h_2=\\mathrm{ReLU}(2)=2\\), \\(\\hat y=1+2=3\\), \\(L=\\tfrac12(3-2)^2=0.5\\).", "start": 6.9, "end": 15.783}, {"key": "back", "title": "Backward to every weight", "html": "\\(\\delta_{\\hat y}=3-2=1\\). Output weights: \\(\\frac{\\partial L}{\\partial v_1}=\\delta_{\\hat y}h_1=1\\) and \\(\\frac{\\partial L}{\\partial v_2}=\\delta_{\\hat y}h_2=2\\). Back into the units: \\(\\delta_{h_1}=\\delta_{\\hat y}v_1=1\\) and \\(\\delta_{h_2}=\\delta_{\\hat y}v_2=1\\). Both ReLUs are on (slope 1), so \\(\\frac{\\partial L}{\\partial a_1}=\\delta_{h_1}\\cdot1\\cdot x=1\\) and \\(\\frac{\\partial L}{\\partial a_2}=\\delta_{h_2}\\cdot1\\cdot x=1\\).", "start": 15.783, "end": 22.383}, {"key": "sum", "title": "Where paths meet, the δs add", "html": "Nudge \\(x\\) by 0.01: \\(h_1\\) moves \\(+0.01\\) and \\(h_2\\) moves \\(+0.02\\), so \\(\\hat y\\) moves \\(+0.03\\) and \\(L\\) moves about \\(+0.03\\) (exactly \\(\\tfrac12\\cdot1.03^2-0.5=0.03045\\)). The two paths' effects <b>add</b>: $$\\delta_x=\\delta_{h_1}a_1+\\delta_{h_2}a_2=1\\cdot1+1\\cdot2=3$$ The rule: a node's δ is the <b>sum over every place it's used</b>. Why care about \\(\\delta_x\\)? In a deeper net, \\(x\\) is the output of the layer below, and its δ is exactly what that layer needs to compute its own gradients.", "start": 22.383, "end": 28.783}, {"key": "ex2", "title": "Worked example 2 (edge case): one dead path", "html": "\\(x=1,\\ a_1=1,\\ a_2=-1,\\ v_1=2,\\ v_2=5,\\ y=1\\): \\(h_1=1\\), \\(h_2=\\mathrm{ReLU}(-1)=0\\), \\(\\hat y=2\\), \\(L=0.5\\). \\(\\delta_{\\hat y}=1\\). \\(\\frac{\\partial L}{\\partial v_1}=1\\) and \\(\\frac{\\partial L}{\\partial v_2}=1\\cdot0=0\\). \\(\\delta_{h_1}=2\\). \\(\\delta_{h_2}=5\\), but the ReLU gate is 0, so \\(\\frac{\\partial L}{\\partial a_2}=0\\) and that path adds nothing: \\(\\delta_x=2\\cdot1+0=\\)<b>2</b>. Only live paths count, even though \\(v_2=5\\) is big.", "start": 28.783, "end": 36.383}, {"key": "matrix", "title": "Many units at once: the matrix form", "html": "With a whole vector of hidden units, the same two rules become matrix operations: $$\\frac{\\partial L}{\\partial W}=\\boldsymbol\\delta_{\\text{out}}\\,\\mathbf{in}^\\top\\quad(\\text{δ × input, for every pair})$$ $$\\boldsymbol\\delta_{\\text{in}}=W^\\top\\boldsymbol\\delta_{\\text{out}}\\quad(\\text{sum over every place it's used})$$ The ReLU gate multiplies δ elementwise by \\((z>0)\\). In numpy, with a batch of rows: <code>dW1 = X.T @ dZ</code>, <code>dH = dY @ W2.T</code>, <code>dZ = dH * (Z &gt; 0)</code>. The drill writes it out in full.", "start": 36.383, "end": 46.083}, {"key": "swap", "title": "Swap the loss: only the first δ changes", "html": "For a classifier, the top becomes a score \\(z\\), then \\(p=\\sigma(z)\\), then cross-entropy. Lesson 7 showed \\(\\frac{\\partial L}{\\partial z}=p-y\\) (the sigmoid's slope cancels), so \\(\\delta_z=p-y\\) replaces \\(\\hat y-y\\) and <b>everything below stays the same</b>. Backprop is modular. The same view explains LoRA: the base \\(W\\) is frozen, so the backward pass still sends \\(W^\\top\\delta\\) down to earlier layers, but it never computes or stores \\(\\partial L/\\partial W\\) or its optimizer state. Only the small adapter gets gradients.", "start": 46.083, "end": 53.683}, {"key": "faded", "title": "Your turn: add the two paths", "html": "\\(x=2,\\ a_1=a_2=1,\\ v_1=1,\\ v_2=-1,\\ y=1\\): \\(h_1=h_2=2\\), \\(\\hat y=0\\), \\(L=0.5\\). \\(\\delta_{\\hat y}=-1\\), \\(\\delta_{h_1}=-1\\), \\(\\delta_{h_2}=1\\). <details><summary>Check your last step: δx</summary>\\(\\delta_x=(-1)\\cdot1+1\\cdot1=\\)<b>0</b>. The two paths cancel: nudging \\(x\\) raises \\(h_1\\) and \\(h_2\\) by the same amount, and \\(v_1=1\\), \\(v_2=-1\\) cancel in \\(\\hat y\\). So a zero δ can come from paths cancelling, not only from dead units.</details>", "start": 53.683, "end": 61.583}], "check": {"id": "c4", "q": "Same two-unit network. Take x = 1, a₁ = 2, a₂ = 1, v₁ = −1, v₂ = 3, y = 2. (a) Run the forward pass. (b) Compute ∂L/∂v₁, ∂L/∂v₂, ∂L/∂a₁ and ∂L/∂a₂. (c) Compute δx by adding the paths, and check it with a 0.01 nudge. (d) If the top were a sigmoid plus cross-entropy instead (same z = v₁h₁ + v₂h₂), what single number changes, and what stays the same in your work?", "model": "(a) h₁ = 2, h₂ = 1, ŷ = −2 + 3 = 1, L = ½(1 − 2)² = <b>0.5</b>. (b) δŷ = −1. ∂L/∂v₁ = δŷ·h₁ = <b>−2</b> and ∂L/∂v₂ = δŷ·h₂ = <b>−1</b>. δh₁ = δŷ·v₁ = 1 and δh₂ = δŷ·v₂ = −3. Both ReLUs are on, so ∂L/∂a₁ = 1·x = <b>1</b> and ∂L/∂a₂ = −3·x = <b>−3</b>. (c) δx = δh₁·a₁ + δh₂·a₂ = 1·2 + (−3)·1 = <b>−1</b>. Nudge check: h₁ moves +0.02 and h₂ +0.01, so ŷ moves −0.02 + 0.03 = +0.01 toward y = 2, and L drops by about 0.01 ✓. (d) Only the <b>top δ</b> changes: it becomes p − y = σ(1) − 1 ≈ −0.27 instead of −1. Every rule below is identical, so every gradient gets scaled by 0.27 here."}, "hook": {"id": "h4", "q": "Now x feeds two hidden units: h₁ = ReLU(a₁x), h₂ = ReLU(a₂x), ŷ = v₁h₁ + v₂h₂, L = ½(ŷ − y)². Take x = 1, a₁ = 1, a₂ = 2, v₁ = v₂ = 1, y = 2. (a) Run the forward pass. (b) If you nudge x by 0.01, about how much does L change? Should the two paths' effects be added, multiplied or averaged?", "model": "(a) h₁ = 1, h₂ = 2, ŷ = 3, L = ½(3 − 2)² = <b>0.5</b>. (b) <b>Added.</b> The nudge moves h₁ by 0.01 and h₂ by 0.02, so ŷ moves by 0.03 and L by about 1 · 0.03 = <b>0.03</b>. In δ terms: δŷ = 1, δh₁ = δh₂ = 1, and δx = δh₁·a₁ + δh₂·a₂ = 1 + 2 = <b>3</b>. A node's δ is the sum over every place it's used."}, "duration": 61.583}], "summary": ["Chain rule as nudges: a small nudge gets multiplied by every local slope it passes, so dL/dx is the product of the slopes. An OFF ReLU (slope 0) kills it.", "Backward pass: save the forward values, start with δŷ = ŷ − y (or p − y for sigmoid + cross-entropy), then walk back with δ_in = δ_out × local slope. Weight gradient = the δ just after the weight × the input it multiplied, the same shape as (p − y)x.", "Where a value feeds several places, its δ is the sum over those places. Dead units add 0, and paths can also cancel.", "Matrix form: ∂L/∂W = δ · inᵀ (in numpy, X.T @ dZ) and δ_in = Wᵀδ, gated by (z > 0) for ReLU. Check it with finite differences."]};

const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>

function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>

  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>

    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>

    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>

function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>

function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);

    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}

function render(){const cur=SCR[scr];

    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});

  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}

function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
