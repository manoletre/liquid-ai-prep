<title>Lesson 3 · Evaluation metrics, crystal clear</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

<style>
/* Lesson player v4: one full-screen chapter at a time. Flow per chapter: question → learn (video steps) → compare → practice. */
:root{--bg:#0e1117;--card:#151a23;--card2:#1b212d;--fg:#e6e6e6;--muted:#8b93a7;--line:#262d3a;--top:52px;--foot:62px;
--pi:#b392f0;--old:#e08fd0;--y:#7aa2f7;--x:#5fc9b6;--R:#9ece6a;--b:#c3e88d;--rho:#ff9e64;--eps:#f7768e;--al:#e0af68;--st:#a9b1d6;--good:#9ece6a;--bad:#f7768e;--ent:#7dcfff}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
button{font:inherit;font-size:14px;border:1px solid #33405a;background:var(--card2);color:var(--fg);padding:6px 13px;border-radius:8px;cursor:pointer}
button:hover{border-color:#5a6b90}button.on,button.primary{background:#3b3360;border-color:#5b4f93}button:disabled{opacity:.45;cursor:default}
kbd{background:var(--card2);border:1px solid #33405a;border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12.5px;color:var(--fg)}
code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:.88em}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;background:rgba(14,17,23,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;gap:12px;height:100%}
#top .back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}#top .back:hover{color:var(--fg)}
#top .ttl{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pills{display:flex;gap:5px;margin-left:auto;flex-wrap:nowrap}
.pill{min-width:28px;height:26px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;display:grid;place-items:center;cursor:pointer;white-space:nowrap}
.pill.on{border-color:var(--al);color:var(--fg);background:#2a2516}.pill.done{color:var(--good);border-color:#355a2b}
.speed{display:flex;gap:3px;align-items:center;font-size:12.5px;color:var(--muted)}.speed button{padding:1px 7px;font-size:12px}
#bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--al);width:0;transition:width .3s}
/* footer */
#foot{position:fixed;bottom:0;left:0;right:0;height:var(--foot);z-index:30;background:rgba(14,17,23,.96);border-top:1px solid var(--line)}
#foot .wrap{display:flex;align-items:center;gap:12px;height:100%}
#phases{display:flex;gap:6px;margin:0 auto;font-size:13px;color:var(--muted);align-items:center}
#phases span{padding:2px 10px;border-radius:999px;border:1px solid transparent}#phases span.on{color:var(--fg);border-color:#5b4f93;background:#231f3a}#phases span.done{color:var(--good)}
#fwd{min-width:150px}
/* screens */
main{padding:calc(var(--top) + 18px) 0 calc(var(--foot) + 18px)}
.screen{display:none;min-height:calc(100vh - var(--top) - var(--foot) - 36px)}.screen.on{display:block}
.phase{display:none}.phase.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px}
.narrow{max-width:860px;margin:4vh auto 0}.roomy{max-width:1120px;margin:2vh auto 0}
.eyebrow{color:var(--muted);font-size:13.5px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
h1{font-size:30px;margin:4px 0 6px;letter-spacing:-.02em}h2{font-size:24px;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:19px;margin:0 0 10px}
.lbl{color:var(--al);font-weight:700}
.qtext{font-size:18.5px;line-height:1.6;margin:0 0 14px}
textarea{width:100%;min-height:150px;resize:vertical;background:#0f131b;color:var(--fg);border:1px solid #33405a;border-radius:10px;padding:12px 14px;font:inherit;font-size:15.5px;line-height:1.55}
textarea:focus{outline:none;border-color:#6a5cb0}textarea.note{min-height:80px}
.row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}.saved{font-size:12.5px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:1px 10px;cursor:help}
/* learn */
.lhead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}.lhead h2{margin:0}
.myq{font-size:14px;color:var(--muted);margin:0 0 12px;max-width:100%;overflow-wrap:anywhere}.myq b{color:var(--fg);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:22px;align-items:start}
video{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#000;cursor:pointer;aspect-ratio:16/9;max-height:calc(100vh - 290px);object-fit:contain}
.vbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.vbar .status{font-size:13.5px;color:var(--muted);margin-left:auto}
.segbar{height:4px;background:#232a37;border-radius:3px;margin-top:8px;overflow:hidden}.segbar i{display:block;height:100%;width:0;background:var(--al)}
ol.steps{list-style:none;margin:0;padding:0;max-height:calc(100vh - 210px);overflow:auto;position:relative}
ol.steps li{border:1px solid var(--line);background:var(--card);border-radius:12px;margin:0 0 9px;cursor:pointer;transition:border-color .2s,background .2s}
ol.steps li:hover{border-color:#3a4560}ol.steps li.active{border-color:var(--al);background:#1a1f2b}
.sh{display:flex;gap:10px;align-items:center;padding:9px 14px}
.sh .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-weight:700;font-size:13px}
li.active .sh .num{background:var(--al);color:#141414}li.done .sh .num{background:#2f4a26;color:var(--good)}
.sh .t{font-weight:600}.sh .d{margin-left:auto;font-size:12px;color:#5d6577;font-variant-numeric:tabular-nums}
.sb{display:none;padding:0 14px 12px 50px;color:#cfd3dc;font-size:15px;overflow-wrap:break-word}li.active .sb{display:block}
.sb .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden}
.sb details{margin-top:8px;background:#121722;border:1px dashed #3a4560;border-radius:8px;padding:6px 10px}.sb summary{cursor:pointer;color:var(--al)}
.sb table{border-collapse:collapse;font-size:14px;margin:6px 0}.sb td,.sb th{border:1px solid var(--line);padding:2px 8px;text-align:center}
.katex{color:var(--fg)}
/* compare (roomy) */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px}
.cmp>div{border-radius:12px;padding:14px 18px;font-size:15.5px;line-height:1.6;min-height:110px;overflow-wrap:anywhere}
.cmp .mine{background:#1c1a2b;border:1px solid #352f55}.cmp .model{background:#18231a;border:1px solid #2c3d24}
.cmp h5{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cmp .mine p{white-space:pre-wrap;margin:0}.cmp .mine p.empty{color:var(--muted);font-style:italic}.cmp .model p{margin:0}
.rate{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:16px;flex-wrap:wrap}
.rate button{padding:3px 12px;font-size:13.5px}.rate button.on.g{background:#2f4a26;border-color:#4b7a3c}.rate button.on.p{background:#4a3f1f;border-color:#7a6430}.rate button.on.m{background:#4a1f27;border-color:#7a3040}
.notewrap{margin-top:12px}.notewrap label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
.qblock{margin:0 0 26px}.qblock+.qblock{border-top:1px solid var(--line);padding-top:22px}
.qblock .tag{color:var(--al);font-weight:700}
.revnote{margin-top:10px;font-size:14.5px;color:#d9c48f;white-space:pre-wrap;overflow-wrap:anywhere}
.summary ol{margin:6px 0;padding-left:22px}
/* symbols */
.sym{cursor:help;border-radius:3px}.sym.hl{background:rgba(224,175,104,.25)}
.k-pi,.k-theta{color:var(--pi)}.k-piold{color:var(--old)}.k-y{color:var(--y)}.k-x{color:var(--x)}.k-R,.k-A{color:var(--R)}.k-b{color:var(--b)}
.k-rho{color:var(--rho)}.k-eps{color:var(--eps)}.k-alpha{color:var(--al)}.k-mu,.k-sigma{color:var(--st)}.k-beta{color:var(--al)}.k-H{color:var(--ent)}
.k-TP{color:#9ece6a}.k-FP{color:#ff9e64}.k-FN{color:#f7768e}.k-TN{color:#7aa2f7}.k-prec{color:#b392f0}.k-rec{color:#7dcfff}.k-F1{color:#e0af68}.k-thr{color:#e08fd0}.k-wS{color:#ff9e64}.k-wD{color:#f7768e}.k-wI{color:#7dcfff}.k-wN{color:#e6e6e6}
#tip{position:fixed;z-index:50;max-width:300px;background:#f1f3f8;color:#11141b;font-size:13.5px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s}#tip b{display:block}
@media(max-width:900px){.grid{grid-template-columns:1fr}ol.steps{max-height:none}video{max-height:none}.cmp{grid-template-columns:1fr}#top .ttl,.speed>span{display:none}#phases{font-size:12px;gap:2px}#phases span{padding:2px 6px}.card{padding:18px}}
@media(max-width:560px){#pills .pill:not(.on){display:none}#phases span:not(.on){display:none}#fwd{min-width:0}}
</style>

<script>
const LESSON = {"id": "l03", "title": "Lesson 3 · Evaluation metrics, crystal clear", "h1": "Evaluation metrics, crystal clear", "sub": "8 chapters + interview drill: confusion matrix → accuracy → precision/recall → F1/Fβ → AUROC → PR vs ROC → edit distance → WER. Have pen and paper ready.", "drill": [{"id": "d1", "q": "TP = 30, FP = 10, FN = 20, TN = 940. Give precision, recall, F1, and accuracy.", "model": "P = 30/40 = <b>0.75</b>. R = 30/50 = <b>0.60</b>. F1 = 2·30/(60+10+20) = 60/90 = <b>0.667</b>. Accuracy = 970/1000 = <b>97%</b> (high, mostly thanks to the 940 TNs)."}, {"id": "d2", "q": "You lower the decision threshold. What happens to recall, precision, and FPR?", "model": "More items get flagged: <b>recall ↑ (or equal)</b>, <b>FPR ↑ (or equal)</b>, and <b>precision usually ↓</b>, though it isn't guaranteed to be monotonic."}, {"id": "d3", "q": "What does AUROC = 0.5 mean? And AUROC = 0.3?", "model": "0.5 = random ranking: a random positive outranks a random negative half the time. 0.3 = systematically <i>worse</i> than random. The model has signal but it's inverted, so flipping the scores gives 0.7. Check for a label or sign bug."}, {"id": "d4", "q": "Fraud is 0.1% of transactions. ROC-AUC or PR-AUC, and why?", "model": "<b>PR-AUC</b> (average precision). With 99.9% negatives, a tiny FPR is still a flood of false alarms. ROC hides that, while precision shows it directly. The PR baseline is 0.001, so the gain over random is obvious. Also report recall at a fixed precision (or the reverse) at your operating point."}, {"id": "d5", "q": "Your CS229 hallucination classifier on LFM2-1.2B outputs: which metrics would you report, and which threshold would you choose?", "model": "Hallucinations are the minority positive class, so report precision, recall, and F1 on the hallucination class, PR-AUC (plus ROC-AUC for ranking), and the confusion matrix at the chosen threshold. Compare to the majority baseline. Pick the threshold on validation based on cost: if a missed hallucination is worse (e.g. medical answers), target high recall (F2 or recall ≥ X). If flags trigger expensive regeneration, weigh precision more."}, {"id": "d6", "q": "Can WER exceed 100%? Give a tiny example.", "model": "Yes, because insertions count and N is the reference length. Ref “yes”, ASR “yes yes okay”: 0 S, 0 D, 2 I → WER = 2/1 = <b>200%</b>."}], "key": ["TP", "FP", "FN", "TN", "prec", "rec", "F1", "thr", "wS", "wD", "wI", "wN"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "The confusion matrix", "short": "Confusion", "video": "media/ch1-confusion.mp4", "poster": "media/ch1-confusion-poster.jpg", "steps": [{"key": "setup", "title": "1,000 outputs, 100 positive", "html": "Each square is 10 outputs. The light row is the 100 real hallucinations (the <b>positive</b> class, the thing we want to catch). The other 900 are fine (<b>negative</b>).", "start": 0.0, "end": 5.4}, {"key": "flags", "title": "The detector flags 120", "html": "The pink outline is everything the model <i>flagged</i>: 120 outputs. Some of those are real, some aren't.", "start": 5.4, "end": 9.4}, {"key": "tp_fn", "title": "Positives: caught vs missed", "html": "Of the 100 real positives, 80 were flagged: \\(\\TP=80\\). The 20 it didn't flag are misses: \\(\\FN=20\\). Note that \\(\\TP+\\FN\\) = all actual positives = 100.", "start": 9.4, "end": 16.2}, {"key": "fp_tn", "title": "Negatives: false alarms vs correct passes", "html": "Of the 900 negatives, 40 were flagged anyway: \\(\\FP=40\\) (false alarms). 860 were correctly left alone: \\(\\TN=860\\).", "start": 16.2, "end": 22.2}, {"key": "read", "title": "How to read it", "html": "<b>Rows = truth, columns = prediction.</b> The second word is what the model said (positive/negative); the first is whether it was right (true/false). So an FP is “said positive, wrongly”. $$\\begin{array}{c|cc} & \\text{flagged} & \\text{passed}\\\\\\hline \\text{actually }+ & \\TP=80 & \\FN=20\\\\ \\text{actually }- & \\FP=40 & \\TN=860\\end{array}$$ All four sum to 1,000. Every metric in this lesson is just a ratio of these four cells.", "start": 22.2, "end": 26.2}], "check": {"id": "c1", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Guava voice agent: 500 calls, 50 truly need escalation to a human. The agent escalates 60 calls, and 40 of those were correct. Draw the 2×2 matrix and fill in TP, FP, FN, TN.", "model": "TP = 40, FP = 60 − 40 = 20, FN = 50 − 40 = 10, TN = 500 − 40 − 20 − 10 = 430. Check: the row sums are 50 positives and 450 negatives, and the flagged column sums to 60."}, "hook": {"id": "h1", "whereLabel": "step 4", "q": "Your CS229-style hallucination detector runs on 1,000 LFM2 outputs, 100 of which really hallucinate. It flags 120 outputs, and 80 of those are real hallucinations. How many hallucinations did it <b>miss</b>, and how many <b>false alarms</b> did it raise?", "model": "Missed (FN) = 100 − 80 = <b>20</b>. False alarms (FP) = 120 − 80 = <b>40</b>. The rest, 1000 − 80 − 20 − 40 = 860, are true negatives."}, "duration": 26.2}, {"title": "Accuracy and the 99/1 trap", "short": "Accuracy", "video": "media/ch2-accuracy.mp4", "poster": "media/ch2-accuracy-poster.jpg", "steps": [{"key": "formula", "title": "Accuracy = share correct", "html": "$$\\text{accuracy}=\\frac{\\TP+\\TN}{\\TP+\\FP+\\FN+\\TN}$$ For the chapter 1 detector: \\((80+860)/1000=94\\%\\).", "start": 0.0, "end": 6.1}, {"key": "imbalance", "title": "Class imbalance", "html": "Now 10,000 support calls, only 100 of which must be escalated (1%). Most real problems look like this: fraud, rare diseases, hallucinations, escalations.", "start": 6.1, "end": 10.7}, {"key": "lazy", "title": "The “never escalate” model", "html": "Predict negative for everything: \\(\\TP=0,\\ \\FN=100,\\ \\FP=0,\\ \\TN=9900\\). Accuracy \\(=9900/10000=99\\%\\), without learning anything.", "start": 10.7, "end": 16.6}, {"key": "recall0", "title": "It catches zero", "html": "It caught 0 of the 100 calls that mattered. Accuracy is dominated by the majority class. With imbalance, look at the <b>positive class</b>: precision, recall, F1, PR-AUC. Also compare against the trivial baseline (here 99%).", "start": 16.6, "end": 21.2}], "check": {"id": "c2", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "A test set has 950 negatives and 50 positives. A model predicts “negative” for everything. Compute its accuracy and recall. What's its precision? Which metrics would you report instead?", "model": "Accuracy = 950/1000 = <b>95%</b>. Recall = 0/50 = <b>0</b>. Precision = 0/0 is <b>undefined</b> because nothing was flagged (libraries report 0 with a warning). Report precision, recall, and F1 on the positive class, plus PR-AUC, and always compare to the majority-class baseline (95%)."}, "hook": {"id": "h2", "whereLabel": "step 4", "q": "Only 1% of calls need escalation. A model reports <b>99% accuracy</b> on that data. Would you ship it? What one question would you ask first?", "model": "Not on accuracy alone. A model that <i>never</i> escalates already gets 99%, because accuracy is dominated by the 99% negatives. Ask: what are the recall and precision on the positive class (or just show me the confusion matrix)? Here the lazy model has recall 0: it catches none of the 100 escalations."}, "duration": 21.2}, {"title": "Precision vs recall, and the threshold", "short": "P vs R", "video": "media/ch3-precision-recall.mp4", "poster": "media/ch3-precision-recall-poster.jpg", "steps": [{"key": "formulas", "title": "Two questions", "html": "$$\\Prec=\\frac{\\TP}{\\TP+\\FP}\\qquad \\Rec=\\frac{\\TP}{\\TP+\\FN}$$ <b>Precision:</b> of what I flagged, how much was real? <b>Recall:</b> of what was really there, how much did I catch? Chapter 1: \\(\\Prec=80/120=0.67,\\ \\Rec=80/100=0.80\\).", "start": 0.0, "end": 8.0}, {"key": "scores", "title": "Scores, not labels", "html": "Most models output a score. Here are 5 positives (+) and 5 negatives (−) on a score line. A threshold \\(\\thr\\) turns scores into flags: flag if score \\(\\ge\\thr\\).", "start": 8.0, "end": 13.4}, {"key": "t05", "title": "t = 0.5", "html": "Flags: 4 positives and 2 negatives. \\(\\Prec=4/6=0.67,\\ \\Rec=4/5=0.80\\).", "start": 13.4, "end": 18.7}, {"key": "t09", "title": "Raise t to 0.9", "html": "Only one item clears the bar, and it's real: \\(\\Prec=1/1=1.00\\), but \\(\\Rec=1/5=0.20\\). Being stricter buys precision and costs recall.", "start": 18.7, "end": 23.5}, {"key": "t025", "title": "Lower t to 0.25", "html": "Every positive is caught (\\(\\Rec=5/5=1.00\\)), but 3 negatives come along: \\(\\Prec=5/8=0.63\\).", "start": 23.5, "end": 28.7}, {"key": "which", "title": "Which one matters?", "html": "Ask <b>which mistake is more expensive, an FP or an FN?</b><br>• <b>Spam filter → precision.</b> An FP bins a real email.<br>• <b>Medical screening → recall.</b> An FN is a missed disease (a follow-up test catches the FPs).<br>• <b>Fraud → recall, with a precision floor.</b> Misses cost money, but every flag costs analyst time.<br>• <b>Voice-agent escalation (Guava) → recall.</b> A patient who needed a human and didn't get one is the costly error.<br>Then pick \\(\\thr\\) on a validation set to hit the target (e.g. recall ≥ 0.95, max precision).", "start": 28.7, "end": 37.9}], "check": {"id": "c3", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Using your matrix from chapter 1's practice (TP 40, FP 20, FN 10, TN 430), compute precision and recall. For call escalation, which one would you push up, and how?", "model": "P = 40/(40+20) = <b>0.67</b>. R = 40/(40+10) = <b>0.80</b>. For escalation, push <b>recall</b> up: a missed escalation (FN) is worse than an extra human handoff (FP). Lower the threshold until validation recall hits your target (say 0.95), and accept the drop in precision as long as handoff volume stays affordable."}, "hook": {"id": "h3", "whereLabel": "step 4", "q": "A classifier outputs a score; you flag when score ≥ t. You raise t from 0.5 to 0.9. What happens to precision and to recall, and why?", "model": "Fewer items get flagged. The ones that remain are the most confident, so <b>precision usually rises</b> (here 0.67 → 1.00). But you now miss more real positives, so <b>recall falls</b> (0.80 → 0.20). Recall can never go up when you raise t. Precision usually goes up but isn't guaranteed to."}, "duration": 37.9}, {"title": "F1 and Fβ: where the formula comes from", "short": "F1 & Fβ", "video": "media/ch4-f1.mp4", "poster": "media/ch4-f1-poster.jpg", "steps": [{"key": "why", "title": "Why not just average?", "html": "With \\(\\Prec=1.0,\\ \\Rec=0.2\\), the arithmetic mean is 0.60, which looks OK even though the model misses 80% of positives. The harmonic mean gives 0.33: it is pulled toward the weaker value.", "start": 0.0, "end": 8.6}, {"key": "formula", "title": "F1, three ways", "html": "$$\\Fone=\\frac{2}{\\frac{1}{\\Prec}+\\frac{1}{\\Rec}}=\\frac{2\\Prec\\Rec}{\\Prec+\\Rec}=\\frac{2\\TP}{2\\TP+\\FP+\\FN}$$ <b>Worked example 1:</b> \\(\\Prec=1,\\ \\Rec=0.2\\): \\(\\frac{2\\cdot1\\cdot0.2}{1+0.2}=\\frac{0.4}{1.2}=0.33\\). \\(\\TN\\) doesn't appear anywhere, so F1 ignores the easy negatives.", "start": 8.6, "end": 16.0}, {"key": "worked", "title": "Worked example 2 (from counts)", "html": "Chapter 1 detector: \\(\\Prec=80/120=0.667,\\ \\Rec=80/100=0.80\\). $$\\Fone=\\frac{2\\cdot0.667\\cdot0.80}{0.667+0.80}=\\frac{1.067}{1.467}=0.727$$ Check with counts, no division until the end: \\(\\frac{2\\cdot80}{2\\cdot80+40+20}=\\frac{160}{220}=0.727\\).", "start": 16.0, "end": 23.7}, {"key": "weighted", "title": "Fβ = a weighted harmonic mean", "html": "F1 averages the reciprocals with equal weights: \\(\\frac{1}{\\Fone}=\\tfrac12\\cdot\\frac{1}{\\Prec}+\\tfrac12\\cdot\\frac{1}{\\Rec}\\). Fβ gives recall's reciprocal \\(\\beta^2\\) times the weight: $$\\frac{1}{F_\\beta}=\\frac{1}{1+\\beta^2}\\cdot\\frac{1}{\\Prec}+\\frac{\\beta^2}{1+\\beta^2}\\cdot\\frac{1}{\\Rec}$$", "start": 23.7, "end": 32.5}, {"key": "norm", "title": "Why the (1 + β²)?", "html": "It's only normalization: the two weights \\(\\frac{1}{1+\\beta^2}+\\frac{\\beta^2}{1+\\beta^2}=1\\), so a balanced model with \\(\\Prec=\\Rec=x\\) gets \\(F_\\beta=x\\). Solve for \\(F_\\beta\\): $$F_\\beta=\\frac{1+\\beta^2}{\\frac{1}{\\Prec}+\\frac{\\beta^2}{\\Rec}}=\\frac{(1+\\beta^2)\\,\\Prec\\,\\Rec}{\\beta^2\\Prec+\\Rec}$$ With \\(\\beta=1\\) this is exactly F1.", "start": 32.5, "end": 42.7}, {"key": "whybeta", "title": "Why β² and not β?", "html": "Van Rijsbergen (1979) defined it so that β has a meaning. The partial derivatives are \\(\\frac{\\partial F}{\\partial \\Prec}\\propto\\frac{1}{(1+\\beta^2)\\Prec^2}\\) and \\(\\frac{\\partial F}{\\partial \\Rec}\\propto\\frac{\\beta^2}{(1+\\beta^2)\\Rec^2}\\). They're equal (a small gain in P is worth the same as one in R) exactly when \\(\\frac{\\Rec^2}{\\Prec^2}=\\beta^2\\), i.e. \\(\\Rec/\\Prec=\\beta\\). So for F2, improving precision only pays as much as improving recall once recall is already 2× precision. That's the sense in which recall is “β times as important”.", "start": 42.7, "end": 52.4}, {"key": "fex", "title": "Worked example: F1 vs F2 vs F0.5", "html": "\\(\\Prec=0.5,\\ \\Rec=1.0\\):<br>\\(\\Fone=\\frac{2\\cdot0.5\\cdot1}{0.5+1}=\\frac{1}{1.5}=0.67\\)<br>\\(F_2=\\frac{5\\cdot0.5\\cdot1}{4\\cdot0.5+1}=\\frac{2.5}{3}=0.83\\)<br>\\(F_{0.5}=\\frac{1.25\\cdot0.5\\cdot1}{0.25\\cdot0.5+1}=\\frac{0.625}{1.125}=0.56\\)<br>Recall is the strong side, so F2 (which favors recall) is highest. Use F2 for screening or escalation, F0.5 for spam. <details><summary>Faded example: you finish it</summary>\\(\\Prec=0.8,\\ \\Rec=0.4\\). Numerator: \\(2\\cdot0.8\\cdot0.4=0.64\\). Denominator: \\(0.8+0.4=1.2\\). So \\(\\Fone=\\) ? <br><i>Answer: 0.64/1.2 = 0.533.</i></details>", "start": 52.4, "end": 62.8}], "check": {"id": "c4b", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Precision 0.9, recall 0.5. Compute F1 and F2 by hand, and compare them with the arithmetic mean.", "model": "F1 = 2·0.9·0.5/(0.9+0.5) = 0.9/1.4 ≈ <b>0.643</b>. F2 = 5·0.9·0.5/(4·0.9+0.5) = 2.25/4.1 ≈ <b>0.549</b>. The arithmetic mean is 0.70. Both F scores are lower because recall is the weak side, and F2 is lowest because it weights recall more."}, "hook": {"id": "h4", "q": "A model has precision 1.0 and recall 0.2. Guess its F1 score before computing it. Is it closer to 0.6 or to 0.2?", "model": "F1 = 2·1·0.2/(1+0.2) = 0.4/1.2 = <b>0.33</b>. That's close to the weaker number, not the 0.60 arithmetic mean. The harmonic mean punishes imbalance between P and R."}, "duration": 62.8}, {"title": "AUROC by hand: counting pairs", "short": "AUROC", "video": "media/ch5-auroc.mp4", "poster": "media/ch5-auroc-poster.jpg", "steps": [{"key": "def", "title": "AUROC as a probability", "html": "AUROC = the probability that a randomly chosen positive gets a higher score than a randomly chosen negative. To compute it by hand, compare <b>every</b> positive with <b>every</b> negative: $$\\text{AUROC}=\\frac{\\#\\{\\text{pairs with } s_+>s_-\\}+\\tfrac12\\,\\#\\{\\text{ties}\\}}{P\\cdot N}$$ where P and N are the numbers of positives and negatives.", "start": 0.0, "end": 5.8}, {"key": "ex1", "title": "Worked example 1: list every pair", "html": "Positives {0.9, 0.6}, negatives {0.7, 0.3, 0.2} → 2 × 3 = 6 pairs.<table><tr><th>pair</th><th>compare</th><th>score</th></tr><tr><td>(0.9, 0.7)</td><td>0.9 &gt; 0.7</td><td>1</td></tr><tr><td>(0.9, 0.3)</td><td>0.9 &gt; 0.3</td><td>1</td></tr><tr><td>(0.9, 0.2)</td><td>0.9 &gt; 0.2</td><td>1</td></tr><tr><td>(0.6, 0.7)</td><td>0.6 &lt; 0.7</td><td>0</td></tr><tr><td>(0.6, 0.3)</td><td>0.6 &gt; 0.3</td><td>1</td></tr><tr><td>(0.6, 0.2)</td><td>0.6 &gt; 0.2</td><td>1</td></tr></table>AUROC = 5/6 ≈ 0.83.", "start": 5.8, "end": 15.7}, {"key": "stair1", "title": "Pairs = area under the ROC staircase", "html": "Sort all scores from high to low and walk through them: each <b>positive</b> moves the curve <b>up 1/P</b> (here 1/2), each <b>negative</b> moves it <b>right 1/N</b> (here 1/3). The unit square splits into P × N = 6 cells, one per pair. A cell sits under the curve exactly when its positive outranks its negative. So area = 5 cells × 1/6 = 5/6, the same number as counting pairs.", "start": 15.7, "end": 26.7}, {"key": "ex2", "title": "Worked example 2: a tie counts ½", "html": "Positives {0.8, 0.4}, negatives {0.4, 0.1} → 4 pairs.<table><tr><th>pair</th><th>compare</th><th>score</th></tr><tr><td>(0.8, 0.4)</td><td>0.8 &gt; 0.4</td><td>1</td></tr><tr><td>(0.8, 0.1)</td><td>0.8 &gt; 0.1</td><td>1</td></tr><tr><td>(0.4, 0.4)</td><td>tie</td><td>½</td></tr><tr><td>(0.4, 0.1)</td><td>0.4 &gt; 0.1</td><td>1</td></tr></table>AUROC = (1 + 1 + ½ + 1)/4 = 3.5/4 = 0.875.", "start": 26.7, "end": 36.467}, {"key": "stair2", "title": "The tie on the staircase", "html": "Sorted: 0.8+ (up), then the tied pair {0.4+, 0.4−}. With equal scores the threshold passes both at once, so the curve moves up <i>and</i> right: a diagonal. The diagonal cuts that one cell in half, which is exactly the ½. Last, 0.1− moves right. Area = 1 + 1 + ½ + 1 cells of ¼ each = 0.875.", "start": 36.467, "end": 45.967}, {"key": "random", "title": "What the numbers mean", "html": "All positives ranked above all negatives → every cell is shaded → <b>1.0</b>. Random scores → the staircase hugs the diagonal → <b>≈ 0.5</b>. Below 0.5 means the ranking is inverted: flip the scores (0.3 → 0.7). AUROC only depends on the <i>order</i> of scores, not their values or a threshold.<details><summary>Faded example: you finish it</summary>Positives {0.7, 0.2}, negatives {0.5, 0.1}. Pairs: (0.7, 0.5) → 1, (0.7, 0.1) → 1, (0.2, 0.5) → 0, (0.2, 0.1) → ? Then AUROC = ?/4.<br><i>Answer: 0.2 &gt; 0.1 → 1, so AUROC = 3/4 = 0.75.</i></details>", "start": 45.967, "end": 53.067}], "check": {"id": "c5a", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Positives score {0.9, 0.5, 0.3}, negatives score {0.6, 0.3}. List all pairs, score each one (1, ½ or 0), and compute AUROC.", "model": "6 pairs: (0.9, 0.6) → 1, (0.9, 0.3) → 1, (0.5, 0.6) → 0, (0.5, 0.3) → 1, (0.3, 0.6) → 0, (0.3, 0.3) → ½ (tie). The sum is 3.5, so AUROC = 3.5/6 ≈ <b>0.583</b>, only a bit better than random."}, "hook": {"id": "h5a", "q": "Positives score {0.9, 0.6}, negatives score {0.7, 0.3, 0.2}. Pick one random positive and one random negative. What's the probability the positive has the higher score? (That number <i>is</i> the AUROC.)", "model": "There are 2 × 3 = 6 (pos, neg) pairs: (0.9, 0.7) ✓, (0.9, 0.3) ✓, (0.9, 0.2) ✓, (0.6, 0.7) ✗, (0.6, 0.3) ✓, (0.6, 0.2) ✓. That's 5 of 6 correct, so AUROC = <b>5/6 ≈ 0.83</b>."}, "duration": 53.067}, {"title": "PR-AUC vs AUROC with rare positives", "short": "PR vs ROC", "video": "media/ch6-pr-vs-roc.mp4", "poster": "media/ch6-pr-vs-roc-poster.jpg", "steps": [{"key": "axes", "title": "What each curve plots", "html": "Both curves sweep the threshold from high to low. <b>ROC</b> plots \\(\\text{TPR}=\\frac{\\TP}{\\TP+\\FN}\\) (= recall) against \\(\\text{FPR}=\\frac{\\FP}{\\FP+\\TN}\\). <b>PR</b> plots precision \\(\\frac{\\TP}{\\TP+\\FP}\\) against recall. PR never uses \\(\\TN\\).", "start": 0.0, "end": 8.0}, {"key": "baselines", "title": "Random baselines", "html": "A random scorer's ROC is the diagonal: <b>AUROC = 0.5 at any prevalence</b>. A random scorer's precision equals the share of positives at every recall, so <b>the PR baseline = prevalence</b>: 0.5 for a balanced set, 0.01 when 1% are positive. A PR-AUC of 0.3 is weak on balanced data but 30× better than random at 1% prevalence.", "start": 8.0, "end": 15.1}, {"key": "rare", "title": "Rare positives: the numbers", "html": "100 positives in 100,000 (99,900 negatives). At FPR = 1%: \\(\\FP=0.01\\times99{,}900=999\\approx1{,}000\\) false alarms. Even if you catch all 100 (\\(\\text{TPR}=1\\)): $$\\text{precision}\\le\\frac{100}{100+999}\\approx0.09$$ On ROC that point (FPR 0.01, TPR 1.0) looks nearly perfect. On PR it shows precision ≤ 9%.", "start": 15.1, "end": 25.8}, {"key": "which", "title": "Which one to report", "html": "<b>AUROC:</b> ranking quality, insensitive to prevalence, fine when classes are roughly balanced or you care about ranking. <b>PR-AUC</b> (≈ average precision): focuses on the positive class, random baseline = prevalence. Use it when positives are rare (fraud, escalations, hallucinations). Always add precision and recall at the threshold you'll actually deploy.", "start": 25.8, "end": 32.7}], "check": {"id": "c5p", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "1,000 positives in 1,000,000 transactions. At your threshold, TPR = 0.8 and FPR = 0.5%. Compute TP, FP, and precision. Which curve makes this problem visible?", "model": "TP = 0.8 × 1,000 = <b>800</b>. FP = 0.005 × 999,000 = <b>4,995</b>. Precision = 800/(800 + 4,995) ≈ <b>0.14</b>. ROC shows a great-looking point (FPR 0.005, TPR 0.8). The <b>PR curve</b> exposes that 86% of flags are false alarms."}, "hook": {"id": "h5", "q": "A fraud model has <b>AUROC 0.95</b>. Fraud is 1% of transactions. Does that mean most of the transactions it flags are actually fraud?", "model": "No. AUROC measures ranking and ignores prevalence. At an operating point with TPR 0.90 and FPR 0.05 on 10,000 transactions, you get 90 TP but 0.05 · 9,900 = 495 FP, so precision = 90/585 ≈ <b>0.15</b>. Most flags are false alarms. Use the PR curve or PR-AUC, and report precision at your threshold."}, "duration": 32.7}, {"title": "Levenshtein (edit) distance", "short": "Edit distance", "video": "media/ch7-levenshtein.mp4", "poster": "media/ch7-levenshtein-poster.jpg", "steps": [{"key": "def", "title": "Definition", "html": "The <b>Levenshtein distance</b> between two strings is the minimum number of single-character edits (insertions, deletions, substitutions) needed to turn one into the other. <b>Worked example 1:</b> kitten → sitten (k→s) → sittin (e→i) → sitting (+g) = <b>3</b>.", "start": 0.0, "end": 6.8}, {"key": "table", "title": "The DP table and base cases", "html": "Cell \\(D[i][j]\\) = distance between the first \\(i\\) letters of <i>kitten</i> and the first \\(j\\) letters of <i>sitting</i>. First row and column: turning a prefix into the empty string ∅ costs its length (0, 1, 2, …). That's also the edge case: distance(“abc”, “”) = 3 deletions.", "start": 6.8, "end": 13.6}, {"key": "fill", "title": "Fill it with the recurrence", "html": "$$D[i][j]=\\min\\begin{cases}D[i-1][j]+1 & \\text{delete}\\\\ D[i][j-1]+1 & \\text{insert}\\\\ D[i-1][j-1]+[a_i\\ne b_j] & \\text{substitute (0 if letters match)}\\end{cases}$$ Example: cell (1, 1), k vs s: \\(\\min(1+1,\\ 1+1,\\ 0+1)=1\\). Fill row by row, left to right.", "start": 13.6, "end": 25.6}, {"key": "path", "title": "Read the answer", "html": "The bottom-right cell is the distance: <b>3</b>. Tracing back the cheapest path recovers the edits: a diagonal step = match (free) or substitute, a step right = insert, a step down = delete. <b>Worked example 2:</b> book → back = 2 (o→a, o→a: two diagonal substitutions).<details><summary>Faded example: you finish it</summary>cat → cart. The final cell is \\(D[3][4]=\\min(D[2][4]+1,\\ D[3][3]+1,\\ D[2][3]+[t\\ne t])\\), with \\(D[2][4]=2\\), \\(D[3][3]=1\\), \\(D[2][3]=1\\). The last letters match, so \\([t\\ne t]=0\\). What is \\(D[3][4]\\)?<br><i>Answer: min(3, 2, 1 + 0) = 1 (insert r).</i></details>", "start": 25.6, "end": 31.6}], "check": {"id": "cl", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Compute the Levenshtein distance from <b>flaw</b> to <b>lawn</b> with a DP table (rows f-l-a-w, columns l-a-w-n). Which edits does the cheapest path use?", "model": "Distance = <b>2</b>: delete f (flaw → law), then insert n (law → lawn). Table rows: ∅: 0 1 2 3 4 · f: 1 1 2 3 4 · l: 2 1 2 3 4 · a: 3 2 1 2 3 · w: 4 3 2 1 <b>2</b>."}, "hook": {"id": "hl", "q": "What's the smallest number of single-letter edits (insert a letter, delete a letter, or replace one letter) that turns <b>kitten</b> into <b>sitting</b>?", "model": "<b>3</b>: k → s (substitute), e → i (substitute), and insert g at the end. A dynamic-programming table proves no 2-edit route exists."}, "duration": 31.6}, {"title": "Word error rate (WER) for ASR", "short": "WER", "video": "media/ch8-wer.mp4", "poster": "media/ch8-wer-poster.jpg", "steps": [{"key": "formula", "title": "WER = word-level Levenshtein ÷ N", "html": "Run the same edit-distance table from the last chapter, but with <b>words</b> as the tokens. Then $$\\text{WER}=\\frac{\\Sw+\\Dw+\\Iw}{\\Nw}$$ \\(\\Sw\\) = substitutions (wrong word), \\(\\Dw\\) = deletions (missing word), \\(\\Iw\\) = insertions (extra word), \\(\\Nw\\) = words in the <b>reference</b>.", "start": 0.0, "end": 6.8}, {"key": "align", "title": "Worked example 1: align", "html": "Reference: <i>i need to refill my prescription</i>. ASR output: <i>need to refill the prescription today</i>. The minimum-edit alignment pairs up the matching words.", "start": 6.8, "end": 12.4}, {"key": "count", "title": "Count the errors", "html": "“i” is missing → \\(\\Dw=1\\). “my” → “the” → \\(\\Sw=1\\). “today” is extra → \\(\\Iw=1\\). $$\\text{WER}=\\frac{1+1+1}{6}=50\\%$$", "start": 12.4, "end": 19.1}, {"key": "ex2", "title": "Worked example 2: past 100%", "html": "Reference “yes” (N = 1), ASR “yes yes okay”: 0 S, 0 D, 2 I → WER = 2/1 = <b>200%</b>. The denominator only counts reference words, so WER has no ceiling.<details><summary>Faded example: you finish it</summary>Ref “call me back” (N = 3), ASR “call be back now”: me → be is \\(\\Sw=1\\), “now” is \\(\\Iw=1\\), \\(\\Dw=0\\). WER = ?<br><i>Answer: 2/3 ≈ 67%.</i></details>", "start": 19.1, "end": 26.3}, {"key": "notes", "title": "Interview gotchas", "html": "• <b>Normalize first</b>: case, punctuation, “10” vs “ten”. Otherwise you're scoring formatting.<br>• WER treats every word equally: “take 15 mg” → “take 50 mg” is 1 substitution but a safety issue. For a regulated voice agent like Guava, also track entity/keyword error rates (names, dates, doses) and downstream task success.", "start": 26.3, "end": 34.4}], "check": {"id": "c6", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Reference: “cancel my appointment on friday”. ASR: “cancel the appointment friday please”. Align them, count S/D/I, and compute WER.", "model": "my → the: <b>S = 1</b>. “on” missing: <b>D = 1</b>. “please” extra: <b>I = 1</b>. N = 5 reference words → WER = 3/5 = <b>60%</b>."}, "hook": {"id": "h6", "q": "The reference transcript has 6 words. The ASR output drops one word, gets one word wrong, and adds one extra word. What's the WER?", "model": "WER = (S + D + I)/N = (1 + 1 + 1)/6 = <b>50%</b>. N is the reference length, so the extra word still counts as an error."}, "duration": 34.4}], "summary": ["Every metric is a ratio of the four cells of the confusion matrix: TP, FP, FN, TN (rows = truth, columns = prediction).", "Accuracy is misleading under imbalance: “always negative” scores 99% at 1% prevalence. Look at the function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
