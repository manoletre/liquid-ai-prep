<script>
const LESSON = {"id": "l11", "title": "Lesson 11 · LoRA: low-rank adapters", "h1": "LoRA: freeze W, train a thin update", "sub": "Lesson 11 · a recall warm-up, then 3 new ideas: what LoRA is (frozen W + BA), the three knobs (r, α, dropout) with scale α/r, and when to prefer LoRA vs full fine-tune. Built for Liquid-style post-training interviews. Have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up: implement a LoRA forward for one linear layer in plain numpy. W is (d_out, d_in) frozen, A is (r, d_in), B is (d_out, r), scale = alpha/r. Input x has shape (batch, d_in). Return y of shape (batch, d_out).", "model": "<pre><code>def lora_forward(x, W, A, B, alpha):\\n    # x: (B, d_in), W: (d_out, d_in), A: (r, d_in), B: (d_out, r)\\n    r = A.shape[0]\\n    scale = alpha / r\\n    base = x @ W.T                    # (B, d_out)\\n    update = (x @ A.T) @ B.T          # (B, r) @ (r, d_out)\\n    return base + scale * update</code></pre>Say out loud: W is never updated; only A and B get gradients. Shapes: A maps to the low-rank bottleneck, B maps back."}, {"id": "d2", "q": "Count trainable parameters: a Transformer block adapts 4 matrices (q,k,v,o) each d×d with LoRA rank r. Give the formula, then plug in d = 4096, r = 32.", "model": "Per matrix \\(2dr\\); four of them: <b>8dr</b>. Plug in: \\(8\\cdot4096\\cdot32=\\)<b>1,048,576</b> trainable params for that block's projections (about 1M), vs \\(4\\cdot4096^2\\approx67\\)M if fully fine-tuned."}, {"id": "d3", "q": "You change r from 8 to 64 but leave α = 16. What happens to scale, and what should you do if you wanted the same initial strength?", "model": "Scale goes from \\(16/8=2\\) to \\(16/64=0.25\\) — <b>8× weaker</b> push with more capacity. To keep strength 2, set \\(\\alpha=2\\cdot64=128\\) (or whatever target scale × new r)."}, {"id": "d4", "q": "Interview: when would you pick LoRA over full fine-tune for a GRPO run, and when would you escalate?", "model": "<b>LoRA</b> for GRPO when the base is already strong, prompts are a moderate set, you want to keep chat/general skills, VRAM is tight, or you may keep several adapters. <b>Escalate</b> (bigger r, more modules, full FT) when val reward plateaus, the skill is far from the base, or ablations show rank is the bottleneck. Say the four axes (data/novelty, forgetting, serving, memory) out loud."}, {"id": "d5", "q": "Tie to Lesson 9: in backprop through a LoRA layer, δ still needs W. What is stored vs not stored?", "model": "δ flows backward through the sum of the base path and the adapter path. For the base path you multiply by \\(W^\\top\\) (or the local Jacobian) so earlier layers get their δ — but you <b>do not accumulate ∂L/∂W</b> because W is frozen. You <b>do</b> accumulate gradients for A and B (and apply dropout masks consistently on the adapter path)."}], "key": ["loraW", "loraA", "loraB", "lora_r", "lora_a", "lora_drop", "lora_scale", "w", "delta"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "trn": ["train set", "Data gradient descent fits on. Its score can't tell memorizing from learning."], "val": ["validation (dev) set", "Held-out data for every choice: λ, learning rate, epochs, which model."], "tst": ["test set", "Held-out data measured once at the very end. The number you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."], "loraW": ["W · frozen base", "Pretrained weight matrix kept frozen in LoRA; δ still flows through it, but no ∂L/∂W is stored."], "loraA": ["A · LoRA down", "Trainable r × d_in factor. With B forms the low-rank update ΔW = BA."], "loraB": ["B · LoRA up", "Trainable d_out × r factor. Together with A: rank(BA) ≤ r."], "lora_r": ["r · LoRA rank", "Width of the adapter. Capacity of ΔW. Typical 4–64; r ≪ d. GRPO often uses r = 32."], "lora_a": ["α · LoRA alpha", "Strength knob. Effective scale of the adapter is α/r. Often set to r or 2r."], "lora_drop": ["LoRA dropout", "Randomly zeros adapter activations each forward pass; regularizes the update so it doesn't rely on one direction."], "lora_scale": ["α/r · LoRA scale", "Multiplier on BA in the forward pass. Keeps update size stable when you change r."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: KL asymmetry, test-set optimism, PPO clip for A < 0, AUROC with a tie", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "kl", "title": "Lesson 6: CE = H + KL, and KL is asymmetric", "html": "KL = CE − H, so here \\(1.3-0.9=\\)<b>0.4 bits</b>. With \\(P=[2/3,1/3]\\) and \\(Q=[1,0]\\), \\(D_{\\mathrm{KL}}(P\\|Q)=\\infty\\) because \\(P\\) puts mass on an outcome \\(Q\\) calls impossible. The other way: \\(D_{\\mathrm{KL}}(Q\\|P)=\\log_2(3/2)\\approx\\)<b>0.585 bits</b>. Swapping \\(P\\) and \\(Q\\) can turn finite into \\(\\infty\\).", "start": 0.0, "end": 7.867}, {"key": "opt", "title": "Lesson 10: choosing on the test set is optimistic", "html": "Eight learning rates, best score 64% on the same test set (made-up; true rate nearer 55%). You used the test set to <b>choose</b>, so the winner partly won by luck. The reported number is optimistic: the test set quietly became validation. Right move: pick on a separate val/dev set, run the test set <b>once</b>, report that.", "start": 7.867, "end": 15.533}, {"key": "clip", "title": "Lesson 1: PPO clip on the A < 0 side", "html": "With \\(A=-2\\) and \\(\\epsilon=0.2\\): \\(\\min(\\rho A,\\ \\mathrm{clip}(\\rho,0.8,1.2)A)\\). \\(\\rho=0.95\\) is inside the range: both terms \\(-1.90\\), <b>not clipped</b>, still pushed down. \\(\\rho=0.6\\): \\(\\rho A=-1.20\\) and \\(0.8\\cdot(-2)=-1.60\\). The min is the clipped, flat term → <b>gradient 0</b>: already rare enough for this batch.", "start": 15.533, "end": 23.433}, {"key": "auroc", "title": "Lesson 3: AUROC with a tie", "html": "\\(2\\times2=4\\) pairs. 0.9 beats 0.5 and 0.2 → 2. 0.5 vs 0.5 is a tie → ½, and 0.5 beats 0.2 → 1, so 1.5. AUROC \\(=(2+1.5)/4=3.5/4=\\)<b>0.875</b>. Ties count half; it's the chance a random positive outscores a random negative.", "start": 23.433, "end": 31.5}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) H = 1.0 bit, CE = 1.5 bits → KL? P = [¾, ¼], Q = [1, 0]: D(P‖Q) and D(Q‖P)? (b) Best of 5 models on the test set scores 71%. Is that an honest estimate? (c) PPO, ε = 0.2, A = −1, ρ = 0.7: clipped? (d) AUROC with positives {0.8, 0.4} and negatives {0.4, 0.1}.", "model": "(a) KL = <b>0.5 bits</b>. D(P‖Q) = <b>∞</b>. D(Q‖P) = log₂(4/3) ≈ <b>0.415 bits</b>. (b) <b>No</b> — choosing on the test set makes 71% optimistic. (c) ρA = −0.7, clip·A = −0.8 → min −0.8, <b>clipped, gradient 0</b>. (d) 4 pairs: 0.8 beats both (2); 0.4 ties 0.4 (½) and beats 0.1 (1) → 1.5; AUROC = 3.5/4 = <b>0.875</b>."}, "hook": {"id": "h1", "q": "From memory, four quick ones. (a) H(P) = 0.9 bits and H(P, Q) = 1.3 bits: what is KL? With P = [⅔, ⅓] and Q = [1, 0], what are D(P‖Q) and D(Q‖P)? (b) You tried 8 learning rates and picked the best on the test set (64%). What's wrong? (c) PPO with ε = 0.2 and A = −2: is ρ = 0.95 clipped? Is ρ = 0.6? (d) AUROC with positives {0.9, 0.5} and negatives {0.5, 0.2}.", "model": "(a) KL = CE − H = <b>0.4 bits</b>. D(P‖Q) = <b>∞</b> (P puts mass where Q is 0). D(Q‖P) = log₂(3/2) ≈ <b>0.585 bits</b>. (b) You <b>chose on the test set</b>, so 64% is optimistic (luck on those examples); the test set became validation. Pick on a separate val/dev set, run test once. (c) ρ = 0.95: min(−1.90, −1.90), <b>not clipped</b>. ρ = 0.6: min(−1.20, 0.8·(−2)=−1.60) = −1.60, the clipped flat term → <b>clipped, gradient 0</b>. (d) 4 pairs: 0.9 beats both (2); 0.5 ties 0.5 (½) and beats 0.2 (1) → 1.5. AUROC = 3.5/4 = <b>0.875</b>."}, "duration": 31.5}, {"title": "What LoRA is: frozen W + low-rank BA", "short": "What LoRA is", "video": "media/ch2-what-lora.mp4", "poster": "media/ch2-what-lora-poster.jpg", "steps": [{"key": "idea", "title": "The bet: fine-tune updates are low-rank", "html": "Full fine-tuning moves every entry of a huge \\(W\\). Empirically, the useful change \\(\\Delta W\\) often lives in a <b>thin subspace</b>. LoRA keeps \\(W\\) frozen and only trains a low-rank update. Tie to Lesson 9: a frozen weight still lets \\(\\delta\\) flow through \\(W^\\top\\), but no \\(\\partial L/\\partial W\\) is stored — the adapters are what get gradients.", "start": 0.0, "end": 7.7}, {"key": "formula", "title": "W′ = W + BA", "html": "$$W' = W + BA$$ \\(W\\) is the frozen pretrained matrix (\\(d_{\\mathrm{out}}\\times d_{\\mathrm{in}}\\)). \\(B\\) is \\(d_{\\mathrm{out}}\\times r\\) and \\(A\\) is \\(r\\times d_{\\mathrm{in}}\\), both trainable. Rank of \\(BA\\) is at most \\(r\\). Forward pass (row-vector \\(x\\)): \\(y = xW^\\top + \\mathrm{scale}\\cdot (xA^\\top)B^\\top\\), the same as \\((W+BA)^\\top\\).", "start": 7.7, "end": 15.4}, {"key": "ex1", "title": "Worked example 1: param count at d = 4096, r = 8", "html": "One attention projection, \\(d=4096\\) (made-up size). Full \\(W\\): \\(4096\\times4096\\approx\\)<b>16.8 M</b> trainable. LoRA with \\(r=8\\): \\(2\\cdot4096\\cdot8=\\)<b>65,536</b> trainable — about 250× fewer. Rule of thumb: trainable params per adapted matrix \\(\\approx 2\\cdot d\\cdot r\\).", "start": 15.4, "end": 22.8}, {"key": "ex2", "title": "Worked example 2 (edge): r = d is not better LoRA", "html": "If \\(r=d=4096\\), \\(BA\\) can represent <b>any</b> \\(d\\times d\\) matrix, but you train \\(2\\cdot4096\\cdot4096\\approx\\)<b>33.5 M</b> params — <i>more</i> than full fine-tune of \\(W\\), because you have two factors. So \\(r\\ll d\\) is the whole point. In practice \\(r\\in\\{4,8,16,32\\}\\); your GRPO world often uses <b>r = 32</b>.", "start": 22.8, "end": 31.5}, {"key": "faded", "title": "Your turn: d = 1024, r = 16", "html": "One square matrix, \\(d=1024\\), \\(r=16\\). <details><summary>Check your last step: full W and LoRA param counts</summary>Full \\(W\\): \\(1024\\times1024=\\)<b>1,048,576</b>. LoRA: \\(2\\cdot1024\\cdot16=\\)<b>32,768</b>.</details>", "start": 31.5, "end": 37.8}], "check": {"id": "c2", "q": "(a) d = 2048, r = 4: LoRA trainable params for one matrix? (b) Same d, full W params? (c) A teammate sets r = 2048 \"to be safe\". What's the problem? (d) In backprop through y = x(W + BA)ᵀ with W frozen, which matrices receive weight gradients?", "model": "(a) \\(2\\cdot2048\\cdot4=\\)<b>16,384</b>. (b) \\(2048^2=\\)<b>4,194,304</b>. (c) \\(r=d\\) makes BA full-rank but roughly <b>2×</b> the params of full FT — you lose LoRA's point. (d) Gradients w.r.t. <b>A and B only</b>; \\(W\\) is frozen (δ still flows through \\(W^\\top\\) for earlier layers)."}, "hook": {"id": "h2", "q": "A weight matrix W is 4096 × 4096. Full fine-tuning would train every entry. Someone claims most of the useful fine-tune update lives in a thin subspace. (a) Roughly how many parameters is full W? (b) If you instead learn two thin factors B (4096 × 8) and A (8 × 4096), how many trainable params is that? (c) Why might freezing W and only training BA be enough?", "model": "(a) \\(4096^2\\approx\\)<b>16.8 M</b>. (b) \\(2\\cdot4096\\cdot8=\\)<b>65,536</b> (~250× fewer). (c) Empirically the useful update \\(\\Delta W\\) is often <b>low-rank</b>: it lives in a thin subspace. LoRA bets you can capture that with BA of rank \\(r\\ll d\\), keep the pretrained W frozen (no \\(\\partial L/\\partial W\\) stored — Lesson 9), and still adapt the model."}, "duration": 37.8}, {"title": "Knobs: r, alpha, dropout and scale α/r", "short": "r, α, dropout", "video": "media/ch3-r-alpha-dropout.mp4", "poster": "media/ch3-r-alpha-dropout-poster.jpg", "steps": [{"key": "knobs", "title": "Three knobs, one scale", "html": "<b>r</b> = capacity of the update (how rich \\(BA\\) can be). <b>α</b> = strength (how hard it pushes). <b>Dropout</b> = randomly zero adapter activations to regularize. The forward pass multiplies the adapter by the effective scale \\(\\alpha/r\\): $$y=xW^\\top+(\\alpha/r)\\,(xA^\\top)B^\\top$$", "start": 0.0, "end": 7.7}, {"key": "scale", "title": "Why divide by r?", "html": "\\(A\\) and \\(B\\) start small. Without scaling, a bigger \\(r\\) makes \\(BA\\) larger just from having more terms. Dividing by \\(r\\) keeps the <b>initial</b> update size stable when you change rank. \\(\\alpha=r\\) → scale 1 (plain \\(BA\\)). \\(\\alpha=2r\\) → scale 2 (hits twice as hard). Tune α for strength and r for capacity — they are not the same knob.", "start": 7.7, "end": 15.8}, {"key": "ex1", "title": "Worked example 1: α fixed at 16, r = 8 vs 32", "html": "Made-up numbers. \\(r=8,\\alpha=16\\) → scale \\(=16/8=\\)<b>2</b>. \\(r=32,\\alpha=16\\) → scale \\(=16/32=\\)<b>0.5</b>. Same α, bigger r: <b>more capacity, weaker per-step push</b>. A common recipe when sweeping r is to set \\(\\alpha=2r\\) (scale stays 2) or \\(\\alpha=r\\) (scale stays 1). Changing r without touching α silently changes the learning dynamics.", "start": 15.8, "end": 24.5}, {"key": "ex2", "title": "Worked example 2 (edge): α = r, and dropout", "html": "\\(\\alpha=32,\\ r=32\\) → scale \\(=1\\) (edge: no extra gain). Dropout \\(p\\approx0.05\\) on the LoRA path (PEFT-default-ish) randomly zeros some adapter activations each forward pass, so the update can't rely on one lucky direction. Too high (e.g. 0.5) and the adapter barely learns — you underfit the task.", "start": 24.5, "end": 33.2}, {"key": "faded", "title": "Your turn: r = 16, α = 32", "html": "GRPO-flavoured numbers. Scale \\(=\\alpha/r=\\)? If you bump \\(r\\) to 64 and leave \\(\\alpha=32\\), new scale = ? <details><summary>Check your last step</summary>First scale \\(=32/16=\\)<b>2</b>. After the bump: \\(32/64=\\)<b>0.5</b>. To keep scale 2 you'd set \\(\\alpha=128\\) (\\(2\\cdot64\\)).</details>", "start": 33.2, "end": 39.3}], "check": {"id": "c3", "q": "(a) r = 8, α = 8: scale? (b) You want scale = 2 with r = 64: what α? (c) A run with r = 16, α = 32, dropout = 0.5 underfits badly. Which knob is the first suspect, and what would you try? (d) Why not just crank r to 256 with α stuck at 16?", "model": "(a) \\(8/8=\\)<b>1</b>. (b) \\(\\alpha=2\\cdot64=\\)<b>128</b>. (c) <b>Dropout 0.5</b> is very aggressive — try ~0.05–0.1 (or 0). If still weak, raise α or r. (d) Scale becomes \\(16/256=0.0625\\): huge capacity but a tiny push; training crawls unless you also raise α."}, "hook": {"id": "h3", "q": "LoRA has three common knobs: rank r, alpha α, and dropout. (a) Which one mainly controls how rich the update can be? (b) Which one mainly controls how hard the update pushes? (c) If α = 16 and r = 8, what is the effective scale in the forward pass? What if you raise r to 32 and leave α alone?", "model": "(a) <b>r</b> (capacity / rank of BA). (b) <b>α</b> (strength), via the scale \\(\\alpha/r\\). (c) Scale = \\(16/8=\\)<b>2</b>. After raising r to 32 with α still 16: scale = \\(16/32=\\)<b>0.5</b> — more capacity but a weaker push, unless you also raise α (common recipe: \\(\\alpha=2r\\) so scale stays 2)."}, "duration": 39.3}, {"title": "When LoRA vs full fine-tune / more params", "short": "When LoRA", "video": "media/ch4-when-lora.mp4", "poster": "media/ch4-when-lora-poster.jpg", "steps": [{"key": "axes", "title": "Four interview axes", "html": "Decide with four practical questions: (1) <b>data size / how new is the skill?</b> (2) <b>risk of forgetting</b> the base model, (3) <b>serving</b>: many task adapters on one frozen backbone vs one big model, (4) <b>memory</b> / how many GPUs you have. LoRA is a bet that a thin update is enough for this task.", "start": 0.0, "end": 8.3}, {"key": "ex1", "title": "Worked example 1: LoRA is the right call", "html": "Strong chat LLM → company FAQ tone, few thousand pairs (made-up). Small domain shift, base already knows language; you want to keep general ability; you may ship 5 customer-specific adapters on one frozen backbone; one 24 GB GPU can't full-FT a 7B comfortably. → <b>LoRA</b> with \\(r=8\\ldots32\\), \\(\\alpha\\approx2r\\), light dropout.", "start": 8.3, "end": 17.4}, {"key": "ex2", "title": "Worked example 2 (edge): when LoRA is not enough", "html": "Brand-new modality or a deep new capability, huge curated data, weak base. LoRA's val loss plateaus while full FT keeps falling. Options: raise \\(r\\) (16→64→256), adapt more modules, or full / almost-full fine-tune if you can afford it. Liquid-style post-training habit: <b>start LoRA, escalate if capacity-bound</b>.", "start": 17.4, "end": 26.5}, {"key": "table", "title": "A compact decision sheet", "html": "<b>Prefer LoRA</b> when data is small–medium, you want to keep base skills, you need many task adapters, or VRAM is tight. <b>Prefer more params / full FT</b> when data is large, the capability is new, LoRA saturates, or you ship one model. Middle path: bigger \\(r\\), more layers, or QLoRA (quantized base, full-precision adapters).", "start": 26.5, "end": 34.6}, {"key": "faded", "title": "Your turn: two scenarios", "html": "A: GRPO on math with 50k prompts, 1 GPU, keep chat ability. B: train a 1B model from a weak base on 2T new tokens. <details><summary>Check your last step</summary><b>A → LoRA</b> (post-train adaptation, memory, keep chat). <b>B → full (pre)training</b> / continued pretrain — not an adapter job.</details>", "start": 34.6, "end": 40.767}], "check": {"id": "c4", "q": "(a) You fine-tune for a new programming language with 5M high-quality examples; LoRA r = 16 stops improving after a few epochs while full FT still drops loss. What do you try next, in order? (b) You need 20 customer tone adapters on one 70B backbone served once. LoRA or full FT per customer? (c) Name one risk of full FT that LoRA reduces.", "model": "(a) Raise capacity first: <b>r → 64/128</b>, adapt more modules (MLP too), then consider full / partial FT if still stuck. (b) <b>LoRA</b> — one frozen backbone, 20 thin adapters swapped at serve time. (c) <b>Catastrophic forgetting</b> of the base skills (also: much higher memory / storage per variant)."}, "hook": {"id": "h4", "q": "Two jobs. Job A: adapt a strong chat model to your company's FAQ tone with a few thousand pairs, on one 24 GB GPU, and you may later ship five customer-specific variants. Job B: teach a weak 1B base a brand-new skill with a huge curated dataset, and LoRA's val loss has already plateaued. For each: LoRA or full fine-tune / more params, and name one reason.", "model": "<b>A → LoRA</b>: small domain shift, want to keep general chat ability, multi-adapter serving, and full FT of a 7B may not fit on 24 GB. <b>B → more params / full FT</b> (or much larger r / more modules): the skill is new, data is large, and LoRA has already saturated — capacity is the bottleneck."}, "duration": 40.767}], "summary": ["LoRA freezes pretrained W and trains a low-rank update ΔW = BA with rank r ≪ d. Trainable params per matrix ≈ 2·d·r. Forward: y = xWᵀ + (α/r)(xAᵀ)Bᵀ.", "r = capacity, α = strength via scale α/r, dropout regularizes the adapter path. Changing r without adjusting α silently changes learning dynamics; common recipes α = r or α = 2r.", "Prefer LoRA for small–medium domain shifts, keeping base skills, multi-adapter serving, and tight VRAM. Prefer more params / full FT when the skill is new, data is huge, or LoRA saturates. Start LoRA; escalate if capacity-bound."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;
const store={get:(q,f)=>localStorage.getItem(K(q,f))||"",set:(q,f,v)=>localStorage.setItem(K(q,f),v)};
const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;
const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
