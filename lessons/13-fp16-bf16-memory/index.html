er you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."], "loraW": ["W · frozen base", "Pretrained weight matrix kept frozen in LoRA; δ still flows through it, but no ∂L/∂W is stored."], "loraA": ["A · LoRA down", "Trainable r × d_in factor. With B forms the low-rank update ΔW = BA."], "loraB": ["B · LoRA up", "Trainable d_out × r factor. Together with A: rank(BA) ≤ r."], "lora_r": ["r · LoRA rank", "Width of the adapter. Capacity of ΔW. Typical 4–64; r ≪ d. GRPO often uses r = 32."], "lora_a": ["α · LoRA alpha", "Strength knob. Effective scale of the adapter is α/r. Often set to r or 2r."], "lora_drop": ["LoRA dropout", "Randomly zeros adapter activations each forward pass; regularizes the update so it doesn't rely on one direction."], "temp": ["T · temperature", "Divides every logit before softmax: p ∝ e^{z/T}. T < 1 sharper, T > 1 flatter, T → 0 greedy."], "topk": ["top-k", "Keep only the k most likely tokens, then renormalize. A fixed count."], "topp": ["top-p (nucleus)", "Keep the fewest top tokens whose probabilities add up to ≥ p, then renormalize. Adapts to how sure the model is."], "minp": ["min_p", "Keep token i only if p_i ≥ p_min · p_max, then renormalize. The cutoff moves with the top token."], "pmax": ["p_max", "Probability of the single most likely token at this step."], "lora_scale": ["α/r · LoRA scale", "Multiplier on BA in the forward pass. Keeps update size stable when you change r."], "fp32": ["fp32 · single precision", "32 bits = 4 bytes: 1 sign, 8 exponent, 23 mantissa. Gap near 1 ≈ 1.2e-7. Used for master weights and optimizer state."], "fp16": ["fp16 · half precision", "16 bits = 2 bytes: 1 sign, 5 exponent, 10 mantissa. Fine ticks (≈ 0.001 near 1) but max 65,504; tiny gradients underflow."], "bf16": ["bf16 · bfloat16", "16 bits = 2 bytes: 1 sign, 8 exponent, 7 mantissa. fp32's range with coarse ticks (≈ 0.008 near 1). Needs Ampere or newer (not a T4)."], "expo": ["exponent bits", "Pick the power of two (the size bucket). More exponent bits → bigger range."], "mant": ["mantissa bits · m", "The fraction digits inside a bucket: 2^m ticks per bucket. More mantissa bits → finer spacing."], "spacing": ["gap (spacing)", "Distance to the next representable number: 2^k / 2^m in [2^k, 2^(k+1)). Anything between ticks is rounded."], "master": ["fp32 master weights", "Full-precision copy of the weights the optimizer updates, so updates smaller than the 16-bit gap aren't lost."], "lscale": ["S · loss scale", "Multiply the loss by S so fp16 gradients stay above underflow; divide by S in fp32 before the update."], "adam": ["AdamW m, v", "Per-weight running averages of the gradient (m) and squared gradient (v), kept in fp32: 8 bytes per trainable param."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: temperature, min_p, PPO clip, and backprop", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "temp", "title": "Lesson 12: temperature divides the gap", "html": "Gap \\(=4-1=3\\) and \\(p_1/p_2=e^{\\text{gap}/T}\\). <b>T = 1:</b> \\(e^3\\approx20.1\\), so \\(p_1=20.1/21.1\\approx\\)<b>0.953</b>. <b>T = 3:</b> gap\\(/T=1\\), \\(e^1\\approx2.72\\), so \\(p_1=2.72/3.72\\approx\\)<b>0.731</b>. No temperature flips the order: the gap shrinks but never changes sign.", "start": 0.7, "end": 8.2}, {"key": "minp", "title": "Lesson 12: min_p vs top-p", "html": "min_p 0.2: cutoff \\(0.2\\cdot0.50=0.10\\). Keep 0.50, 0.30, 0.12 (sum 0.92) and renormalize: <b>0.543, 0.326, 0.130</b>. Top-p 0.95: running sum 0.50, 0.80, 0.92, 0.97, so it keeps <b>4</b> tokens. min_p judges each token against the top one; top-p fills a cumulative quota.", "start": 8.2, "end": 16.2}, {"key": "clip", "title": "PPO: when does the clip bite? (A > 0)", "html": "\\(\\epsilon=0.2\\), \\(A=+1\\). <b>ρ = 1.3:</b> above \\(1+\\epsilon\\), \\(\\min(1.3,\\,1.2)=1.2\\), a constant, so the <b>gradient is 0</b>: the move already went far enough. <b>ρ = 0.75:</b> \\(\\min(0.75,\\,0.80)=0.75\\), the unclipped term, so the gradient still pushes it up. The clip only stops moves that already went far <b>in A's direction</b>.", "start": 16.2, "end": 24.2}, {"key": "backprop", "title": "Lesson 09: backprop on a two-weight chain", "html": "Forward: \\(h=\\text{ReLU}(1\\cdot3)=3\\), \\(\\hat y=2\\cdot3=6\\), \\(L=\\tfrac12(6-5)^2=0.5\\). Backward: \\(\\delta_{\\hat y}=\\hat y-y=1\\), so \\(\\partial L/\\partial w_2=\\delta\\cdot h=\\)<b>3</b>. \\(\\delta_h=\\delta_{\\hat y}\\cdot w_2=2\\); ReLU is on, so it passes 2. \\(\\partial L/\\partial w_1=2\\cdot x=\\)<b>6</b>. Weight gradient = δ × the input that weight saw.", "start": 24.2, "end": 32.6}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) z = [4, 1] at T = 1.5: p of the first token? (b) PPO, ε = 0.2, A = −1, ρ = 1.4: clipped or not, and why does it matter? (c) Same chain as above but w₁ = −1. What are both gradients, and why?", "model": "(a) Gap\\(/T=3/1.5=2\\), so \\(p_1=e^2/(e^2+1)\\approx\\)<b>0.881</b>. (b) \\(\\min(-1.4,\\,-1.2)=-1.4\\), the unclipped term: <b>not clipped</b>. The bad response became <i>more</i> likely, a move in the wrong direction, so PPO keeps the gradient and can undo it. (c) \\(w_1x=-3\\), so ReLU outputs <b>0</b> (dead): \\(h=0\\), \\(\\hat y=0\\), \\(\\delta_{\\hat y}=-5\\). \\(\\partial L/\\partial w_2=-5\\cdot0=\\)<b>0</b> and the ReLU passes 0 back, so \\(\\partial L/\\partial w_1=\\)<b>0</b>. Neither weight learns from this example."}, "hook": {"id": "h1", "q": "From memory, four quick ones. (a) Logits z = [4, 1]: probability of the first token at T = 1 and at T = 3? (b) p = [0.50, 0.30, 0.12, 0.05, 0.03] with min_p = 0.2: which tokens survive, and their renormalized p? How many does top-p = 0.95 keep? (c) PPO with ε = 0.2 and A = +1: is ρ = 1.3 clipped? Is ρ = 0.75? (d) x = 3, h = ReLU(w₁x), ŷ = w₂h, L = ½(ŷ − y)², with w₁ = 1, w₂ = 2, y = 5: find ∂L/∂w₂ and ∂L/∂w₁.", "model": "(a) Gap 3: \\(p_1=e^3/(e^3+1)\\approx\\)<b>0.953</b>; at T = 3 the gap is 1, so \\(p_1=e/(e+1)\\approx\\)<b>0.731</b>. (b) Cutoff \\(0.2\\cdot0.50=0.10\\): keep 0.50, 0.30, 0.12 (sum 0.92) → <b>0.543, 0.326, 0.130</b>. Top-p 0.95: running sum 0.50, 0.80, 0.92, 0.97 → keeps <b>4</b>. (c) ρ = 1.3: <b>clipped</b> (min(1.3, 1.2) = 1.2, gradient 0). ρ = 0.75: <b>not clipped</b>, since min(0.75, 0.80) = 0.75; with A > 0 the clip only stops moves that already went up past 1.2. (d) h = 3, ŷ = 6, δŷ = 1, so \\(\\partial L/\\partial w_2=1\\cdot3=\\)<b>3</b>; δh = 1 · 2 = 2, ReLU is on, so \\(\\partial L/\\partial w_1=2\\cdot3=\\)<b>6</b>."}, "duration": 32.6}, {"title": "How a float stores a number: range vs spacing", "short": "Float bits", "video": "media/ch2-float-anatomy.mp4", "poster": "media/ch2-float-anatomy-poster.jpg", "steps": [{"key": "idea", "title": "Intuition: scientific notation in binary", "html": "In \\(6.02\\times10^{23}\\), the digits 6.02 say how <b>fine</b> the number is and the power \\(10^{23}\\) says how <b>big</b>. A float does the same in binary: \\(\\pm\\,1.f\\times2^{e}\\). The <b>exponent</b> bits pick the power of two (which size bucket), and the <b>mantissa</b> bits \\(f\\) pick the tick inside that bucket. So exponent bits buy <b>range</b> and mantissa bits buy <b>precision</b>.", "start": 0.0, "end": 8.8}, {"key": "formats", "title": "The three formats: same idea, different bit budgets", "html": "<b>fp32:</b> 1 sign + 8 exponent + 23 mantissa = 32 bits = 4 bytes. <b>fp16:</b> 1 + 5 + 10 = 16 bits = 2 bytes. <b>bf16</b> (“brain float”, from Google Brain): 1 + 8 + 7 = 16 bits. bf16 is fp32 with the last 16 mantissa bits chopped off: the same range as fp32, coarser ticks. fp16 made the opposite trade: finer ticks, short range.", "start": 8.8, "end": 18.65}, {"key": "formula", "title": "Where the spacing comes from", "html": "$$\\text{spacing in }[2^k,\\,2^{k+1})=\\frac{2^k}{2^m}$$ The bucket from \\(2^k\\) to \\(2^{k+1}\\) is \\(2^k\\) wide, and \\(m\\) mantissa bits split it into \\(2^m\\) equal ticks. Near 1 (\\(k=0\\)) the gap is \\(2^{-m}\\): fp32 \\(2^{-23}\\approx1.2\\times10^{-7}\\), fp16 \\(2^{-10}\\approx0.001\\), bf16 \\(2^{-7}\\approx0.008\\). Every bucket has the same number of ticks, so the <b>relative</b> precision stays fixed and the absolute gap doubles with each power of two.", "start": 18.65, "end": 27.55}, {"key": "ex1", "title": "Worked example 1: a toy float with m = 2", "html": "With 2 mantissa bits each bucket has \\(2^2=4\\) ticks. <b>[1, 2):</b> gap \\(1/4=0.25\\): 1, 1.25, 1.5, 1.75. <b>[2, 4):</b> gap \\(2/4=0.5\\): 2, 2.5, 3, 3.5. <b>[4, 8):</b> gap \\(4/4=1\\): 4, 5, 6, 7. Storing 1.3 gives the nearest tick, <b>1.25</b>. Storing 5.4 gives <b>5</b>. A float is always rounded to the nearest tick, and the ticks spread out as numbers grow.", "start": 27.55, "end": 38.45}, {"key": "ex2", "title": "Worked example 2 (edge): fp16 near 2048, a tie", "html": "fp16 has \\(m=10\\). 2048 is \\(2^{11}\\), so for \\([2048,\\,4096)\\) the gap is \\(2^{11}/2^{10}=\\)<b>2</b>. The ticks are 2048, 2050, 2052, …, so <b>2049 doesn't exist</b>. It sits exactly halfway, a tie. The rule for ties is <b>round to even</b>: pick the tick whose last mantissa bit is 0. 2048 is tick 0 (even), so 2049 → <b>2048</b>. 2051 sits between tick 1 (2050) and tick 2 (2052), so it → <b>2052</b>. Ties alternate down and up, so rounding doesn't drift in one direction on average.", "start": 38.45, "end": 48.15}, {"key": "faded", "title": "Your turn: bf16 near 256", "html": "bf16 has \\(m=7\\). 256 is \\(2^8\\), so the gap in \\([256,\\,512)\\) is \\(2^8/2^7=2\\), with ticks 256, 258, 260, … Store 259. <details><summary>Check your last step</summary>259 is a tie between 258 (tick 1, odd) and 260 (tick 2, even), so it rounds to <b>260</b>. In bf16 you can't count by ones past 256.</details>", "start": 48.15, "end": 56.65}], "check": {"id": "c2", "q": "(a) In fp16, what's the gap between neighboring numbers near 1000, and what does 1000.3 get stored as? (b) The same in bf16? (c) Explain in one sentence why bf16 was designed with fp32's exponent instead of fp16's.", "model": "(a) 1000 is in \\([512,\\,1024)\\), \\(k=9\\): gap \\(2^9/2^{10}=\\)<b>0.5</b>, so 1000.3 → <b>1000.5</b> (0.2 away vs 0.3 away). (b) bf16: gap \\(2^9/2^7=\\)<b>4</b>, so 1000.3 → <b>1000</b>. (c) Training needs <b>range</b> more than fine precision: gradients and activations span many powers of ten, so with fp32's exponent nothing overflows or underflows, and the coarse ticks are handled by keeping an fp32 copy where precision matters (next chapter)."}, "hook": {"id": "h2", "q": "fp32, fp16 and bf16 all store a number as sign × 1.something × 2^(power). fp16 uses its 16 bits as 5 exponent bits + 10 mantissa (fraction) bits; bf16 uses 8 exponent bits + 7 mantissa bits. (a) Which one can hold bigger numbers? (b) Which one has finer steps between neighboring numbers? (c) Guess: can fp16 store the integer 2049 exactly?", "model": "(a) <b>bf16</b>: its 8 exponent bits give it the same range as fp32 (up to about 3.4 × 10³⁸), while fp16 tops out at <b>65,504</b>. (b) <b>fp16</b>: 10 mantissa bits cut each power-of-two bucket into 1,024 ticks; bf16's 7 bits give only 128. Near 1 that's a gap of ≈ 0.001 vs ≈ 0.008. (c) <b>No.</b> Between 2048 and 4096 fp16's gap is 2048/1024 = 2, so its numbers go 2048, 2050, …; 2049 is a tie and rounds to the even tick, <b>2048</b>."}, "duration": 56.65}, {"title": "fp16 vs bf16 in training, and the mixed-precision fix", "short": "Mixed precision", "video": "media/ch3-mixed-precision.mp4", "poster": "media/ch3-mixed-precision-poster.jpg", "steps": [{"key": "bridge", "title": "Recap: what each 16-bit format can hold", "html": "From the last chapter. <b>fp16:</b> largest ≈ 65,504, smallest normal ≈ \\(6.1\\times10^{-5}\\) (tinier “subnormal” values go down to ≈ \\(6\\times10^{-8}\\) with fewer bits of precision), gap near 1 ≈ 0.001. <b>bf16:</b> largest ≈ \\(3.4\\times10^{38}\\), smallest ≈ \\(1.2\\times10^{-38}\\), gap near 1 ≈ 0.008. <b>fp32:</b> the same range as bf16, gap near 1 ≈ \\(1.2\\times10^{-7}\\). So there are two ways to fail: out of <b>range</b>, or a change smaller than the <b>gap</b>.", "start": 0.0, "end": 8.8}, {"key": "ex1", "title": "Worked example 1: range (fp16's weakness)", "html": "<b>An activation of 70,000:</b> fp16 → <b>inf</b> (above 65,504) → the loss becomes NaN and the run dies. bf16: the gap in \\([65{,}536,\\,131{,}072)\\) is \\(2^{16}/2^7=512\\), so it's stored as 70,144, a bit off but harmless. <b>A gradient of \\(10^{-8}\\):</b> fp16 → <b>0</b> (below ≈ \\(6\\times10^{-8}\\)), so that weight gets no signal. bf16 keeps ≈ \\(1.0\\times10^{-8}\\). fp16 breaks at both ends of its range.", "start": 8.8, "end": 19.25}, {"key": "ex2", "title": "Worked example 2 (edge): an update smaller than the gap", "html": "bf16's ticks around 1 are <b>0.996</b> (\\(1-2^{-8}\\); the bucket below 1 is half as wide, so its gap is \\(2^{-8}\\)), <b>1.000</b> and <b>1.008</b> (\\(1+2^{-7}\\)). With \\(w=1.0\\), lr = \\(10^{-5}\\) (the GRPO setting from your run) and gradient 0.5, the update is 0.000005. \\(w\\) becomes 0.999995, hundreds of times closer to 1.000 than to 0.996, so it <b>rounds back to 1.000</b>. fp16 too: its ticks are 0.9995 and 1.001. After 1,000 such steps bf16 still says 1.000, while fp32 says 0.995. No error and no NaN: learning <b>silently stops</b>.", "start": 19.25, "end": 30.75}, {"key": "fix", "title": "The fix: mixed precision (+ loss scaling for fp16)", "html": "Use each format for what it's good at. (1) Forward and backward in bf16 or fp16: fast on tensor cores, half the memory. (2) Keep an <b>fp32 master copy</b> of the weights and the optimizer state. (3) Apply the update in fp32, where 0.999995 survives, then copy the weights down to 16 bits for the next forward pass. <b>fp16 only:</b> <b>loss scaling</b>. Multiply the loss by \\(S\\) (e.g. 65,536). By the chain rule every gradient is multiplied by \\(S\\) too, so \\(10^{-8}\\to6.6\\times10^{-4}\\), safely representable. Divide by \\(S\\) in fp32 before the update. If any gradient overflows to inf, skip that step and halve \\(S\\) (PyTorch's GradScaler). bf16 doesn't need this: its range is fp32's.", "start": 30.75, "end": 41.2}, {"key": "t4", "title": "Your T4 note: why it can't do bf16, and what to set", "html": "The T4 is an older (Turing-generation) GPU with no bf16 hardware; bf16 support arrived with Ampere (A100, RTX 30xx) and continues on H100. So on a Colab T4 use <b>fp16 = True</b> (Hugging Face's Trainer then adds the GradScaler for you), and on an A100 or H100 use <b>bf16 = True</b> with no scaler. The recipe is the same either way: 16-bit math, fp32 master weights.", "start": 41.2, "end": 49.8}, {"key": "faded", "title": "Your turn: loss scaling on the T4", "html": "fp16, a gradient of \\(2\\times10^{-8}\\): below fp16's normal floor \\(6.1\\times10^{-5}\\) (and only a few of its tiny subnormal steps), so it's effectively lost. Use \\(S=4{,}096\\): scaled gradient \\(=2\\times10^{-8}\\times4{,}096=\\)? Is it above \\(6.1\\times10^{-5}\\)? <details><summary>Check your last step</summary>\\(\\approx8.2\\times10^{-5}\\), which is <b>above</b> \\(6.1\\times10^{-5}\\), so it's a normal fp16 number with full precision. Divide by 4,096 in fp32 to get back \\(2\\times10^{-8}\\) exactly where it's needed.</details>", "start": 49.8, "end": 58.3}], "check": {"id": "c3", "q": "(a) An activation of 100,000: fp16 or bf16, which one breaks, and how? (b) A weight w = 2.0 is in bf16, and the update is 0.003, so w ← 1.997. What does bf16 store? (Hint: the gap just below 2 is 2⁰/2⁷.) What does an fp32 master copy store? (c) You're fine-tuning on a free Colab T4. Which precision flag do you set, and what two things keep training from breaking?", "model": "(a) <b>fp16</b> breaks: 100,000 > 65,504 → inf → NaN loss. bf16 stores it fine. (b) Just below 2 the gap is \\(1/128\\approx0.0078\\), so the neighbors are 1.992 and 2.000. 1.997 is closer to 2.000, so bf16 stores <b>2.0</b> and the update is lost. The fp32 master keeps <b>1.997</b>. (c) <b>fp16 = True</b> (the T4 has no bf16 hardware). The two safeguards: <b>loss scaling</b> (GradScaler) so small gradients don't underflow, and an <b>fp32 master copy</b> of the weights so small updates aren't rounded away."}, "hook": {"id": "h3", "q": "Three moments in a training run. (a) An activation reaches 70,000. What happens in fp16, and in bf16? (b) A gradient is 0.00000001 (1e-8). fp16? bf16? (c) A weight w = 1.0 is stored in bf16. The update is lr × gradient = 1e-5 × 0.5 = 0.000005. After w ← w − 0.000005, what is w in bf16? What if you repeat it 1,000 times?", "model": "(a) fp16: above 65,504, so it becomes <b>inf</b> and the loss turns into NaN. bf16: fine, stored as 70,144 (its gap there is 512). (b) fp16: below even its tiniest value (≈ 6 × 10⁻⁸), so it becomes <b>0</b> and the signal is lost. bf16: kept (≈ 1.0 × 10⁻⁸). (c) <b>Still 1.0.</b> bf16's nearest ticks are 0.996 and 1.008, and 0.999995 is far closer to 1.000, so it rounds back. After 1,000 steps it's <b>still 1.0</b>, while fp32 would reach 0.995. Learning silently stops; that's why training keeps an fp32 master copy."}, "duration": 58.3}, {"title": "Memory math: inference vs full fine-tune vs LoRA", "short": "Memory math", "video": "media/ch4-memory-math.mp4", "poster": "media/ch4-memory-math-poster.jpg", "steps": [{"key": "bridge", "title": "Recap: bytes per parameter", "html": "Bytes per number = bits / 8: fp32 → <b>4</b>, fp16/bf16 → <b>2</b> (preview of the quantization lessons: int8 → 1, int4 → 0.5). 1 GB = \\(10^9\\) bytes and 1B params = \\(10^9\\) params, so the powers cancel: $$\\text{GB}=(\\text{params in billions})\\times(\\text{bytes per param})$$", "start": 0.0, "end": 7.9}, {"key": "ex1", "title": "Worked example 1: just loading LFM2-1.2B", "html": "fp32: \\(1.2\\times4=\\)<b>4.8 GB</b>. bf16: \\(1.2\\times2=\\)<b>2.4 GB</b>. int8: \\(1.2\\times1=1.2\\) GB. int4: \\(1.2\\times0.5=0.6\\) GB. That's the weights only; serving also needs the KV cache and activations on top, which grow with batch size and context length.", "start": 7.9, "end": 16.5}, {"key": "sixteen", "title": "Where “16 bytes per parameter” comes from", "html": "A full fine-tune trains every weight. With AdamW in mixed precision, each trainable weight carries: bf16 weight <b>2</b> + bf16 gradient <b>2</b> + fp32 master weight <b>4</b> (from the last chapter) + Adam's <b>m</b> 4 + Adam's <b>v</b> 4. AdamW is the standard optimizer: for every weight it keeps a running average of the gradient (m, the direction) and of the squared gradient (v, its typical size), both in fp32. Total \\(2+2+4+4+4=\\)<b>16 bytes</b>.", "start": 16.5, "end": 26.55}, {"key": "ex2", "title": "Worked example 2 (edge): a model that serves easily but won't train", "html": "Full fine-tune of LFM2-1.2B: \\(1.2\\times16=\\)<b>19.2 GB</b> before any activations. A T4 has 16 GB, so it <b>does not fit</b>, even though inference needed only 2.4 GB. Training costs about <b>8×</b> the bf16 weights. fp16 with loss scaling on the T4 doesn't help: it's the same 16 bytes.", "start": 26.55, "end": 35.4}, {"key": "lora", "title": "Bridge to Lesson 11: why LoRA fits", "html": "LoRA freezes \\(W\\), so the base needs only its bf16 weights: \\(1.2\\times2=2.4\\) GB, with no gradients, no master copy and no Adam state for \\(W\\). Only the adapter pays 16 bytes per param. With a made-up but typical adapter of 11M params: \\(0.011\\times16\\approx0.18\\) GB. Total ≈ <b>2.6 GB</b> + activations, which fits on the T4. This is the memory half of your “when LoRA, when more params?” question: LoRA is often the only option that fits the GPU you have.", "start": 35.4, "end": 44.25}, {"key": "faded", "title": "Your turn: LFM2-350M on the T4", "html": "0.35B params. Loading in bf16: \\(0.35\\times2=0.7\\) GB. A full fine-tune with AdamW: \\(0.35\\times16=\\)? Does it fit in 16 GB? <details><summary>Check your last step</summary>\\(0.35\\times16=\\)<b>5.6 GB</b>, which <b>fits</b> on a 16 GB T4 with about 10 GB left for activations. Small models can be fully fine-tuned on a free GPU; 1.2B can't.</details>", "start": 44.25, "end": 52.75}], "check": {"id": "c4", "q": "LFM2-2.6B (≈ 2.6B params). (a) Weights in bf16? In int4? (b) A full fine-tune with AdamW in mixed precision: how many GB, and what kind of GPU does that need? (c) LoRA with 20M trainable params: roughly how many GB?", "model": "(a) \\(2.6\\times2=\\)<b>5.2 GB</b>; int4: \\(2.6\\times0.5=\\)<b>1.3 GB</b>. (b) \\(2.6\\times16=\\)<b>41.6 GB</b> before activations: more than a 40 GB A100, so you need an 80 GB A100/H100 (or tricks like sharding the optimizer state across GPUs). (c) Base \\(5.2\\) GB + adapter \\(0.02\\times16=0.32\\) GB ≈ <b>5.5 GB</b> + activations, which fits a T4."}, "hook": {"id": "h4", "q": "LFM2-1.2B has about 1.2 billion parameters. (a) How many GB just to hold its weights in bf16? In fp32? (b) A full fine-tune with AdamW in mixed precision: roughly how many GB, and does it fit on a 1   const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
