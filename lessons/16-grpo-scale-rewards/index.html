<script>
const LESSON = {"id": "srw", "title": "Lesson 16 · GRPO reward scaling: scale_rewards = group, batch or none", "h1": "scale_rewards: which ruler measures the advantage?", "sub": "Lesson 16 · a recall warm-up (PPO clip, backprop), then 3 new ideas: dividing advantages by each prompt's own spread (\"group\"), by one spread for the whole batch (\"batch\"), and how to choose between group / batch / none. Answers your open question “scale_rewards=\"batch\" esto que significa?”, including why your run's frac_reward_zero_std read 0.000 for 600 steps. The coding drills at the end are warm-ups for Monday's Guava coding round. Have a pen ready. All reward numbers below are made up for practice.", "drill": [{"id": "d1", "q": "Coding-round warm-up (numpy only, ~10 min): write <code>grpo_advantages(rewards, G, scale)</code> for scale in \"group\" / \"batch\" / \"none\", matching TRL (unbiased std, + 1e-4), and also return the share of groups with zero spread. Test on rewards = [1,1,1,1, 1,1,0,0, 0.6,0.6,0.4,0.4], G = 4.", "model": "<pre><code>import numpy as np\n\ndef grpo_advantages(rewards, G, scale=\"group\", eps=1e-4):\n    r = np.asarray(rewards, dtype=float).reshape(-1, G)   # (prompts, G)\n    adv = r - r.mean(axis=1, keepdims=True)                # baseline: per prompt\n    std_g = r.std(axis=1, ddof=1, keepdims=True)           # torch .std() is unbiased\n    if scale == \"group\":\n        adv = adv / (std_g + eps)\n    elif scale == \"batch\":\n        adv = adv / (r.std(ddof=1) + eps)                  # one ruler for the batch\n    elif scale != \"none\":\n        raise ValueError(scale)\n    zero_std_groups = np.isclose(std_g, 0).mean()          # log this yourself\n    return adv.ravel(), zero_std_groups\n\nrewards = [1,1,1,1, 1,1,0,0, 0.6,0.6,0.4,0.4]\nfor mode in [\"group\", \"batch\", \"none\"]:\n    print(mode, np.round(grpo_advantages(rewards, 4, mode)[0], 2))</code></pre>Output (verified): group [0 0 0 0 | 0.87 0.87 −0.87 −0.87 | 0.87 0.87 −0.87 −0.87]; batch [0 … | 1.27 … −1.27 | 0.25 … −0.25]; none [0 … | 0.5 … −0.5 | 0.1 … −0.1]; zero-std groups 0.333 in every mode. (0.87 instead of 1 because of ddof=1: \\(\\sqrt{3/4}\\).) Things an interviewer looks for: reshape to (prompts, G), <code>keepdims</code> for broadcasting, ddof, the epsilon, and an error on a bad mode."}, {"id": "d2", "q": "Backprop in code (Guava warm-up): implement <code>forward_backward(x, w1, w2, y)</code> for \\(h=\\mathrm{ReLU}(w_1x)\\), \\(\\hat y=w_2h\\), \\(L=\\tfrac12(\\hat y-y)^2\\), returning L and both gradients. Check \\(\\partial L/\\partial w_1\\) with a central finite difference at (2, 2, 0.5, 3).", "model": "<pre><code>def forward_backward(x, w1, w2, y):\n    z = w1 * x; h = max(z, 0.0)\n    yhat = w2 * h\n    L = 0.5 * (yhat - y) ** 2\n    d_yhat = yhat - y\n    g_w2 = d_yhat * h\n    d_z = d_yhat * w2 * (1.0 if z > 0 else 0.0)   # ReLU gate\n    g_w1 = d_z * x\n    return L, g_w1, g_w2\n\neps = 1e-6\nnum = (forward_backward(2, 2 + eps, 0.5, 3)[0] - forward_backward(2, 2 - eps, 0.5, 3)[0]) / (2 * eps)</code></pre>Verified: (2, 2, 0.5, 3) → L = 0.5, g_w1 = −1, g_w2 = −4, finite difference −1.0 ✓. (1, 3, −1, 0) → (4.5, 3, −9). With w1 = −1 the ReLU is off → both gradients 0 (a dead ReLU)."}, {"id": "d3", "q": "Spaced recall (Lesson 13): (a) LFM2-1.2B: GB to serve in bf16, GB to fully fine-tune with AdamW, and where the bytes/param come from. (b) Your GPU is a T4 (no bf16): what precision setup do you use for training, and why each piece?", "model": "(a) Serve: \\(1.2\\times2=\\)<b>2.4 GB</b>. AdamW full fine-tune: bf16 weights 2 + bf16 grads 2 + fp32 master 4 + Adam m 4 + Adam v 4 = 16 bytes/param → <b>19.2 GB</b> (before activations), too big for 16 GB. (b) <b>fp16 mixed precision</b>: <b>loss scaling</b> so tiny gradients don't underflow (fp16's smallest ≈ 6e-8), and <b>fp32 master weights</b> so small updates aren't rounded away. In PyTorch: autocast + GradScaler."}, {"id": "d4", "q": "Interview answer, 60 seconds out loud: \"What does scale_rewards do in GRPO, which would you choose, and what happened in your own run?\"", "model": "\"GRPO's advantage is each answer's reward minus its group's mean. TRL then divides by a spread: 'group' uses each prompt's own std, a per-prompt z-score, so every prompt gets the same-size push; it amplifies prompts that are almost always right or wrong, and small or noisy reward differences. 'batch' keeps the per-prompt mean but uses one std for the whole batch, so relative gap sizes survive. 'none' skips the division, which Dr. GRPO argues removes a difficulty bias. In my run I used batch with 8 generations per prompt. The zero-std metric read 0 the whole time, but in batch mode it only checks the batch std, so it can't see prompts where all 8 answers scored the same. Those still had zero advantage. I'd log the per-group zero-std fraction myself and compare modes on held-out accuracy.\""}], "key": ["srw", "A", "mug", "sgg", "sgb", "zstd", "G", "pc", "rho", "eps"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "trn": ["train set", "Data gradient descent fits on. Its score can't tell memorizing from learning."], "val": ["validation (dev) set", "Held-out data for every choice: λ, learning rate, epochs, which model."], "tst": ["test set", "Held-out data measured once at the very end. The number you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."], "loraW": ["W · frozen base", "Pretrained weight matrix kept frozen in LoRA; δ still flows through it, but no ∂L/∂W is stored."], "loraA": ["A · LoRA down", "Trainable r × d_in factor. With B forms the low-rank update ΔW = BA."], "loraB": ["B · LoRA up", "Trainable d_out × r factor. Together with A: rank(BA) ≤ r."], "lora_r": ["r · LoRA rank", "Width of the adapter. Capacity of ΔW. Typical 4–64; r ≪ d. GRPO often uses r = 32."], "lora_a": ["α · LoRA alpha", "Strength knob. Effective scale of the adapter is α/r. Often set to r or 2r."], "lora_drop": ["LoRA dropout", "Randomly zeros adapter activations each forward pass; regularizes the update so it doesn't rely on one direction."], "temp": ["T · temperature", "Divides every logit before softmax: p ∝ e^{z/T}. T < 1 sharper, T > 1 flatter, T → 0 greedy."], "topk": ["top-k", "Keep only the k most likely tokens, then renormalize. A fixed count."], "topp": ["top-p (nucleus)", "Keep the fewest top tokens whose probabilities add up to ≥ p, then renormalize. Adapts to how sure the model is."], "minp": ["min_p", "Keep token i only if p_i ≥ p_min · p_max, then renormalize. The cutoff moves with the top token."], "pmax": ["p_max", "Probability of the single most likely token at this step."], "lora_scale": ["α/r · LoRA scale", "Multiplier on BA in the forward pass. Keeps update size stable when you change r."], "fp32": ["fp32 · single precision", "32 bits = 4 bytes: 1 sign, 8 exponent, 23 mantissa. Gap near 1 ≈ 1.2e-7. Used for master weights and optimizer state."], "fp16": ["fp16 · half precision", "16 bits = 2 bytes: 1 sign, 5 exponent, 10 mantissa. Fine ticks (≈ 0.001 near 1) but max 65,504; tiny gradients underflow."], "bf16": ["bf16 · bfloat16", "16 bits = 2 bytes: 1 sign, 8 exponent, 7 mantissa. fp32's range with coarse ticks (≈ 0.008 near 1). Needs Ampere or newer (not a T4)."], "expo": ["exponent bits", "Pick the power of two (the size bucket). More exponent bits → bigger range."], "mant": ["mantissa bits · m", "The fraction digits inside a bucket: 2^m ticks per bucket. More mantissa bits → finer spacing."], "spacing": ["gap (spacing)", "Distance to the next representable number: 2^k / 2^m in [2^k, 2^(k+1)). Anything between ticks is rounded."], "master": ["fp32 master weights", "Full-precision copy of the weights the optimizer updates, so updates smaller than the 16-bit gap aren't lost."], "lscale": ["S · loss scale", "Multiply the loss by S so fp16 gradients stay above underflow; divide by S in fp32 before the update."], "adam": ["AdamW m, v", "Per-weight running averages of the gradient (m) and squared gradient (v), kept in fp32: 8 bytes per trainable param."], "qs": ["s · scale", "Tick spacing of the quantization ruler: s = max|w| / (ticks per side). One per tensor, or one per group."], "qint": ["q · quantized integer", "round(w / s), stored in b bits: int8 holds −127…127, int4 holds −7…7."], "qhat": ["ŵ · dequantized weight", "q · s, what the model actually computes with. Off from w by at most s / 2."], "grp": ["g · group size", "How many consecutive weights share one scale (often 32–128). Smaller g fits better but stores more scales."], "bpw": ["bits per weight", "b + 16 / g: the integer bits plus each group's 16-bit scale spread over its g weights."], "ptq": ["PTQ · post-training quantization", "Quantize an already-trained model: compute scales, round, store. No retraining (vs QAT, which trains with the rounding)."], "fq": ["ŵ · fake-quantized weight", "s · clip(round(w / s), −t, t): quantize then dequantize in one go. A float that can only sit on the int grid; the forward pass uses it."], "latent": ["w · latent weight", "The high-precision weight QAT actually updates. Never used directly in the forward pass; it's rounded to ŵ first."], "ste": ["STE · straight-through estimator", "In the backward pass, treat round() as if it were the identity: dŵ/dw ≈ 1 inside the range, 0 where clipped."], "qat": ["QAT · quantization-aware training", "Fine-tune with fake quantization in the forward pass and STE in the backward pass, then really quantize. Same file as PTQ, better integers."], "clipt": ["t · largest integer", "Ends of the integer grid: q is clipped to −t … t (t = 7 for int4, 127 for int8)."], "srw": ["scale_rewards · TRL GRPOConfig", "Which spread σ the advantage is divided by: \"group\" (default, each prompt's own σ), \"batch\" (one σ for the whole batch) or \"none\" (no division)."], "sgg": ["σ_group · group spread", "Standard deviation of the G rewards for ONE prompt: √(average of (r − μ_group)²). TRL uses the unbiased version (÷ (G − 1))."], "sgb": ["σ_batch · batch spread", "Standard deviation of ALL rewards in the batch (every prompt's G answers together), around the batch mean."], "mug": ["μ_group · group mean", "Average reward of one prompt's G answers. The baseline in every mode."], "zstd": ["frac_reward_zero_std", "TRL metric: share of rewards whose σ is 0 — i.e. groups where every answer scored the same and so learned nothing. Uses whichever σ scale_rewards picked."], "G": ["G · group size", "Number of answers sampled per prompt (num_generations). Your run: 8."], "pc": ["p · fraction correct", "For 0/1 rewards, share of a group's answers that are right. Its spread is σ = √(p(1 − p))."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"], "\\sgg": ["sgg", "\\sigma_{\\text{group}}"], "\\sgb": ["sgb", "\\sigma_{\\text{batch}}"], "\\mug": ["mug", "\\mu_{\\text{group}}"], "\\Gn": ["G", "G"], "\\pc": ["pc", "p"]}, "chapters": [{"title": "Opening recall: PPO clip and backprop, then the bridge to GRPO", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "clip", "title": "Lesson 01/07 · the PPO clip", "html": "Objective \\(\\min(\\rho A,\\ \\mathrm{clip}(\\rho,1-\\epsilon,1+\\epsilon)A)\\). The clip only blocks moving <i>further</i> in the direction A wants: for A &gt; 0 the fence is above \\(1+\\epsilon\\), for A &lt; 0 it's below \\(1-\\epsilon\\). A ratio that moved the wrong way is never clipped, so it gets corrected.", "start": 0.7, "end": 10.0}, {"key": "backprop", "title": "Lesson 09 · backprop on a two-weight net", "html": "Forward: \\(h=\\mathrm{ReLU}(4)=4\\), \\(\\hat y=2\\), \\(L=0.5\\). Backward: \\(\\delta_{\\hat y}=\\hat y-y=-1\\); weight gradient = δ × the input to that weight: \\(\\partial L/\\partial w_2=-4\\). Pass δ back through \\(w_2\\): \\(-0.5\\); ReLU is on, so it passes; \\(\\partial L/\\partial w_1=-0.5\\times x=-1\\).", "start": 10.0, "end": 19.8}, {"key": "bridge", "title": "Bridge: GRPO's advantage, and the division TRL adds", "html": "GRPO samples \\(\\Gn\\) answers per prompt; \\(A=r-\\mug\\) (the group's own average is the baseline). Since PPO's objective is \\(\\rho A\\), the <b>size</b> of A is the size of the push. TRL then divides A by a spread σ, and <code>scale_rewards</code> picks which σ. That's today.", "start": 19.8, "end": 30.0}], "check": {"id": "c1", "q": "(a) \\(\\epsilon=0.2\\), \\(A=-0.5\\). For \\(\\rho=0.75\\) and \\(\\rho=1.3\\): clipped or not? (b) Same net, \\(x=1, w_1=3, w_2=-1, y=0\\): \\(L\\), \\(\\partial L/\\partial w_2\\), \\(\\partial L/\\partial w_1\\).", "model": "(a) A &lt; 0 wants \\(\\rho\\) down; the fence is at 0.8. \\(\\rho=0.75\\) is already below → <b>clipped</b> (gradient 0). \\(\\rho=1.3\\) moved the wrong way → <b>not clipped</b>, pushed down. (b) \\(h=3\\), \\(\\hat y=-3\\), \\(L=4.5\\); \\(\\delta_{\\hat y}=-3\\) → \\(\\partial L/\\partial w_2=-3\\times3=\\)<b>−9</b>; \\(\\delta_h=-3\\times(-1)=3\\), ReLU on → \\(\\partial L/\\partial w_1=3\\times1=\\)<b>3</b>."}, "hook": {"id": "h1", "q": "From memory. (a) PPO clip, \\(\\epsilon=0.2\\), advantage \\(A=+0.8\\). For \\(\\rho=1.25\\) and for \\(\\rho=0.6\\): is the gradient clipped to 0 or not? (b) Backprop: \\(x=2\\), \\(h=\\mathrm{ReLU}(w_1x)\\), \\(\\hat y=w_2h\\), \\(L=\\tfrac12(\\hat y-y)^2\\), with \\(w_1=2, w_2=0.5, y=3\\). Find \\(L\\), \\(\\partial L/\\partial w_2\\), \\(\\partial L/\\partial w_1\\). (c) A GRPO group of 4 answers scores [1, 0, 0, 0]. What is each answer's advantage (before any division)?", "model": "(a) \\(\\rho=1.25\\): A > 0 and \\(\\rho\\) is already above \\(1+\\epsilon=1.2\\) → <b>clipped, gradient 0</b>. \\(\\rho=0.6\\): it moved the wrong way (below 1), the clip doesn't stop that → <b>not clipped</b>, still pushed up. (b) \\(h=4\\), \\(\\hat y=2\\), \\(L=0.5\\); \\(\\delta_{\\hat y}=-1\\), \\(\\partial L/\\partial w_2=-1\\times4=\\)<b>−4</b>; \\(\\delta_h=-1\\times0.5=-0.5\\), ReLU on → \\(\\partial L/\\partial w_1=-0.5\\times2=\\)<b>−1</b>. (c) Mean 0.25 → <b>+0.75, −0.25, −0.25, −0.25</b>."}, "duration": 30.0}, {"title": "scale_rewards = \"group\": divide by each prompt's own spread", "short": "group", "video": "media/ch2-group-std.mp4", "poster": "media/ch2-group-std-poster.jpg", "steps": [{"key": "why", "title": "Intuition: rewards come in arbitrary units", "html": "The push on an answer is proportional to A, but A is in reward units: rescale the reward from 0–1 to 0–10 and every push gets 10× bigger. The fix is to measure \"better than average\" in units of the spread: how many spreads above the mean (a z-score). 80 means a lot more when everyone scored 78–82 than when they scored 40–100.", "start": 0.7, "end": 10.9}, {"key": "formula", "title": "The formula, and where each piece comes from", "html": "\\(A_i=\\dfrac{r_i-\\mug}{\\sgg+0.0001}\\). \\(\\mug\\) = average of the group's rewards (the baseline). \\(\\sgg=\\sqrt{\\tfrac1G\\sum_i(r_i-\\mug)^2}\\): square the distances so ± don't cancel, average, square-root back to reward units. The 0.0001 only prevents 0/0. TRL's <code>.std()</code> divides by \\(G-1\\) instead of \\(G\\); for a fixed G that's one constant factor (all A shrink by \\(\\sqrt{3/4}\\) at G = 4), so by hand we divide by G.", "start": 10.9, "end": 21.2}, {"key": "ex1", "title": "Worked example 1: P = [1, 1, 0, 0]", "html": "\\(\\mug=0.5\\); distances ±0.5; squares 0.25 each, average 0.25, \\(\\sgg=0.5\\). \\(A=\\pm0.5/0.5=\\)<b>+1, +1, −1, −1</b>.", "start": 21.2, "end": 29.8}, {"key": "ex2", "title": "Worked example 2 (edge cases): Q = [0.6, 0.6, 0.4, 0.4] and an all-equal group", "html": "Q: \\(\\mug=0.5\\), distances ±0.1, \\(\\sgg=0.1\\) → \\(A=\\pm0.1/0.1=\\)<b>±1</b>: the same push as P, though Q's raw gaps were 5× smaller. Group scaling blows small differences up to full size. Edge: [1, 1, 1, 1] → \\(\\mug=1\\), \\(\\sgg=0\\) → \\(A=0/0.0001=\\)<b>0</b>. No signal; TRL counts it in <code>frac_reward_zero_std</code>.", "start": 29.8, "end": 43.0}, {"key": "faded", "title": "Your turn: [1, 0, 0, 0]", "html": "\\(\\mug=0.25\\); distances +0.75, −0.25 ×3; squares \\(0.5625+3\\times0.0625=0.75\\), ÷ 4 = 0.1875, \\(\\sgg\\approx0.433\\). The correct answer's \\(A=0.75/0.433=\\)? <details><summary>Check your last step</summary><b>≈ 1.73</b>, and each wrong answer gets \\(-0.25/0.433\\approx-0.577\\). (TRL's \\(G-1\\) version: 1.5 and −0.5.)</details>", "start": 43.0, "end": 51.5}], "check": {"id": "c2", "q": "Group mode, rewards [1, 1, 1, 0]. Compute \\(\\mug\\), \\(\\sgg\\), and the advantage of a correct and of the wrong answer (divide by G).", "model": "\\(\\mug=0.75\\); distances +0.25 ×3, −0.75; squares \\(3\\times0.0625+0.5625=0.75\\), ÷ 4 = 0.1875, \\(\\sgg\\approx0.433\\). Correct: \\(0.25/0.433\\approx\\)<b>+0.577</b>. Wrong: \\(-0.75/0.433\\approx\\)<b>−1.73</b>. (Mirror image of the faded example: the rare outcome always gets the big advantage.)"}, "hook": {"id": "h2", "q": "Two prompts in one batch, 4 answers each. P is graded right/wrong: [1, 1, 0, 0]. Q gets partial credit: [0.6, 0.6, 0.4, 0.4]. Before any math: should Q's better answers get a smaller, equal, or bigger push than P's correct answers? Why?", "model": "There's no single right answer, and that's the point of today. Raw: Q's gaps (±0.1) are 5× smaller than P's (±0.5), so Q's push is 5× smaller. With <code>scale_rewards=\"group\"</code> (TRL's default) each group is divided by its own spread, so Q gets <b>exactly the same ±1 push</b> as P. Good if every prompt should count equally; bad if Q's 0.2 gap is mostly noise."}, "duration": 51.5}, {"title": "scale_rewards = \"batch\": each prompt's own mean, one shared ruler", "short": "batch", "video": "media/ch3-batch-std.mp4", "poster": "media/ch3-batch-std-poster.jpg", "steps": [{"key": "idea", "title": "Same baseline, one shared ruler", "html": "\\(A_i=\\dfrac{r_i-\\mug}{\\sgb+0.0001}\\). The baseline is still each prompt's own mean. Only the divisor changes: \\(\\sgb\\) is the spread of <i>all</i> rewards in the batch around the batch mean (TRL: <code>rewards.std()</code>). Still unit-free, but a prompt with small differences keeps small advantages. TRL's docs credit this to the \"PPO Lite\" paper (group mean, batch std).", "start": 0.7, "end": 11.7}, {"key": "ex1", "title": "Worked example 1: P [1, 1, 0, 0] + Q [0.6, 0.6, 0.4, 0.4]", "html": "Batch mean = 4.0/8 = 0.5. Distances ±0.5 (×4) and ±0.1 (×4); squares \\(4\\times0.25+4\\times0.01=1.04\\), ÷ 8 = 0.13, \\(\\sgb\\approx0.361\\). P: \\(\\pm0.5/0.361=\\)<b>±1.39</b>. Q: \\(\\pm0.1/0.361=\\)<b>±0.28</b>. The 5 : 1 ratio of the raw gaps survives (group mode made it 1 : 1).", "start": 11.7, "end": 20.633}, {"key": "ex2", "title": "Worked example 2 (edge): [1, 1, 1, 1] + [1, 1, 0, 0]", "html": "Batch mean 6/8 = 0.75; squares \\(6\\times0.0625+2\\times0.5625=1.5\\), ÷ 8 = 0.1875, \\(\\sgb\\approx0.433\\). Group 1: every \\(r-\\mug=0\\) → <b>A = 0</b>, still no signal. Group 2: \\(\\pm0.5/0.433=\\)<b>±1.15</b>. <code>frac_reward_zero_std</code> tests \\(\\sgb=0.433\\neq0\\) → logs <b>0</b>, though half the batch was dead. In group mode it would log 0.5. That's your 0.000.", "start": 20.633, "end": 31.633}, {"key": "faded", "title": "Your turn: [1, 0, 0, 0] + [0, 0, 0, 0]", "html": "Batch mean 1/8 = 0.125; squares \\(0.875^2+7\\times0.125^2=0.875\\), ÷ 8 ≈ 0.109, \\(\\sgb\\approx0.331\\). Group 1: \\(\\mug=0.25\\); the correct answer's \\(A=0.75/0.331=\\)? <details><summary>Check your last step</summary><b>≈ 2.27</b>. Its wrong answers: \\(-0.25/0.331\\approx-0.76\\). Group 2: all 0.</details>", "start": 31.633, "end": 40.133}], "check": {"id": "c3", "q": "Batch [1, 1, 0, 0] + [0, 0, 0, 0], batch mode. (a) Advantages in group 1 and group 2? (b) What does <code>frac_reward_zero_std</code> log in batch mode, and what would it log in group mode?", "model": "(a) Batch mean 2/8 = 0.25; squares \\(2\\times0.5625+6\\times0.0625=1.5\\), ÷ 8 = 0.1875, \\(\\sgb\\approx0.433\\). Group 1: \\(\\pm0.5/0.433=\\)<b>±1.15</b>. Group 2: <b>0</b>. (b) Batch mode: \\(\\sgb\\neq0\\) → <b>0</b>. Group mode: one of two groups has \\(\\sgg=0\\) → <b>0.5</b>."}, "hook": {"id": "h3", "q": "Your run used <code>scale_rewards=\"batch\"</code> and TRL's <code>frac_reward_zero_std</code> read 0.000 at all 600 steps. Guess: does that prove no prompt ever had all 8 answers score the same? Why or why not?", "model": "<b>No.</b> In batch mode TRL checks whether the <i>batch</i> σ is 0, which only happens if every reward in the whole batch is identical. Prompts whose 8 answers all scored the same still had A = 0 (no learning signal); the metric just can't see them. You'd log the share of groups with \\(\\sgg=0\\) yourself."}, "duration": 40.133}, {"title": "group, batch or none? What each does to easy and hard prompts", "short": "choose", "video": "media/ch4-choose.mp4", "poster": "media/ch4-choose-poster.jpg", "steps": [{"key": "bridge", "title": "Recap before combining: one baseline, three rulers", "html": "Every mode: \\(A=r-\\mug\\). \"group\": ÷ \\(\\sgg\\), so every prompt gets the same-size push. \"batch\": ÷ one \\(\\sgb\\), so sizes follow the raw reward gaps. \"none\": no division, so A is in reward units.", "start": 0.7, "end": 8.8}, {"key": "binary", "title": "Where σ comes from for 0/1 rewards", "html": "A share \\(\\pc\\) of the answers score 1, so the mean is \\(\\pc\\). Right answers sit \\(1-\\pc\\) above it, wrong ones \\(\\pc\\) below: variance \\(=\\pc(1-\\pc)^2+(1-\\pc)\\pc^2=\\pc(1-\\pc)\\), so \\(\\sigma=\\sqrt{\\pc(1-\\pc)}\\). Biggest at \\(\\pc=\\tfrac12\\) (0.5), tiny near 0 or 1. Dividing by \\(\\sgg\\) <b>boosts</b> nearly-solved and nearly-impossible prompts.", "start": 8.8, "end": 18.6}, {"key": "ex1", "title": "Worked example 1: E 7/8 vs M 4/8, all three modes", "html": "\\(\\sigma_E\\approx0.331\\), \\(\\sigma_M=0.5\\). A wrong answer, \\(r-\\mug\\): E −0.875, M −0.5. <b>group</b>: E −2.65, M −1.00. <b>batch</b> (11 of 16 correct, \\(\\sgb\\approx0.464\\)): E −1.89, M −1.08. <b>none</b>: E −0.875, M −0.5. Group gives E's mistake 2.65× M's push; batch and none keep the raw 1.75×.", "start": 18.6, "end": 28.4}, {"key": "ex2", "title": "Worked example 2 (edge): a tiny format bonus under \"group\"", "html": "Reward = correctness + 0.01 for perfect format. An all-correct group [1.01, 1.00, 1.01, 1.00]: \\(\\mug=1.005\\), \\(\\sgg=0.005\\) → \\(A=\\pm0.005/0.0051\\approx\\)<b>±0.98</b>. A 0.01 bonus now pushes as hard as right-vs-wrong elsewhere. In batch mode with other prompts mixing 0s and 1s, \\(\\sgb\\approx0.4\\)–0.5 → A ≈ ±0.01. (Edge of the edge: 0/8 or 8/8 with no bonus → A = 0 in every mode.)", "start": 28.4, "end": 38.2}, {"key": "choose", "title": "How to choose, and what to log", "html": "<b>group</b> (TRL default): every prompt counts equally; amplifies near-solved and noisy groups. <b>batch</b> (PPO Lite; your run): one stable ruler, keeps real gap sizes. <b>none</b> (Dr. GRPO): no difficulty bias, but the learning rate has to suit the reward's scale. In all three, a group whose answers all score the s   return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});

setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
