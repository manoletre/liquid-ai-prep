<script>
const LESSON = {"id": "l12", "title": "Lesson 12 · Sampling: temperature, top-p and min_p", "h1": "Sampling: temperature, top-p, and why min_p helps", "sub": "Lesson 12 · a recall warm-up, then 3 new ideas: temperature (dividing the logits), truncation with top-k and top-p, and min_p, the cutoff that moves with the top token. Answers your open question on why min_p fixes high-temperature nonsense. Have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up: write sample_next(logits, T, min_p, rng) in numpy. Apply temperature, softmax, the min_p cut, renormalize, then sample one token index. Handle T = 0 as greedy.", "model": "<pre><code>def sample_next(logits, T=1.0, min_p=0.0, rng=np.random.default_rng()):\n    z = np.asarray(logits, float)\n    if T == 0:\n        return int(np.argmax(z))          # greedy\n    z = z / T\n    p = np.exp(z - z.max())               # subtract max: no overflow\n    p /= p.sum()\n    if min_p > 0:\n        p = np.where(p &gt;= min_p * p.max(), p, 0.0)\n        p /= p.sum()                      # renormalize\n    return int(rng.choice(len(p), p=p))</code></pre>Say out loud: subtracting the max doesn't change softmax (it cancels in the ratio), and the top token always survives min_p, so the sum is never 0."}, {"id": "d2", "q": "By hand: logits z = [2, 0, 0, 0] at T = 1. Softmax p? Then apply top-p = 0.8 and min_p = 0.2. Which tokens does each keep?", "model": "\\(e^z=[7.39,1,1,1]\\), sum 10.39, so \\(p=[0.711,\\,0.096,\\,0.096,\\,0.096]\\). <b>Top-p 0.8:</b> running sum 0.711, 0.807, so it keeps <b>2 tokens</b>, and which of the three tied ones gets in depends on sort order (an arbitrary tie-break). <b>min_p 0.2:</b> cutoff \\(0.2\\cdot0.711=0.142\\), so it keeps <b>only token 1</b>. Same distribution, different cuts."}, {"id": "d3", "q": "Interview: “Raising the temperature makes reflection tokens turn into nonsense. Why, and why is min_p a fix?” Answer in under a minute.", "model": "Temperature divides the logits, which shrinks every gap, so probability flows from the few sensible tokens into the huge tail of junk tokens. Individually they stay tiny, but together they add up, so junk gets sampled. Top-p doesn't help much because it fills a cumulative quota and drags in hundreds of tail tokens once the head's mass shrinks. min_p keeps a token only if \\(p_i\\ge p_{\\min}\\cdot p_{\\max}\\), so each junk token is compared with the top token and cut, however many there are. You get the variety of higher T with the coherence of a strict filter."}, {"id": "d4", "q": "Order of operations: in libraries like Hugging Face, temperature is applied to the logits before the top-p or min_p filter. Does it matter for min_p whether temperature comes first or last?", "model": "<b>Yes.</b> If temperature comes first, the min_p cut is made on the flattened distribution, so the cutoff \\(p_{\\min}\\cdot p_{\\max}\\) is looser and lets in more tokens. If the filter comes first (some runtimes offer “temperature last”), the cut is made on the sharper T = 1 distribution, then temperature only reshuffles the survivors. That's stricter and keeps junk out even at high T. Check which order your runtime uses before you compare settings."}], "key": ["z", "temp", "topk", "topp", "minp", "pmax", "lora_r", "lora_a", "leak"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "trn": ["train set", "Data gradient descent fits on. Its score can't tell memorizing from learning."], "val": ["validation (dev) set", "Held-out data for every choice: λ, learning rate, epochs, which model."], "tst": ["test set", "Held-out data measured once at the very end. The number you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."], "loraW": ["W · frozen base", "Pretrained weight matrix kept frozen in LoRA; δ still flows through it, but no ∂L/∂W is stored."], "loraA": ["A · LoRA down", "Trainable r × d_in factor. With B forms the low-rank update ΔW = BA."], "loraB": ["B · LoRA up", "Trainable d_out × r factor. Together with A: rank(BA) ≤ r."], "lora_r": ["r · LoRA rank", "Width of the adapter. Capacity of ΔW. Typical 4–64; r ≪ d. GRPO often uses r = 32."], "lora_a": ["α · LoRA alpha", "Strength knob. Effective scale of the adapter is α/r. Often set to r or 2r."], "lora_drop": ["LoRA dropout", "Randomly zeros adapter activations each forward pass; regularizes the update so it doesn't rely on one direction."], "temp": ["T · temperature", "Divides every logit before softmax: p ∝ e^{z/T}. T < 1 sharper, T > 1 flatter, T → 0 greedy."], "topk": ["top-k", "Keep only the k most likely tokens, then renormalize. A fixed count."], "topp": ["top-p (nucleus)", "Keep the fewest top tokens whose probabilities add up to ≥ p, then renormalize. Adapts to how sure the model is."], "minp": ["min_p", "Keep token i only if p_i ≥ p_min · p_max, then renormalize. The cutoff moves with the top token."], "pmax": ["p_max", "Probability of the single most likely token at this step."], "lora_scale": ["α/r · LoRA scale", "Multiplier on BA in the forward pass. Keeps update size stable when you change r."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: LoRA param count, the α/r scale, and scaler leakage", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "count", "title": "Lesson 11: LoRA trainable params", "html": "\\(B\\) is \\(d\\times r\\) and \\(A\\) is \\(r\\times d\\), so one adapted matrix trains \\(2\\cdot d\\cdot r\\) numbers. At \\(d=2048,\\ r=16\\): \\(2\\cdot2048\\cdot16=\\)<b>65,536</b>, against \\(2048^2=\\)<b>4,194,304</b> for full \\(W\\). \\(W\\) stays frozen: \\(\\delta\\) still flows through it, but no \\(\\partial L/\\partial W\\) is stored.", "start": 0.0, "end": 8.2}, {"key": "scale", "title": "Lesson 11: the scale α/r", "html": "\\(r=8,\\ \\alpha=32\\) gives scale \\(32/8=\\)<b>4</b>. Raise \\(r\\) to 32 and keep \\(\\alpha=32\\): scale \\(=1\\), a <b>4× weaker</b> push with more capacity. To keep 4 at \\(r=32\\), set \\(\\alpha=128\\). \\(r\\) is capacity and \\(\\alpha\\) is strength; when you change \\(r\\), move \\(\\alpha\\) with it.", "start": 8.2, "end": 16.2}, {"key": "leak", "title": "Lesson 10: a scaler fit on all the data leaks", "html": "Computing the mean and std on every row means each validation fold helped set them. Training has already seen a summary of the data it's scored on, so the CV score comes out a little too good. Fix: anything fit to data (a scaler, feature selection) is fit on the training folds <b>only, inside each fold</b>.", "start": 16.2, "end": 24.6}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) d = 1024, r = 32: LoRA trainable params for one matrix, and full W? (b) r = 4, α = 8: scale? Raise r to 16 with α unchanged: new scale? (c) For an ASR model, clips from the same speaker land in both train and test. What's the leak, and how do you split instead?", "model": "(a) \\(2\\cdot1024\\cdot32=\\)<b>65,536</b>; full \\(W=1024^2=\\)<b>1,048,576</b>. (b) \\(8/4=\\)<b>2</b>, then \\(8/16=\\)<b>0.5</b> (set \\(\\alpha=32\\) to keep 2). (c) <b>Group (speaker) leakage</b>: the model can recognize the voice instead of generalizing, so the test score is too good. Split <b>by speaker</b> (group k-fold), so each speaker is only in one side."}, "hook": {"id": "h1", "q": "From memory, three quick ones. (a) LoRA on one 2048 × 2048 matrix with r = 16: how many trainable params, and how many in full W? (b) r = 8 and α = 32: what's the scale? If you raise r to 32 and leave α alone, what's the new scale, and what α keeps the old one? (c) You standardize features (mean and std) on the whole dataset, then run 5-fold CV. What's wrong?", "model": "(a) \\(2\\cdot2048\\cdot16=\\)<b>65,536</b> trainable; full \\(W\\) is \\(2048^2=\\)<b>4,194,304</b> (64× more). (b) Scale \\(=32/8=\\)<b>4</b>. At r = 32 with α = 32 the scale is <b>1</b>, a 4× weaker push. To keep 4, set \\(\\alpha=4\\cdot32=\\)<b>128</b>. (c) <b>Leakage</b>: the mean and std include each validation fold, so training already saw a summary of the data it's scored on, and the CV score is a little too good. Fit the scaler on the training folds only, inside each fold."}, "duration": 24.6}, {"title": "Temperature: dividing the logits before softmax", "short": "Temperature", "video": "media/ch2-temperature.mp4", "poster": "media/ch2-temperature-poster.jpg", "steps": [{"key": "bridge", "title": "Recap: softmax turns logit gaps into ratios", "html": "The model outputs a logit \\(z\\) for every token. Softmax exponentiates and normalizes: \\(z=[2,1,0]\\) gives \\(e^z=[7.39,\\,2.72,\\,1.00]\\), sum \\(11.11\\), so \\(p=[0.665,\\,0.245,\\,0.090]\\). Where it comes from: \\(e^z\\) makes every score positive and turns a <b>difference</b> in logits into a <b>ratio</b> of probabilities, \\(p_i/p_j=e^{z_i-z_j}\\). A gap of 1 means about 2.7× as likely.", "start": 0.0, "end": 8.9}, {"key": "formula", "title": "Temperature divides every gap", "html": "$$p_i=\\frac{e^{z_i/T}}{\\sum_j e^{z_j/T}}\\qquad \\frac{p_i}{p_j}=e^{(z_i-z_j)/T}$$ Dividing by \\(T\\) divides <b>every gap</b>. \\(T<1\\) makes the gaps bigger, so the distribution gets sharper (closer to always picking the top token). \\(T>1\\) shrinks the gaps, so it gets flatter and more random. The name comes from physics, where the same formula describes particles: hot means more spread out.", "start": 8.9, "end": 16.7}, {"key": "ex1", "title": "Worked example 1: z = [2, 1, 0] at T = 2 and T = 0.5", "html": "<b>T = 2:</b> \\(z/T=[1,\\,0.5,\\,0]\\), \\(e=[2.72,\\,1.65,\\,1.00]\\), sum \\(5.37\\), so \\(p=[0.506,\\,0.307,\\,0.186]\\) (flatter). <b>T = 0.5:</b> \\(z/T=[4,\\,2,\\,0]\\), \\(e=[54.6,\\,7.39,\\,1.00]\\), sum \\(62.99\\), so \\(p=[0.867,\\,0.117,\\,0.016]\\) (sharper). Same logits and same order; only the spread changes.", "start": 16.7, "end": 27.7}, {"key": "ex2", "title": "Worked example 2 (edge): a tie, T → 0 and T → ∞", "html": "Logits \\(z=[1,1,0]\\). <b>T = 1:</b> \\(e=[2.72,\\,2.72,\\,1.00]\\), so \\(p=[0.422,\\,0.422,\\,0.155]\\). <b>T = 0.5:</b> \\(e=[7.39,\\,7.39,\\,1.00]\\), so \\(p=[0.468,\\,0.468,\\,0.063]\\). <b>T → 0:</b> \\(p\\to[0.5,\\,0.5,\\,0]\\). That's greedy decoding; tied tokens share the mass (a real argmax just picks one). <b>T → ∞:</b> every gap goes to 0, so \\(p\\to[1/3,\\,1/3,\\,1/3]\\), pure noise. Temperature never lets a lower logit beat a higher one.", "start": 27.7, "end": 37.1}, {"key": "faded", "title": "Your turn: two tokens, z = [3, 1], T = 2", "html": "Gap \\(=3-1=2\\), and gap\\(/T=1\\), so \\(p_1/p_2=e^1\\approx2.72\\). Now finish: \\(p_1=2.72/(2.72+1)=\\)? <details><summary>Check your last step</summary>\\(p_1=2.72/3.72\\approx\\)<b>0.731</b> and \\(p_2\\approx\\)<b>0.269</b>. At \\(T=1\\) the same logits give \\(e^2/(e^2+1)\\approx0.881\\), so \\(T=2\\) clearly flattened it.</details>", "start": 37.1, "end": 45.6}], "check": {"id": "c2", "q": "Logits z = [3, 1]. (a) p of the first token at T = 1? (b) At T = 0.5? (c) In a GRPO run you sample G = 8 answers per prompt. Why would greedy decoding (T → 0) ruin the learning signal? (Hint: Lesson 2, equal rewards.)", "model": "(a) Gap 2, so ratio \\(e^2\\approx7.39\\) and \\(p_1=7.39/8.39\\approx\\)<b>0.881</b>. (b) Gap\\(/T=4\\), so ratio \\(e^4\\approx54.6\\) and \\(p_1=54.6/55.6\\approx\\)<b>0.982</b>. (c) At T → 0 all 8 samples are the <b>same answer</b>, so they get the same reward, every advantage \\(A=R-\\mu\\) is <b>0</b>, and there's no gradient. Rollouts need T around 1 so the group has variety."}, "hook": {"id": "h2", "q": "A model scores three tokens with logits z = [2, 1, 0], which softmax turns into p ≈ [0.67, 0.24, 0.09] at temperature T = 1. Sampling divides every logit by T before the softmax. (a) At T = 0.5, does the top token's probability go up or down? (b) At T = 2? (c) What happens as T gets close to 0? (d) Can any T make the third token more likely than the first?", "model": "(a) <b>Up</b>: dividing by 0.5 doubles the gaps, so p ≈ [0.867, 0.117, 0.016]. (b) <b>Down</b>: dividing by 2 halves the gaps, so p ≈ [0.506, 0.307, 0.186]. (c) It becomes <b>greedy</b>: all the probability goes to the top token. (d) <b>No.</b> T rescales the gaps but never flips their sign, so the order stays the same; even T → ∞ only reaches a uniform tie."}, "duration": 45.6}, {"title": "Truncation: top-k and top-p (nucleus)", "short": "top-k, top-p", "video": "media/ch3-top-k-top-p.mp4", "poster": "media/ch3-top-k-top-p-poster.jpg", "steps": [{"key": "idea", "title": "Cut the tail, then renormalize", "html": "A real vocabulary has tens of thousands of tokens (65,536 for some models), and most have tiny probabilities. One by one they're rare, but <b>together</b> they get picked now and then, and one bad token can derail the rest of the text. Truncation cuts the tail, then divides each kept \\(p\\) by the kept total so they sum to 1. <b>Top-k</b> keeps the \\(k\\) most likely tokens. <b>Top-p</b> (nucleus) keeps the fewest top tokens whose probabilities add up to at least \\(p\\).", "start": 0.0, "end": 8.8}, {"key": "ex1", "title": "Worked example 1: same distribution, both rules", "html": "\\(p=[0.50,\\,0.20,\\,0.15,\\,0.10,\\,0.05]\\). <b>Top-k = 2:</b> keep 0.50 and 0.20, total 0.70, so \\(0.50/0.70=0.714\\) and \\(0.20/0.70=0.286\\). <b>Top-p = 0.8:</b> running sum 0.50, 0.70, <b>0.85</b>. The first time it reaches 0.8 is at token 3, so keep 3 with total 0.85: \\(0.50/0.85=0.588\\), \\(0.20/0.85=0.235\\), \\(0.15/0.85=0.176\\).", "start": 8.8, "end": 19.4}, {"key": "ex2", "title": "Worked example 2 (edge): a very sure model", "html": "\\(p=[0.95,\\,0.03,\\,0.01,\\,0.01]\\), where the last two are junk. <b>Top-k = 3</b> still keeps the junk token at 0.01; after dividing by 0.99 it keeps about a 1% chance. <b>Top-p = 0.9:</b> 0.95 already reaches 0.9 at token 1, so it keeps only the top token, the same as greedy. Top-k is a fixed count; top-p shrinks when the model is sure and grows when it isn't.", "start": 19.4, "end": 29.6}, {"key": "faded", "title": "Your turn: p = [0.40, 0.30, 0.20, 0.10], top-p = 0.75", "html": "Running sum: 0.40, 0.70, 0.90. It first reaches 0.75 at token 3, so keep 3 with total 0.90. Now renormalize. <details><summary>Check your last step</summary>\\(0.40/0.90=\\)<b>0.444</b>, \\(0.30/0.90=\\)<b>0.333</b>, \\(0.20/0.90=\\)<b>0.222</b>. They sum to 1.</details>", "start": 29.6, "end": 38.1}], "check": {"id": "c3", "q": "p = [0.60, 0.25, 0.10, 0.05]. (a) Top-k = 2: kept tokens and their renormalized p? (b) Top-p = 0.9: how many kept, and their renormalized p? (c) In one sentence, why is top-p usually preferred over a fixed top-k?", "model": "(a) Keep 0.60 and 0.25 (total 0.85): <b>0.706</b> and <b>0.294</b>. (b) Running sum 0.60, 0.85, 0.95, so keep <b>3</b> (total 0.95): <b>0.632, 0.263, 0.105</b>. (c) Top-p <b>adapts to how sure the model is</b>: a few tokens when it's confident and many when it's genuinely unsure, while top-k keeps the same count either way."}, "hook": {"id": "h3", "q": "Next-token probabilities are [0.50, 0.20, 0.15, 0.10, 0.05]. You want to stop sampling the unlikely tail. (a) If you keep only the 2 most likely tokens, what are their probabilities after you rescale them to sum to 1? (b) If instead you keep the fewest top tokens whose probabilities add up to at least 0.8, how many do you keep? (c) Which of the two rules adapts when the model is very sure?", "model": "(a) That's <b>top-k = 2</b>: kept total 0.70, so \\(0.50/0.70=\\)<b>0.714</b> and \\(0.20/0.70=\\)<b>0.286</b>. (b) That's <b>top-p = 0.8</b>: running sum 0.50, 0.70, 0.85, so you keep <b>3</b> tokens, which become 0.588, 0.235, 0.176. (c) <b>Top-p</b>: with one token at 0.95 it keeps just that token, while top-k always keeps k."}, "duration": 38.1}, {"title": "min_p: why it fixes high-temperature nonsense", "short": "min_p", "video": "media/ch4-min-p.mp4", "poster": "media/ch4-min-p-poster.jpg", "steps": [{"key": "bridge", "title": "Recap: what temperature does to the tail", "html": "Two pieces from this lesson. Temperature \\(T>1\\) <b>flattens</b>: it shrinks the gaps, so the tail gets lifted. Truncation <b>cuts</b> the tail, then renormalizes. The catch: a real tail is tens of thousands of junk tokens, each tiny. The question for this chapter is which cut still works after temperature has flattened everything.", "start": 0.0, "end": 8.8}, {"key": "rule", "title": "The min_p rule", "html": "$$\\text{keep token } i \\text{ if } p_i \\ge p_{\\min}\\cdot p_{\\max}$$ \\(p_{\\max}\\) is the top token's probability and \\(p_{\\min}\\) is the knob (often 0.05–0.1). If the model is sure (\\(p_{\\max}=0.90\\)), the cutoff is 0.09, which is strict. If it's unsure (\\(p_{\\max}=0.30\\)), the cutoff is 0.03, which is loose. Each token is compared with the <b>top token</b>, not added into a running sum.", "start": 8.8, "end": 17.7}, {"key": "ex1", "title": "Worked example 1: sure vs unsure (made-up numbers)", "html": "<b>Sure:</b> “The capital of France is …” gives \\(p=[0.90,\\,0.05,\\,0.03,\\,0.02]\\). Cutoff \\(0.1\\cdot0.90=0.09\\); 0.05, 0.03 and 0.02 are all below it, so only the top token survives. <b>Unsure:</b> a character name in a story gives \\(p=[0.30,\\,0.28,\\,0.25,\\,0.10,\\,0.07]\\). Cutoff \\(0.1\\cdot0.30=0.03\\); all five pass, so the variety stays.", "start": 17.7, "end": 25.8}, {"key": "ex2", "title": "Worked example 2 (edge): high T and a junk tail", "html": "Made-up next token after a reasoning step at \\(T=2\\): “Wait” 0.35, “So” 0.20, “Hmm” 0.10, plus 1,000 junk tokens sharing 0.35 (about 0.00035 each). <b>Top-p 0.9:</b> the head sums to 0.65, so it needs 0.25 more, roughly <b>714 junk tokens</b>, and the chance the next token is junk is \\(0.25/0.90\\approx\\)<b>28%</b>. <b>min_p 0.1:</b> cutoff \\(0.1\\cdot0.35=0.035\\); every junk token (0.00035) is far below it, so <b>all are cut</b>. Keep “Wait”, “So”, “Hmm”, renormalized to \\(0.538,\\,0.308,\\,0.154\\). That's the answer to your Todoist question: min_p lets you raise T for variety without the tail taking over.", "start": 25.8, "end": 37.8}, {"key": "faded", "title": "Your turn: T = 1.5, p = [0.45, 0.25, 0.08] + junk", "html": "The 1,000 junk tokens share 0.22. Top-p 0.9: the head sums to 0.78, so it needs 0.12 from the junk, a junk chance of \\(0.12/0.90\\approx13\\%\\). min_p 0.1: cutoff \\(0.1\\cdot0.45=0.045\\). Which tokens survive, and what are their renormalized probabilities? <details><summary>Check your last step</summary>0.45, 0.25 and 0.08 are all ≥ 0.045, so keep those three (sum 0.78) and drop all the junk: <b>0.577, 0.321, 0.103</b>.</details>", "start": 37.8, "end": 47.4}], "check": {"id": "c4", "q": "(a) p_min = 0.05 and p = [0.60, 0.20, 0.04, 0.02, …tiny tail]. What's the cutoff, and which tokens survive? (b) Same p_min, but the model is unsure: the top token has p = 0.08. What's the cutoff, and roughly what happens to variety? (c) For GRPO rollouts on math, why might you pair T ≈ 1 with min_p instead of just lowering T?", "model": "(a) Cutoff \\(0.05\\cdot0.60=\\)<b>0.03</b>: keep <b>0.60, 0.20, 0.04</b>; 0.02 and the tail are cut. (b) Cutoff \\(0.05\\cdot0.08=\\)<b>0.004</b>, very loose, so many tokens survive and variety stays where the model is genuinely unsure. (c) Lowering T makes all G samples look alike, so equal rewards give \\(A=0\\) and no signal. <b>T ≈ 1 keeps the group diverse</b>, and <b>min_p removes the junk tail</b> that higher T lifts, so reflection tokens stay coherent."}, "hook": {"id": "h4", "q": "You raise the temperature to get more varied reasoning, and now reflection tokens like “Wait” sometimes get followed by gibberish. min_p keeps a token only if its probability is at least p_min times the top token's probability. (a) With p_min = 0.1, what's the cutoff when the top token has p = 0.90? When it has p = 0.30? (b) Why might this rule block gibberish better than top-p does once the temperature is high?", "model": "(a) \\(0.1\\cdot0.90=\\)<b>0.09</b> and \\(0.1\\cdot0.30=\\)<b>0.03</b>. The cutoff moves with how sure the model is. (b) High T lifts the whole tail. Top-p has to fill a <b>quota</b> (reach 0.9 total), so once the head's mass shrinks it pulls in hundreds of junk tokens. min_p judges <b>each token against the top one</b>: every junk token is still far below \\(p_{\\min}\\cdot p_{\\max}\\), so none get in, however many there are."}, "duration": 47.4}], "summary": ["Temperature divides every logit before softmax, so it divides every gap: p_i/p_j = e^{(z_i − z_j)/T}. T < 1 is sharper, T > 1 flatter, T → 0 greedy, T → ∞ uniform. It never changes the order.", "Truncation cuts the tail and renormalizes. Top-k keeps a fixed count; top-p keeps the fewest top tokens reaching a cumulative p, so it adapts to how sure the model is.", "min_p keeps a token only if p_i ≥ p_min · p_max. Each token is judged against the top one, so a lifted junk tail at high temperature gets cut while real variety survives. That's why it pairs well with T ≈ 1 for diverse GRPO rollouts."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;

const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;

function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
