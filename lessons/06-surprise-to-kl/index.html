<script>
const LESSON = {"id": "l06", "title": "Lesson 6 · Surprise → cross-entropy → entropy → KL divergence", "h1": "Surprise → cross-entropy → entropy → KL", "sub": "Lesson 6 · a recall warm-up, then 4 new ideas, one per chapter, each built on the last: surprise, cross-entropy loss, entropy, KL divergence. Every computation uses powers of ½, so it all works on paper. Have a pen ready.", "drill": [{"id": "d1", "q": "Interviewer: “How would you measure how different two distributions are, say the word distributions of two document corpora?”", "model": "<b>KL divergence</b>, D_KL(P‖Q) = Σ P log(P/Q): the extra bits per word you'd pay encoding corpus P with a model of Q. Mention that it's asymmetric and infinite when Q has a zero where P doesn't, so smooth the counts (add-one) or use the symmetric, bounded <b>Jensen–Shannon</b> divergence. Cosine similarity on word-count vectors is a simpler, non-probabilistic option."}, {"id": "d2", "q": "Why do we train classifiers with cross-entropy instead of directly with KL to the data distribution?", "model": "They have the <b>same gradient</b>: H(P,Q) = H(P) + D_KL(P‖Q), and H(P) doesn't depend on the model. Cross-entropy is just simpler to compute (−log q of the true label)."}, {"id": "d3", "q": "What does β control in a PPO or GRPO config, and what are the risks of β too high and of β = 0?", "model": "β weights the KL penalty to the reference model. <b>Too high:</b> the policy barely moves from the reference and learns little. <b>β = 0:</b> no leash, so reward can climb faster but with more risk of drift, reward hacking or degenerate text. Recipes like DAPO drop the KL term and rely on clipping instead."}, {"id": "d4", "q": "Your model's next-token entropy drops from 1.1 to 0.2 nats during GRPO. Good or bad, and what would you check?", "model": "Probably <b>entropy collapse</b>: the samples for each prompt become nearly identical, rewards tie, advantages vanish and learning stalls. Check the share of groups with zero reward variance and the sample diversity. Fixes: higher sampling temperature, an entropy bonus, or a looser upper clip (DAPO's “clip-higher”)."}], "key": ["surp", "Pd", "Qd", "CE", "HP", "KL", "beta"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: PPO clip, GRPO groups, logistic gradient", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "clip", "title": "PPO: why a ratio past 1 + ε gets no gradient", "html": "For a good response (\\(A>0\\)) the objective is \\(\\min(\\rho A,\\ \\mathrm{clip}(\\rho,1-\\epsilon,1+\\epsilon)A)\\). It rises with \\(\\rho\\) until \\(1+\\epsilon=1.2\\), then goes flat. At \\(\\rho=1.3\\) you're on the flat part, so the gradient is <b>0</b>: the response already got its push this batch.", "start": 0.0, "end": 8.0}, {"key": "grpo", "title": "GRPO: equal rewards mean zero advantage", "html": "GRPO's baseline is the group mean \\(\\mu\\). If all 8 rewards are 1, then \\(\\mu=1\\) and every \\(A=R-\\mu=0\\). No answer beats its siblings, so the prompt gives <b>no learning signal</b>. Keep this in mind for Chapter 4.", "start": 8.0, "end": 14.4}, {"key": "logreg", "title": "Logistic regression: the (p − y)x gradient", "html": "\\(\\partial L/\\partial w=(p-y)\\,x=(0.8-0)\\cdot2=1.6\\). It's positive, so \\(w\\leftarrow w-\\eta\\cdot1.6\\) goes down, the score drops, and \\(p\\) falls toward the label 0. Lesson 7 rebuilds this formula slowly from scratch.", "start": 14.4, "end": 20.8}], "check": {"id": "c1", "q": "Same three ideas, new numbers. (a) PPO: a bad response (A &lt; 0) with ρ = 0.7 and ε = 0.2. Clipped or not, and what gradient? (b) GRPO with 4 answers and rewards [1, 0, 0, 0], using the mean as the baseline (skip the std): what is each advantage? (c) Logistic regression with p = 0.3, y = 1, x = −1: ∂L/∂w, and which way does p move after the update?", "model": "(a) <b>Clipped, gradient 0.</b> Take A = −1: ρA = −0.7 and clip(0.7)·A = 0.8·(−1) = −0.8. The min is −0.8, the constant clipped term, so the gradient is 0. The response has already been pushed down by more than 20%. (b) μ = 0.25, so A = [<b>0.75, −0.25, −0.25, −0.25</b>]. (c) (0.3 − 1)·(−1) = <b>0.7</b> &gt; 0, so w goes down. Because x is negative, a smaller w raises the score w·x, so p <b>rises</b> toward 1, as it should."}, "hook": {"id": "h1", "q": "From memory, three quick ones. (a) PPO: a good response (A &gt; 0) whose ratio ρ = π_θ/π_old has already reached 1.3, with ε = 0.2. What gradient does the clipped objective give it, and why? (b) GRPO: all 8 answers to a prompt get reward 1. What is each advantage, and what does this prompt add to the update? (c) Logistic regression with p = 0.8, true label y = 0, input x = 2: compute ∂L/∂w and say which way w moves.", "model": "(a) <b>Zero.</b> With A &gt; 0 the objective is min(ρA, clip(ρ, 0.8, 1.2)·A). Past ρ = 1.2 the clipped term wins and is constant, so the gradient is 0. That's PPO's trust region: one batch can't move a response's probability more than about 20% from the sampling policy. (b) The mean is 1, so every A = R − μ = <b>0</b> (and the std is 0). The prompt adds <b>no learning signal</b>. (c) (p − y)·x = 0.8·2 = <b>1.6</b> &gt; 0, so w ← w − η·1.6 goes down, which lowers p toward the label 0."}, "duration": 20.8}, {"title": "Surprise: −log p", "short": "Surprise", "video": "media/ch2-surprise.mp4", "poster": "media/ch2-surprise-poster.jpg", "steps": [{"key": "want", "title": "Three rules a cost should follow", "html": "The model gave the true outcome probability \\(p\\). We want a cost that is (1) <b>0</b> when \\(p=1\\), (2) bigger when \\(p\\) is smaller, and (3) <b>additive</b>: two independent clips should cost the sum of their two costs.", "start": 0.0, "end": 8.1}, {"key": "halvings", "title": "Count halvings: −log₂ p", "html": "Count how many times you halve 1 to reach \\(p\\): 1 → 0, ½ → 1, ¼ → 2, ⅛ → 3. That count is $$\\text{surprise}(p)=-\\log_2 p$$ <b>Worked example 1:</b> \\(p=\\tfrac12\\) costs 1 bit and \\(p=\\tfrac18\\) costs 3 bits.", "start": 8.1, "end": 17.8}, {"key": "add", "title": "Why the log: products become sums", "html": "For independent clips, \\(P(A\\text{ and }B)=P(A)\\,P(B)=\\tfrac12\\cdot\\tfrac14=\\tfrac18\\). <b>Worked example 2:</b> \\(-\\log_2\\tfrac18=3=1+2\\), which is the two separate surprises added up. The identity \\(\\log(ab)=\\log a+\\log b\\) is exactly rule 3.", "start": 17.8, "end": 24.6}, {"key": "edge", "title": "Edge case p → 0, units, and your turn", "html": "As \\(p\\to0\\), surprise \\(\\to\\infty\\): being confident and wrong is punished without limit. Code uses \\(\\ln\\) (units called nats); 1 bit = \\(\\ln 2\\approx0.693\\) nats. The base only changes the units. <details><summary>Check your last step: p = 1/16</summary>Four halvings (1 → ½ → ¼ → ⅛ → 1/16), so <b>4 bits</b> (≈ 2.77 nats).</details>", "start": 24.6, "end": 33.5}], "check": {"id": "c2", "q": "Two independent clips. The model gave the true word probability 1/32 on the first and 1/4 on the second. (a) What is the surprise of each, in bits? (b) What is the total surprise? Compute it two ways: by adding, and from the joint probability. (c) What is the surprise of p = 1/2 in nats?", "model": "(a) 1/32 → <b>5 bits</b> (five halvings); 1/4 → <b>2 bits</b>. (b) 5 + 2 = <b>7 bits</b>. Joint: 1/32 · 1/4 = 1/128 = 2⁻⁷, and −log₂ of that is 7 bits ✓. (c) −ln(1/2) = ln 2 ≈ <b>0.693 nats</b>."}, "hook": {"id": "h2", "q": "Your wake-word model gave “Hey Guava” probability 1/2 on one clip and 1/8 on another, and both times the phrase really was said. How much more should the second clip cost the model: 4× (because 1/8 is 4× smaller than 1/2), or something else? Try to propose a cost formula.", "model": "Use <b>surprise = −log₂ p</b>. p = 1/2 costs 1 bit and p = 1/8 costs 3 bits, so the second costs <b>3×</b>, not 4×. Surprise counts how many halvings p sits below 1. The log is there so that independent events, whose probabilities multiply, have costs that <i>add</i>."}, "duration": 33.5}, {"title": "Cross-entropy loss, from likelihood", "short": "Cross-ent", "video": "media/ch3-cross-entropy.mp4", "poster": "media/ch3-cross-entropy-poster.jpg", "steps": [{"key": "likelihood", "title": "Likelihood: how probable were the real labels?", "html": "Three clips; the model gave the true labels probabilities ½, ¼ and ½. If clips are independent, the probability of getting all three real labels is the product $$\\tfrac12\\cdot\\tfrac14\\cdot\\tfrac12=\\tfrac1{16}$$ That's the <b>likelihood</b>. Maximum likelihood means picking the model that makes it as big as possible.", "start": 0.0, "end": 6.7}, {"key": "log", "title": "Take −log: likelihood becomes total surprise", "html": "Products of many small numbers shrink toward 0, so take \\(-\\log_2\\): \\(-\\log_2\\tfrac1{16}=4=1+2+1\\) bits, the sum of the per-clip surprises. Divide by \\(N\\): $$L_{CE}=-\\frac1N\\sum_i\\log q(y_i)=\\tfrac43\\approx1.33\\text{ bits per clip}$$ <b>Worked example 1.</b> Maximizing likelihood is the same as minimizing this.", "start": 6.7, "end": 13.1}, {"key": "onehot", "title": "One-hot labels: only the true class counts", "html": "<b>Worked example 2:</b> the truth is “yes”. Model A: \\(-\\log_2\\tfrac12=1\\) bit. Model B: \\(-\\log_2\\tfrac18=3\\) bits. With a one-hot \\(y\\), \\(-\\sum_k y_k\\log q_k=-\\log q_{\\text{true}}\\). <b>Edge case:</b> if \\(q_{\\text{true}}=0\\) the loss is \\(\\infty\\). That's why softmax never outputs an exact 0, and why label smoothing exists.", "start": 13.1, "end": 18.8}, {"key": "soft", "title": "The general form H(P, Q)", "html": "When the truth is a distribution \\(P\\) (soft labels, or the data's real frequencies), weight each class's surprise by how often it is the truth: $$H(P,Q)=-\\sum_k P(k)\\log_2Q(k)$$ With \\(P=[\\tfrac12,\\tfrac14,\\tfrac14]\\) and \\(Q=[\\tfrac14,\\tfrac12,\\tfrac14]\\): \\(\\tfrac12\\cdot2+\\tfrac14\\cdot1+\\tfrac14\\cdot2=1.75\\) bits. <details><summary>Check your last step: Q = P</summary>\\(\\tfrac12\\cdot1+\\tfrac14\\cdot2+\\tfrac14\\cdot2=\\)<b>1.5 bits</b>. That's lower than 1.75: predicting the truth exactly is the cheapest. Remember this 1.5, because it comes back in Chapter 4.</details>", "start": 18.8, "end": 26.8}], "check": {"id": "c3", "q": "Two clips. The true labels are “yes”, then “no”. The model gave “yes” probability 1/4 on clip 1 and “no” probability 1/8 on clip 2. (a) What is the average cross-entropy loss in bits? (b) The same in nats? (c) A third clip arrives where the model gave the true label probability 0.001. Roughly what happens to the average loss, and why?", "model": "(a) The surprises are 2 and 3 bits, so the average is <b>2.5 bits</b>. (b) 2.5 × 0.693 ≈ <b>1.73 nats</b> (the same as −(ln ¼ + ln ⅛)/2). (c) −log₂ 0.001 ≈ 10 bits, so the average jumps to (2 + 3 + 10)/3 ≈ <b>5 bits</b>. One confident mistake dominates: cross-entropy punishes overconfidence hard."}, "hook": {"id": "h3", "q": "A 3-way intent classifier {yes, no, repeat}. The true label is “yes”. Model A predicts [yes 1/2, no 1/4, repeat 1/4]. Model B predicts [yes 1/8, no 1/2, repeat 3/8]. Using surprise from Chapter 2, what loss would you give each model on this clip? Do the probabilities on the wrong classes matter?", "model": "With a one-hot label only the probability on the <b>true class</b> matters. A: −log₂(1/2) = <b>1 bit</b>. B: −log₂(1/8) = <b>3 bits</b>. That's the cross-entropy loss. The wrong classes matter only indirectly: probabilities sum to 1, so mass on wrong classes is mass taken away from the right one."}, "duration": 26.8}, {"title": "Entropy: the surprise you can't avoid", "short": "Entropy", "video": "media/ch4-entropy.mp4", "poster": "media/ch4-entropy-poster.jpg", "steps": [{"key": "avg", "title": "Entropy = cross-entropy with the right model", "html": "Predict with the true distribution itself: $$H(P)=H(P,P)=-\\sum_kP(k)\\log_2P(k)$$ <b>Worked example 1:</b> a fair coin gives \\(\\tfrac12\\cdot1+\\tfrac12\\cdot1=1\\) bit.", "start": 0.0, "end": 7.5}, {"key": "three", "title": "More outcomes", "html": "<b>Worked example 2:</b> \\(P=[\\tfrac12,\\tfrac14,\\tfrac14]\\) gives \\(\\tfrac12\\cdot1+\\tfrac14\\cdot2+\\tfrac14\\cdot2=1.5\\) bits, the Chapter 3 answer for \\(Q=P\\). Uniform over 4 outcomes gives \\(4\\cdot\\tfrac14\\cdot2=2\\) bits \\(=\\log_2 4\\). <details><summary>Check your last step: P = [½, ⅛, ⅛, ¼]</summary>\\(\\tfrac12\\cdot1+\\tfrac18\\cdot3+\\tfrac18\\cdot3+\\tfrac14\\cdot2=0.5+0.375+0.375+0.5=\\)<b>1.75 bits</b>.</details>", "start": 7.5, "end": 14.3}, {"key": "edge", "title": "Edge case: certainty", "html": "\\(P=[1,0,0]\\): \\(1\\cdot\\log_21=0\\), and zero-probability outcomes add nothing (we count \\(0\\log0\\) as 0, because \\(x\\log x\\to0\\)). So <b>H = 0</b>. Peaked means low entropy, spread out means high, and the maximum for \\(K\\) outcomes is \\(\\log_2K\\) (uniform).", "start": 14.3, "end": 21.7}, {"key": "llm", "title": "Why you care: entropy in GRPO", "html": "Each next token is a distribution over the vocabulary. TRL's <code>entropy</code> metric is the average next-token entropy in nats. Your GRPO run went from 1.08 to about 0.88: the policy got more peaked. If it collapses, the 8 samples per prompt look alike, rewards tie, and advantages go to 0 (Chapter 1). Entropy is your exploration gauge.", "start": 21.7, "end": 30.0}], "check": {"id": "c4", "q": "Compute the entropy in bits of (a) P = [½, ½, 0, 0] and (b) P = [¼, ¼, ¼, ⅛, ⅛]. (c) Which one is more spread out, and what's the maximum entropy possible with 5 outcomes?", "model": "(a) ½·1 + ½·1 + 0 + 0 = <b>1 bit</b> (the zeros add nothing). (b) 3·(¼·2) + 2·(⅛·3) = 1.5 + 0.75 = <b>2.25 bits</b>. (c) (b) is more spread out. The maximum for 5 outcomes is log₂ 5 ≈ <b>2.32 bits</b> (uniform), and (b) is close to it."}, "hook": {"id": "h4", "q": "Two coins: a fair one, and a trick coin that always lands heads. Even if you know each coin perfectly, how surprised are you, on average, per flip? Give a number in bits for each.", "model": "Fair coin: each side has p = ½, which is 1 bit, so the average is <b>1 bit</b>. Trick coin: heads has p = 1, which is 0 bits every time, so <b>0 bits</b>. That average surprise under the true distribution is the <b>entropy</b> H(P)."}, "duration": 30.0}, {"title": "KL divergence: the gap between the two", "short": "KL", "video": "media/ch5-kl-divergence.mp4", "poster": "media/ch5-kl-divergence-poster.jpg", "steps": [{"key": "recap", "title": "Recap: the three pieces", "html": "<b>Surprise</b> \\(-\\log q\\) is the cost of one outcome. <b>Cross-entropy</b> \\(H(P,Q)\\) is the average surprise when the truth is \\(P\\) and you predict \\(Q\\). <b>Entropy</b> \\(H(P)\\) is the same average when you predict with \\(P\\) itself; it's the floor. For \\(P=[\\tfrac12,\\tfrac14,\\tfrac14]\\) we found 1.75 and 1.5.", "start": 0.0, "end": 7.1}, {"key": "gap", "title": "KL = cross-entropy − entropy", "html": "$$D_{KL}(P\\|Q)=H(P,Q)-H(P)=\\sum_kP(k)\\log_2\\frac{P(k)}{Q(k)}$$ <b>Worked example 1</b>, two ways: \\(1.75-1.5=0.25\\) bits, or term by term \\(\\tfrac12\\log_22+\\tfrac14\\log_2\\tfrac12+\\tfrac14\\log_21=0.5-0.25+0=0.25\\). A single term can be negative; the sum is always ≥ 0.", "start": 7.1, "end": 15.0}, {"key": "asym", "title": "Edge case: KL is not symmetric", "html": "<b>Worked example 2:</b> \\(P=[1,0]\\), \\(Q=[\\tfrac12,\\tfrac12]\\). \\(D_{KL}(P\\|Q)=1\\cdot\\log_2\\tfrac{1}{1/2}=1\\) bit (terms where \\(P=0\\) drop out). \\(D_{KL}(Q\\|P)=\\tfrac12\\log_2\\tfrac{1/2}{1}+\\tfrac12\\log_2\\tfrac{1/2}{0}=\\infty\\). Order matters, so it's a <i>divergence</i>, not a distance. A symmetric option is the Jensen–Shannon divergence.", "start": 15.0, "end": 22.9}, {"key": "train", "title": "Why training a classifier minimizes KL", "html": "$$H(P,Q)=H(P)+D_{KL}(P\\|Q)$$ \\(H(P)\\) is fixed by the data; only the model \\(Q\\) changes. So minimizing cross-entropy, minimizing KL to the data and maximizing likelihood are one objective with three names.", "start": 22.9, "end": 28.6}, {"key": "rlhf", "title": "The KL penalty in RLHF, PPO and GRPO", "html": "$$\\max_\\theta\\ \\mathbb E[R]-\\beta\\,D_{KL}(\\pi_\\theta\\|\\pi_{\\mathrm{ref}})$$ For each sampled token it's estimated by \\(\\log\\pi_\\theta(y)-\\log\\pi_{\\mathrm{ref}}(y)\\). \\(\\beta>0\\) keeps the policy close to the reference model (fluent, harder to reward-hack). \\(\\beta=0\\), as in your GRPO run, removes the leash. <details><summary>Check your last step: π_θ(y) = 1/2, π_ref(y) = 1/8</summary>\\(\\log_2\\frac{1/2}{1/8}=\\log_24=\\)<b>2 bits</b>: the policy now likes this token 4× more than the reference does, and the penalty charges for that.</details>", "start": 28.6, "end": 37.3}], "check": {"id": "c5", "q": "Truth P = [½, ½, 0, 0] and model Q = uniform [¼, ¼, ¼, ¼]. (a) Compute D_KL(P‖Q) two ways: as H(P,Q) − H(P), and term by term. (b) Compute D_KL(Q‖P). (c) In one sentence: which direction blows up if your model gives probability 0 to something that really happens?", "model": "(a) H(P,Q) = ½·2 + ½·2 = 2 bits and H(P) = 1 bit, so KL = <b>1 bit</b>. Term by term: ½·log₂(½ ÷ ¼) + ½·log₂(½ ÷ ¼) = ½ + ½ = 1 ✓. (b) Q puts ¼ on outcomes where P is 0, giving terms ¼·log₂(¼ ÷ 0) = ∞, so D_KL(Q‖P) = <b>∞</b>. (c) D_KL(P‖Q), with P the truth: if Q(k) = 0 where P(k) &gt; 0, the term P(k)·log(P(k)/0) is infinite, which is the same as an infinite cross-entropy loss on a confidently wrong prediction."}, "hook": {"id": "h5", "q": "Same truth P = [½, ¼, ¼]. In Chapter 3, predicting with Q = [¼, ½, ¼] cost H(P,Q) = 1.75 bits per sample. In Chapter 4, predicting with P itself cost H(P) = 1.5 bits. What does the 0.25-bit gap measure? Can that gap ever be negative?", "model": "It's the <b>KL divergence</b>, D_KL(P‖Q) = H(P,Q) − H(P) = 0.25 bits: the extra surprise you pay per sample for using the wrong model Q instead of the truth P. It is <b>never negative</b> (no model beats the truth on average) and it is 0 only when Q = P. It's the standard answer to “how different are two distributions?”, with the caveat that it isn't symmetric."}, "duration": 37.3}], "summary": ["Surprise −log₂ p counts halvings below 1. Logs turn independent probabilities (×) into costs (+). p → 0 gives ∞. 1 bit = ln 2 ≈ 0.693 nats.", "Cross-entropy loss = average surprise at the true labels, −(1/N) Σ log q(yᵢ). Maximum likelihood = minimum cross-entropy. With one-hot labels only q(true class) counts.", "Entropy H(P) = average surprise when you predict with the truth itself: 0 when certain, log₂ K when uniform. In GRPO it's the exploration gauge.", "KL(P‖Q) = H(P,Q) − H(P) = Σ P log(P/Q): ≥ 0, not symmetric, ∞ if Q gives 0 to something P does. Classifier training minimizes it; RLHF's β·KL keeps the policy near the reference."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;
const store={get:(q,f)=>localStorage.getItem(K(q,f))||"",set:(q,f,v)=>localStorage.setItem(K(q,f),v)};
const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;
const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
