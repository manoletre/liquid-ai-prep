<script>
const LESSON = {"id": "l08", "title": "Lesson 8 · Bias–variance → L2 weight decay → L1 & dropout", "h1": "Bias–variance → regularization", "sub": "Lesson 8 · a recall warm-up, then 3 new ideas: reading train vs val curves, deriving L2 as weight decay (the same (1 − 2ηλ) algebra as yesterday's bowl), and a lighter look at L1 sparsity vs dropout. Slow re-teach of what Lesson 4 rushed. Have a pen ready.", "drill": [{"id": "d1", "q": "Interviewer (Guava-flavored): “Train WER 4%, val WER 5%, test WER 19% after a week of tuning. What's wrong?”", "model": "You almost certainly <b>tuned on the test set</b> (or the test speakers/conditions leaked into train/val). Train≈val looks healthy, but test is a different distribution or was peeked at. Fix: lock test until the end; split by speaker/condition; use val for all selection."}, {"id": "d2", "q": "Derive in one line why one L2 step is weight decay: start from L = L_data + λ w².", "model": "dL/dw = g + 2λw → w ← w − η(g + 2λw) = (1 − 2ηλ)w − ηg. The (1 − 2ηλ) factor is weight decay."}, {"id": "d3", "q": "When would you pick L1 over L2 for a voice-AI feature model?", "model": "When you have <b>many mostly-irrelevant features</b> (sparse MFCC/pitch handcrafts, keyword spotting) and want automatic feature selection to exact zeros. Prefer L2/dropout when features are dense and shared (deep encoders)."}, {"id": "d4", "q": "Coding-round flavor: in a numpy GD loop, show one line that applies L2 weight decay with η and λ (decoupled style is fine).", "model": "<pre><code>w *= (1 - 2 * lr * lam)   # decay\nw -= lr * grad_data       # usual step\n# equivalent one-liner: w -= lr * (grad_data + 2 * lam * w)</code></pre>Say out loud: the 2 matches ∂(w²)/∂w; some libraries' \"weight_decay\" in Adam is a closely related but not identical decoupling."}], "key": ["lambda", "w", "eta", "loss", "grad"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: WER > 100%, GRPO equal rewards, (p − y)x, (1 − 2η)", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "wer", "title": "Lesson 3: WER can exceed 100%", "html": "$$\\mathrm{WER}=\\frac{S+D+I}{N_{\\mathrm{ref}}}$$ Reference “yes” (\\(N=1\\)), hypothesis “yes yes okay”: \\(S=0,\\ D=0,\\ I=2\\) → WER = \\(2/1=\\)<b>200%</b>. Insertions count; the denominator is only the reference length, so inventing extra words can push WER past 100%.", "start": 0.0, "end": 7.7}, {"key": "grpo", "title": "Lesson 2: equal rewards → every Aᵢ = 0", "html": "$$A_i=\\frac{r_i-\\mu}{\\sigma}$$ If all 8 rewards equal 1, then \\(\\mu=1\\) and every \\(r_i-\\mu=0\\), so every advantage is 0 and the prompt adds <b>no gradient</b>. Entropy collapse makes rewards tie more often. With \\(\\beta=0\\) there is no KL leash — watch entropy and the share of zero-variance groups.", "start": 7.7, "end": 17.0}, {"key": "pyx", "title": "Lesson 7: one step of (p − y)x", "html": "\\(p=0.8,\\ y=0,\\ x=2\\): $$(p-y)x=(0.8-0)\\cdot 2=1.6$$ With \\(\\eta=0.5\\), \\(w\\leftarrow w-0.8\\). Since \\(p>y\\), the gradient is positive, so we subtract: the score falls and \\(p\\) moves toward 0. Gradient = how wrong the probability is, times the input.", "start": 17.0, "end": 24.6}, {"key": "eta", "title": "Lesson 7: the (1 − 2η) multiplier", "html": "On \\(L=(w-3)^2\\), each step does \\(w-3\\leftarrow(1-2\\eta)(w-3)\\). \\(\\eta=0.25\\) → multiplier 0.5 (halves the gap). \\(\\eta=1.1\\) → multiplier \\(-1.2\\) (flips and grows → diverges). Keep this shape: Chapter 3's weight decay is the same algebra with \\(\\lambda\\) in the middle, \\((1-2\\eta\\lambda)\\).", "start": 24.6, "end": 33.1}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) ref “hey guava” (N = 2), hyp “hey hey guava okay” — S, D, I, and WER? (b) GRPO rewards [0.5, 0.5, 0.5, 0.5] with mean baseline (skip std): each A_i? (c) p = 0.3, y = 1, x = −1: (p − y)x, and which way does p move after w ← w − η·grad? (d) For L = (w − 3)², which η makes the multiplier 0 (land in one step)?", "model": "(a) Alignment: one extra “hey” and one “okay” → S = 0, D = 0, I = 2. WER = 2/2 = <b>100%</b>. (b) μ = 0.5, every r_i − μ = 0 → every A_i = <b>0</b>. (c) (0.3 − 1)·(−1) = <b>0.7</b>. Update subtracts a positive number from w (w falls). Because x is negative, z = w·x rises, so p rises toward 1. (d) 1 − 2η = 0 → <b>η = 0.5</b>."}, "hook": {"id": "h1", "q": "From memory, four quick ones. (a) Reference transcript is the one word “yes”. ASR outputs “yes yes okay”. What is the WER, and can it exceed 100%? (b) GRPO: all 8 answers to a prompt get reward 1. What is each advantage, and what does this prompt add to the update? (c) Logistic regression: p = 0.8, y = 0, x = 2. Compute (p − y)x. (d) On L(w) = (w − 3)², what does the multiplier (1 − 2η) do to the distance to the bottom each step?", "model": "(a) S = 0, D = 0, I = 2, N_ref = 1 → WER = 2/1 = <b>200%</b>. Yes, WER can exceed 100% because insertions count and the denominator is only the reference length. (b) μ = 1, so every r_i − μ = 0 → every A_i = <b>0</b>. The prompt adds <b>no gradient</b>. Entropy collapse makes this happen more often; with β = 0 there's no KL leash, so watch entropy and zero-variance groups. (c) (0.8 − 0)·2 = <b>1.6</b>. Positive gradient → subtract from w → score falls → p falls toward 0. (d) Each step multiplies the gap (w − 3) by (1 − 2η). η = 0.25 → ×0.5 (converges); η = 1.1 → ×(−1.2) (diverges)."}, "duration": 33.1}, {"title": "Bias–variance: underfit, overfit, sweet spot", "short": "Bias–var", "video": "media/ch2-bias-variance.mp4", "poster": "media/ch2-bias-variance-poster.jpg", "steps": [{"key": "setup", "title": "Train vs val WER vs complexity", "html": "Plot <b>training WER</b> and <b>validation WER</b> against model complexity (more parameters, weaker regularization, or simply more epochs). Complexity grows to the right. The validation set is held-out clips the model never trains on — it's the early-warning light.", "start": 0.0, "end": 5.2}, {"key": "curves", "title": "Train falls; val falls then rises", "html": "Train error usually keeps falling as the model gets richer. Val error falls at first (the model is learning the pattern), then <b>rises</b> (it starts memorizing noise in the training set). That rise is overfitting. Looking only at train WER, everything looks fine forever.", "start": 5.2, "end": 10.9}, {"key": "under", "title": "Underfit: both high and close", "html": "On the left of the curve both errors are high and the gap is small: the model is too simple or hasn't trained long enough. Levers: more capacity, train longer, or weaken \\(\\lambda\\). Underfit = <b>high + high</b>, small gap.", "start": 10.9, "end": 17.35}, {"key": "over", "title": "Overfit: train low, val high (the gap)", "html": "On the right, train is low and val is high — the <b>gap</b> is the tell. The model is memorizing. Levers: more data, stronger \\(\\lambda\\), dropout, early stopping. Overfit = train ≪ val.", "start": 17.35, "end": 23.95}, {"key": "sweet", "title": "Sweet spot = lowest validation error", "html": "<b>Worked numbers (made-up ASR WER):</b> epoch 5 → train 0.40 / val 0.42 (still underfit-ish). Epoch 40 → train 0.05 / val 0.55 (overfit). Early stopping would have picked the epoch where <b>val</b> was lowest, somewhere in between. Never pick that epoch (or \\(\\lambda\\), or architecture) on the test set — test is for one final report.", "start": 23.95, "end": 31.6}, {"key": "edge", "title": "Edge cases + your turn", "html": "<b>Edge A:</b> train ≈ val, both high → still underfit (not “roughly right”). <b>Edge B:</b> train ≪ val → overfit. Rule: look at the <b>gap and the level</b>. <details><summary>Check your last step: train 0.12, val 0.14</summary>Both low and close → <b>roughly right</b>. Don't chase train to zero; that usually opens the gap.</details>", "start": 31.6, "end": 39.1}], "check": {"id": "c2", "q": "(a) Epoch 10: train WER 0.35, val 0.36. Epoch 80: train 0.04, val 0.48. What would early stopping have done, and is epoch 80 underfit or overfit? (b) Train 0.30, val 0.31 — underfit, overfit, or roughly right? (c) Why is “pick the model with the best test WER” a bad interview answer?", "model": "(a) Early stopping would keep a checkpoint near the <b>lowest val</b> (somewhere between 10 and 80, not at 80). Epoch 80 is <b>overfit</b> (train ≪ val). (b) Both high and close → <b>underfit</b> (or at least not done learning). (c) Tuning on test <b>leaks</b>: test becomes a second val set, and the reported number is optimistically biased. Use val to pick; touch test once."}, "hook": {"id": "h2", "q": "Your Guava-style ASR model's training WER is 2% and its validation WER is 18%. Underfit, overfit, or roughly right? Name two levers you'd pull, and say whether you'd pick the “best” epoch using the test set.", "model": "<b>Overfit</b>: train is low, val is high — a big gap means the model is memorizing training clips. Levers: more / more-diverse data, stronger regularization (λ, dropout), early stopping at the lowest val WER, or a simpler architecture. <b>Never</b> pick the epoch / λ / architecture on the test set — that turns test into a second validation set and your final number becomes optimistic."}, "duration": 39.1}, {"title": "L2 regularization = weight decay", "short": "L2 / decay", "video": "media/ch3-l2-weight-decay.mp4", "poster": "media/ch3-l2-weight-decay-poster.jpg", "steps": [{"key": "penalty", "title": "Add a tax on large weights", "html": "$$L=L_{\\mathrm{data}}+\\lambda\\sum_j w_j^2$$ \\(L_{\\mathrm{data}}\\) is the usual loss (MSE, cross-entropy, …). \\(\\lambda\\sum w_j^2\\) is a tax on large weights: \\(\\lambda=0\\) is plain training; bigger \\(\\lambda\\) shrinks harder. The model is pushed to prefer many small weights over a few huge ones.", "start": 0.0, "end": 7.4}, {"key": "derive", "title": "Derive the (1 − 2ηλ) multiplier", "html": "One weight, data-gradient \\(g=\\partial L_{\\mathrm{data}}/\\partial w\\): $$\\frac{dL}{dw}=g+2\\lambda w$$ $$w\\leftarrow w-\\eta(g+2\\lambda w)=(1-2\\eta\\lambda)\\,w-\\eta g$$ First multiply \\(w\\) by \\((1-2\\eta\\lambda)\\) (decay), then take the usual data step \\(-\\eta g\\). The 2 comes from \\(\\frac{d}{dw}(w^2)=2w\\) — the same 2 as in yesterday's \\((1-2\\eta)\\) on \\((w-3)^2\\).", "start": 7.4, "end": 15.9}, {"key": "bayes", "title": "Bayesian view: Gaussian prior", "html": "A Gaussian prior \\(p(w)\\propto e^{-w^2/(2\\sigma^2)}\\) has \\(-\\log\\) prior \\(\\propto w^2\\). Maximum a posteriori (MAP) = minimize NLL \\(+\\) \\(\\lambda\\sum w^2\\). So <b>L2 = −log of a Gaussian prior</b> on the weights. (Laplace prior → L1 — next chapter.)", "start": 15.9, "end": 23.6}, {"key": "ex1", "title": "Worked example 1: λ = 0.5", "html": "\\(w=4,\\ g=1,\\ \\eta=0.1,\\ \\lambda=0.5\\). Multiplier \\(1-2\\cdot0.1\\cdot0.5=0.9\\). Decay: \\(0.9\\cdot4=3.6\\). Data step: \\(-0.1\\). New \\(w=3.5\\). Without L2: \\(w=4-0.1=3.9\\). L2 pulls toward zero on every step — even if \\(g=0\\).", "start": 23.6, "end": 31.233}, {"key": "ex2", "title": "Worked example 2 (edge): λ = 0 vs large λ", "html": "Same \\(w=4,\\ g=1,\\ \\eta=0.1\\). \\(\\lambda=0\\) → multiplier 1.0 → \\(w=3.9\\) (no shrink, can overfit). \\(\\lambda=0.5\\) → \\(w=3.5\\). \\(\\lambda=5\\) → multiplier \\(1-1=0\\) → \\(w=0-0.1=-0.1\\) (weights crushed every step → underfit). \\(\\lambda\\) is a dial between memorizing and underfitting.", "start": 31.233, "end": 38.867}, {"key": "faded", "title": "Bridge to Lesson 7 + your turn", "html": "Bowl \\(L=(w-3)^2\\) → gap \\(\\times(1-2\\eta)\\). L2 term \\(\\lambda w^2\\) → weight \\(\\times(1-2\\eta\\lambda)\\). Same algebra; the 2 is from \\(\\frac{d}{dw}(w^2)=2w\\). <details><summary>Check your last step: w = 2, g = 0, η = 0.2, λ = 1</summary>Multiplier \\(1-2\\cdot0.2\\cdot1=0.6\\). Pure decay: \\(w\\leftarrow0.6\\cdot2=\\)<b>1.2</b>.</details>", "start": 38.867, "end": 46.667}], "check": {"id": "c3", "q": "(a) w = 5, g = 2, η = 0.1, λ = 1. Compute the new w with L2. (b) Same numbers with λ = 0. (c) If g = 0 and λ > 0, what happens to w over many steps? (d) In one sentence, why is weight decay the same algebra as yesterday's (1 − 2η) on the bowl?", "model": "(a) Multiplier 1 − 2·0.1·1 = 0.8. New w = 0.8·5 − 0.1·2 = 4 − 0.2 = <b>3.8</b>. (b) w = 5 − 0.1·2 = <b>4.8</b>. (c) w ← (1 − 2ηλ)w each step, so |w| <b>shrinks geometrically toward 0</b>. (d) Both come from a quadratic penalty whose derivative is 2·(something)·w, so the update factors as (1 − 2η·something)·w."}, "hook": {"id": "h3", "q": "People say “L2 regularization” and “weight decay” as if they were the same thing. Starting from L = L_data + λ Σ w_j², derive what one gradient step does to a single weight w. Does a factor appear that multiplies w itself?", "model": "Yes. dL/dw = g + 2λw, where g = ∂L_data/∂w. One step: w ← w − η(g + 2λw) = <b>(1 − 2ηλ) w − η g</b>. The factor (1 − 2ηλ) multiplies the current weight before the usual data step — that's weight decay. Same algebra as yesterday's (1 − 2η) on the bowl, with λ in the middle."}, "duration": 46.667}, {"title": "L1 vs L2, and a quick look at dropout", "short": "L1 / dropout", "video": "media/ch4-l1-dropout.mp4", "poster": "media/ch4-l1-dropout-poster.jpg", "steps": [{"key": "l1", "title": "L1: tax on |w|, not w²", "html": "$$L_{\\mathrm{L1}}=L_{\\mathrm{data}}+\\lambda\\sum_j|w_j|$$ The gradient of \\(|w|\\) is \\(\\mathrm{sign}(w)\\): a constant push toward 0. Once a weight hits 0 it can stay there. Prior view: <b>Laplace</b> prior → \\(-\\log\\) prior \\(\\propto|w|\\). L1 prefers exact zeros — feature selection for free.", "start": 0.0, "end": 8.0}, {"key": "geom", "title": "Geometry: diamond vs ball", "html": "L2's feasible set is a <b>ball</b>; L1's is a <b>diamond</b>. Loss contours sliding in hit a diamond at a corner → some \\(w_i=0\\) (sparse). They hit a ball on a face → shrink, rarely exact zero. Geometry is why people say “L1 selects, L2 shrinks.”", "start": 8.0, "end": 14.8}, {"key": "drop", "title": "Dropout: noise on the network", "html": "Each training step randomly zeroes units (often p ≈ 0.5 for hidden layers). That forces redundancy — no single unit can be essential. At test time, scale by the keep-probability (or use inverted dropout, which scales during training). Roughly: training a bag of thinned networks.", "start": 14.8, "end": 22.8}, {"key": "guava", "title": "Two worked comparisons", "html": "<b>Worked 1:</b> keyword spotter, 20 pitch/MFCC features, only ~4 matter → prefer <b>L1</b>, drive the other 16 to exact 0. <b>Worked 2:</b> deep ASR encoder where units share work → <b>L2 or dropout</b>: shrink / force redundancy, keep all. <b>Edge:</b> L2 almost never hits exact 0; L1 often does.", "start": 22.8, "end": 30.433}, {"key": "faded", "title": "Your turn + quick map", "html": "Quick map: L2 → shrink, Gaussian prior, weight decay \\((1-2\\eta\\lambda)\\). L1 → zeros, Laplace prior, feature selection. Dropout → random zero units in training. <details><summary>Check your last step: 50 handcrafted wake-word features, only a handful predictive</summary>Start with <b>L1</b> — you want exact zeros on the useless features. (You can combine L1+L2 = elastic net later.)</details>", "start": 30.433, "end": 37.833}], "check": {"id": "c4", "q": "(a) Name one geometric reason L1 zeros weights and L2 usually doesn't. (b) Your deep ASR encoder overfits (train WER 3%, val 14%). You already use mild L2. Name two other levers. (c) A teammate says “dropout at test time randomly drops units too.” Fix the misconception.", "model": "(a) L1's diamond has <b>corners</b> on the axes; contours hit a corner → some w_i = 0. L2's ball has no corners on the axes, so the touch point usually has all coordinates nonzero. (b) <b>Dropout</b>, more/varied data, early stopping, stronger λ, simpler architecture, data aug (speed/noise/reverb for ASR). (c) Dropout is <b>training-only</b> noise. At test you use the full network, with weights scaled by the keep-prob (or inverted dropout already scaled during training) — no randomness at test."}, "hook": {"id": "h4", "q": "L2 and L1 both add a penalty on weights. Which one tends to drive some weights to exactly zero, and what's the geometric reason? For a Guava keyword spotter on sparse MFCC/pitch features where you suspect only a few matter, which would you try first?", "model": "<b>L1</b>. The L1 constraint is a diamond; loss contours tend to hit a <b>corner</b>, where some coordinates are exactly 0 (sparse). The L2 constraint is a ball; they usually touch a face, so weights shrink but rarely hit exact zero. For sparse handcrafted features, start with <b>L1</b> (feature selection). Dense shared features in a deep encoder → L2 or dropout."}, "duration": 37.833}], "summary": ["Underfit: train and val both high and close. Overfit: train low, val high (the gap). Sweet spot = lowest validation error; never pick on test.", "L2: L = L_data + λ Σ w². One step: w ← (1 − 2ηλ)w − ηg. Same algebra as yesterday's (1 − 2η) on the bowl. Gaussian prior.", "L1: λ Σ |w| → diamond → exact zeros (Laplace prior, feature selection). L2 ball → shrink, rarely zero.", "Dropout: randomly zero units in training; scale at test (or inverted dropout). Forces redundancy."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;
const store={get:(q,f)=>localStorage.getItem(K(q,f))||"",set:(q,f,v)=>localStorage.setItem(K(q,f),v)};
const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;
const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
