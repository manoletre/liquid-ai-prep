<script>
const LESSON = {"id": "l10", "title": "Lesson 10 · Train/val/test, cross-validation and data leakage", "h1": "Train/val/test, cross-validation and data leakage", "sub": "Lesson 10 · a recall warm-up, then 3 new ideas, one per chapter: why you need three separate splits (and what goes wrong if you choose on the test set), k-fold cross-validation for small data, and data leakage, the way an honest held-out score quietly stops being honest. This is the last piece of Lesson 4, taught slowly. Have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up: write k-fold cross-validation in plain numpy (no sklearn). You're given X (N, d), y (N,), and functions fit(X, y) → model and score(model, X, y) → float. Return the mean and std of the k fold scores.", "model": "<pre><code>def kfold_cv(X, y, fit, score, k=5, seed=0):\n    rng = np.random.default_rng(seed)\n    idx = rng.permutation(len(X))       # shuffle once\n    folds = np.array_split(idx, k)      # k nearly equal folds\n    scores = []\n    for i in range(k):\n        val = folds[i]\n        tr = np.concatenate([folds[j] for j in range(k) if j != i])\n        model = fit(X[tr], y[tr])       # fit (and preprocess) on train part only\n        scores.append(score(model, X[val], y[val]))\n    return np.mean(scores), np.std(scores)</code></pre>Say out loud: shuffle first (unless it's time-ordered data), <code>array_split</code> handles N not divisible by k, any scaler is fit inside <code>fit</code> on the training part, and the test set never enters this function."}, {"id": "d2", "q": "You standardize features with a StandardScaler. Where exactly does it go when you run 5-fold cross-validation, and why?", "model": "<b>Inside each fold</b>: fit the scaler on that fold's training part, then transform both the training part and the held-out fold. Fitting it once on all the data leaks the held-out fold's mean and std into training (Chapter 4, example 1). In sklearn, put it in a <code>Pipeline([('scale', StandardScaler()), ('clf', LogisticRegression())])</code> and pass the pipeline to <code>cross_val_score</code>; the pipeline refits the scaler in every fold."}, {"id": "d3", "q": "When is a plain random split the wrong choice? Name three cases and the split you'd use instead.", "model": "(1) <b>Grouped data</b> (several clips per speaker, scans per patient, messages per user): split by group (<code>GroupKFold</code>). (2) <b>Time series or anything you'll deploy forward in time</b>: split by time, train on the past and test on the future (<code>TimeSeriesSplit</code>). (3) <b>Rare classes</b>: stratify so each fold keeps the class ratio (<code>StratifiedKFold</code>). Bonus: <b>duplicates or near-duplicates</b> (common in scraped text and LLM prompts): deduplicate before splitting."}, {"id": "d4", "q": "Your first model gets 99% validation accuracy. What do you check before celebrating?", "model": "(1) The <b>accuracy trap</b> (Lesson 3): what's the class balance? If 99% of examples are negative, always predicting negative gets 99%. Look at precision, recall and AUROC. (2) <b>Leakage</b>: duplicates across splits, same-group examples in train and val, preprocessing fit on all the data, and features that encode the label (sort features by importance and ask whether each could be known at prediction time). (3) The <b>split itself</b>: was it random when it should have been by time or by group? (4) A sanity baseline: a trivial model, or a model trained on shuffled labels, which should drop to chance."}, {"id": "d5", "q": "Post-training angle: how would you build an evaluation set for a GRPO fine-tune so that the score you report is honest?", "model": "Split the prompt pool into <b>train / dev / test before</b> generating any augmentations or paraphrases, ideally by source or template (a group split) so near-identical prompts don't straddle the split. <b>Deduplicate</b> across splits with n-gram or embedding similarity, and check public benchmarks for contamination against the training data. Tune the learning rate, β and the number of steps on <b>dev</b>, then run <b>test once</b> and report it, ideally with a confidence interval, because a few hundred prompts give a noisy score (Chapter 2's ±5 points on 100 examples)."}], "key": ["trn", "val", "tst", "kf", "leak", "w", "delta", "rho"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "trn": ["train set", "Data gradient descent fits on. Its score can't tell memorizing from learning."], "val": ["validation (dev) set", "Held-out data for every choice: λ, learning rate, epochs, which model."], "tst": ["test set", "Held-out data measured once at the very end. The number you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: backprop, PPO clip for A < 0, AUROC with a tie, overfitting", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "bp", "title": "Lesson 9: backprop on the tiny net", "html": "Forward and save: \\(z=2,\\ h=2,\\ \\hat y=6,\\ L=\\tfrac12(6-4)^2=2\\). Start at the end: \\(\\delta_{\\hat y}=\\hat y-y=2\\), so \\(\\frac{\\partial L}{\\partial w_2}=\\delta_{\\hat y}\\,h=4\\). Walk back: \\(\\delta_h=\\delta_{\\hat y}w_2=6\\), \\(\\delta_z=6\\cdot1=6\\) (ReLU on), so \\(\\frac{\\partial L}{\\partial w_1}=\\delta_z\\,x=12\\). Edge case: \\(w_1=-1\\) makes \\(z=-2\\) and \\(h=0\\), so both gradients are 0, a dead ReLU.", "start": 0.0, "end": 9.433}, {"key": "clip", "title": "Lesson 1: PPO clip on the A < 0 side", "html": "With \\(A=-1\\), \\(\\min(\\rho A,\\ \\mathrm{clip}(\\rho,0.8,1.2)A)\\). \\(\\rho=0.9\\) is inside the range: both terms are \\(-0.9\\), <b>not clipped</b>, and the response is still pushed down. \\(\\rho=0.7\\): \\(\\rho A=-0.7\\) and \\(0.8\\cdot(-1)=-0.8\\). The min is the clipped, flat term, so the <b>gradient is 0</b>: it has already been made rare enough for this batch.", "start": 9.433, "end": 18.4}, {"key": "auroc", "title": "Lesson 3: AUROC with a tie", "html": "List every positive × negative pair: \\(2\\times3=6\\). 0.7 beats 0.4, 0.3 and 0.1 → 3. 0.4 vs 0.4 is a tie → ½, and 0.4 beats 0.3 and 0.1 → 2. AUROC \\(=(3+2.5)/6=5.5/6\\approx\\)<b>0.92</b>, the chance that a random positive outscores a random negative, with ties split.", "start": 18.4, "end": 26.067}, {"key": "bv", "title": "Lesson 8: overfitting, and the bridge to today", "html": "Train loss low, a big gap to validation: <b>overfitting</b> (high variance). Fixes: more data, stronger L2 or dropout, early stopping. But notice that you could only <i>see</i> the gap because the validation set was data the model never trained on. Today is about keeping held-out data honest.", "start": 26.067, "end": 34.133}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) Tiny net with x = 1, w₁ = 2, w₂ = −1, y = 1: compute L, ∂L/∂w₂ and ∂L/∂w₁. (b) PPO, ε = 0.2, A = −1, ρ = 0.75: clipped or not? (c) AUROC with positives {0.8, 0.3} and negatives {0.6, 0.3}. (d) Train error 30%, validation error 31%. Would more dropout help?", "model": "(a) z = 2, h = 2, ŷ = −2, L = ½(−3)² = <b>4.5</b>. δŷ = −3. ∂L/∂w₂ = δŷ·h = <b>−6</b>. δh = δŷ·w₂ = 3, δz = 3 (ReLU on), ∂L/∂w₁ = 3·1 = <b>3</b>. (b) ρA = −0.75 and clip(0.75)·A = −0.8. The min is −0.8, the clipped term: <b>clipped, gradient 0</b>. (c) 4 pairs: 0.8 vs 0.6 → 1, 0.8 vs 0.3 → 1, 0.3 vs 0.6 → 0, 0.3 vs 0.3 → ½. AUROC = 2.5/4 = <b>0.625</b>. (d) Both high, tiny gap: <b>underfitting</b>. More dropout is more regularization and makes it worse; add capacity or train longer."}, "hook": {"id": "h1", "q": "From memory, four quick ones. (a) Lesson 9's tiny net: z = w₁x, h = ReLU(z), ŷ = w₂h, L = ½(ŷ − y)². With x = 2, w₁ = 1, w₂ = 3, y = 4, compute ∂L/∂w₂ and ∂L/∂w₁. What happens to both if w₁ = −1? (b) PPO with ε = 0.2 and a bad response, A = −1: is ρ = 0.9 clipped? Is ρ = 0.7? (c) AUROC with positives {0.7, 0.4} and negatives {0.4, 0.3, 0.1}. (d) Train loss 0.05, validation loss 0.40. What's the diagnosis, and name two fixes.", "model": "(a) Forward: z = 2, h = 2, ŷ = 6, L = 2. δŷ = 6 − 4 = 2, so ∂L/∂w₂ = δŷ·h = <b>4</b>. δh = δŷ·w₂ = 6, δz = 6 (ReLU on), so ∂L/∂w₁ = δz·x = <b>12</b>. With w₁ = −1: z = −2, h = 0, so <b>both gradients are 0</b> (dead ReLU). (b) ρ = 0.9: min(−0.9, −0.9), <b>not clipped</b>, still pushed down. ρ = 0.7: min(−0.7, 0.8·(−1) = −0.8) = −0.8, the clipped term, which is flat: <b>clipped, gradient 0</b>. (c) 6 pairs: 0.7 beats all three (3), 0.4 ties 0.4 (½) and beats 0.3 and 0.1 (2), so (3 + 2.5)/6 ≈ <b>0.92</b>. (d) Low train, big gap: <b>overfitting</b> (high variance). Fixes: more data, stronger L2 or dropout, early stopping."}, "duration": 34.133}, {"title": "Train, validation, test: three jobs, three sets", "short": "Splits", "video": "media/ch2-three-splits.mp4", "poster": "media/ch2-three-splits-poster.jpg", "steps": [{"key": "why", "title": "Why the training score can't be trusted", "html": "A student who memorized last year's practice exam scores 100% on it and 55% on a new exam. A model can do the same: a big enough model can drive its <b>training</b> error to 0 by memorizing. So the training score can't tell memorizing from learning. Only data the model never saw measures <b>generalization</b>, how it does on new inputs.", "start": 0.0, "end": 8.2}, {"key": "jobs", "title": "Three sets, three jobs", "html": "Split the data once, at the start (often 80 / 10 / 10). <b>Train</b>: the only data gradient descent sees. <b>Validation</b> (or dev): every <i>choice</i> you make, such as λ, the learning rate, the number of epochs (early stopping) or which model. <b>Test</b>: measured <b>once</b> at the very end, and that's the number you report. Validation is for deciding; test is for reporting.", "start": 8.2, "end": 16.2}, {"key": "ex1", "title": "Worked example 1: choose λ on validation, report test", "html": "Made-up error rates. λ = 0: train 2%, val 15% (overfits). λ = 0.1: train 6%, val 9%. λ = 1: train 14%, val 16% (underfits). Lowest validation error → choose <b>λ = 0.1</b>. Then run the test set once: 10%. Report <b>10%</b>, not 9%. The 9% is a little flattering because you picked the best of three on the validation set, which is exactly why the test set has to be separate.", "start": 16.2, "end": 25.2}, {"key": "ex2", "title": "Worked example 2 (edge case): choosing on the test set", "html": "20 useless models that guess at random, each scored on the same 100 test examples. Each one's accuracy is about 50%, give or take \\(\\sqrt{0.5\\cdot0.5/100}=0.05\\), so 5 points. By luck alone, the best of the 20 lands near <b>59%</b>, almost 2 standard deviations up. On fresh data it's 50%. If you pick the winner <i>on the test set</i>, its test score is no longer an honest estimate. Every look at the test set that changes a decision leaks a little of it into your choices.", "start": 25.2, "end": 35.5}, {"key": "faded", "title": "Your turn: which number do you report?", "html": "Made-up numbers: model A has val 88% and test 85%; model B has val 90% and test 83%. Step 1, choose by validation: <b>model B</b>. <details><summary>Check your last step: what do you report?</summary>Report <b>model B's test score, 83%</b>. Switching to A after seeing that its test score is higher means choosing on the test set, the same mistake as example 2. If you really doubt B, collect a new test set.</details>", "start": 35.5, "end": 42.6}], "check": {"id": "c2", "q": "A teammate tries 5 learning rates for a GRPO run, checks each one's accuracy on the GSM8K test set, and reports the best: 71%. (a) What's the problem? (b) How would you redo it? (c) Your lab has run hundreds of experiments over a year, always looking at the same test set. What happens to that test set, and what can you do?", "model": "(a) The test set was used to <b>choose</b> the learning rate, so 71% is the best of 5 on that data: <b>optimistically biased</b>, and not a clean estimate of new-question accuracy. (b) Hold out a <b>dev split</b> (for example, some of the training questions) to pick the learning rate, then evaluate the chosen run on the test set <b>once</b> and report that. (c) The test set slowly <b>turns into a validation set</b>: hundreds of decisions each leaked a little. Keep a fresh, rarely touched test set (or a private holdout) for final claims, and treat old benchmark numbers with some suspicion."}, "hook": {"id": "h2", "q": "You train three models with different regularization strengths λ, check each one on your test set, keep the best, and report its test accuracy. (a) What's wrong with that number? (b) What should you do instead? (c) If you'd tried 50 settings instead of 3, would the problem get bigger or smaller?", "model": "(a) You used the test set to <b>choose</b>, so the reported score is the best of 3 on that same data. Part of it is luck on those particular examples, which makes it <b>optimistic</b>. The test set has quietly become a validation set. (b) Hold out a separate <b>validation</b> set (or use cross-validation) to pick λ, then run the <b>test</b> set once at the end and report that. (c) <b>Bigger.</b> The more options you pick among, the more the winner's score reflects luck. In the chapter's example, the best of 20 coin-flip models scores about 59% on a 100-example test set."}, "duration": 42.6}, {"title": "k-fold cross-validation", "short": "k-fold CV", "video": "media/ch3-k-fold-cv.mp4", "poster": "media/ch3-k-fold-cv-poster.jpg", "steps": [{"key": "why", "title": "Why one small validation split isn't enough", "html": "With 50 clips, a 10-clip validation set is a noisy measurement: 8 of 10 is 80%, and one clip flips it to 70% or 90%. Meanwhile a fifth of your scarce data never gets trained on. We want a validation score that uses every example, yet never grades a model on data it trained on.", "start": 0.0, "end": 6.9}, {"key": "how", "title": "How k-fold works", "html": "Split the training data into \\(k\\) equal <b>folds</b> (here \\(k=5\\)). Run \\(k\\) trainings: in run \\(i\\), train on the other \\(k-1\\) folds and validate on fold \\(i\\). Every example is validated exactly once, by a model that never saw it. The CV score is the <b>average</b> of the \\(k\\) validation scores. The test set stays out of all of this.", "start": 6.9, "end": 14.9}, {"key": "ex1", "title": "Worked example 1: average the folds", "html": "100 examples, 5 folds of 20. The five validation accuracies are 80, 85, 75, 90, 80. $$\\text{CV score}=\\frac{80+85+75+90+80}{5}=\\frac{410}{5}=82\\%$$ The spread, 75% to 90%, is useful too: that's how much a single 20-example split could have misled you. When comparing two settings, a difference smaller than this spread is mostly noise.", "start": 14.9, "end": 22.6}, {"key": "ex2", "title": "Worked example 2 (edge case): rare positives", "html": "100 clips with only 10 positives, 5 folds. A random split can deal out 4, 3, 3, 0 and 0 positives, and a fold with no positives gives recall \\(=0/0\\), undefined. <b>Stratified k-fold</b> deals each class out evenly: \\(10\\div5=2\\) positives and \\(90\\div5=18\\) negatives per fold, so every fold keeps the 10% positive rate.", "start": 22.6, "end": 30.433}, {"key": "cost", "title": "What it costs, and what comes after", "html": "k-fold costs <b>k trainings per setting</b>. Trying 4 values of λ with 5 folds is \\(4\\times5=20\\) trainings, plus 1 final retrain of the winner on <b>all</b> the training data, so 21. Then the untouched test set, once. CV replaces the validation split, never the test set. \\(k=N\\) is leave-one-out. For big models (LLM fine-tuning) one run is already expensive, so people use a single fixed dev set instead.", "start": 30.433, "end": 38.533}, {"key": "faded", "title": "Your turn: a 4-fold average", "html": "Four folds score 70, 74, 78 and 74. <details><summary>Check your last step: the CV score</summary>\\((70+74+78+74)/4=296/4=\\)<b>74%</b>, with a spread of 70–78%.</details>", "start": 38.533, "end": 44.633}], "check": {"id": "c3", "q": "(a) 5-fold scores are 60, 70, 65, 75, 80. Give the CV score and the spread. A second setting scores 71% on average. Is it clearly better? (b) You try 3 learning rates with 5-fold CV and then retrain the winner. How many trainings is that in total? (c) 50 examples, 5 of them positive, 5 folds. What does stratification give each fold, and why does it matter?", "model": "(a) (60 + 70 + 65 + 75 + 80)/5 = 350/5 = <b>70%</b>, spread 60–80%. 71% vs 70% is <b>well inside the spread</b>, so it's not clearly better; it's noise. (b) 3 × 5 = 15, plus 1 final retrain = <b>16</b>. (c) <b>1 positive and 9 negatives per fold</b>. A random split could leave a fold with 0 positives, where recall is 0/0, and the fold scores would swing wildly."}, "hook": {"id": "h3", "q": "You only have 50 labelled clips. If you hold out 10 for validation and a model gets 8 of them right (80%), how much would you trust that 80%? Can you think of a way to use all 50 clips for validation, without ever grading a model on clips it trained on?", "model": "Not much. With 10 clips, <b>one clip moves the score by 10 points</b> (70% or 90%), and only 40 clips are left for training. The fix is <b>k-fold cross-validation</b>: split the 50 into k = 5 folds of 10. Train 5 times, each time on 4 folds, and validate on the fold left out. Every clip is validated exactly once by a model that didn't train on it. Average the 5 scores, and look at their spread."}, "duration": 44.633}, {"title": "Data leakage: when test information sneaks into training", "short": "Leakage", "video": "media/ch4-data-leakage.mp4", "poster": "media/ch4-data-leakage-poster.jpg", "steps": [{"key": "def", "title": "What leakage is", "html": "<b>Leakage</b> is any information the model couldn't have at prediction time that reaches training: from the validation or test data, from the future, or from the label itself. The held-out score looks great, then collapses in production. The question to ask about every feature and every preprocessing step: <i>could the model know this at the moment it predicts?</i>", "start": 0.0, "end": 8.7}, {"key": "ex1", "title": "Worked example 1: a scaler fit on everything", "html": "Standardizing a feature means \\(z=(x-\\mu)/\\sigma\\). Train values 2, 4, 6; test value 12. <b>Right:</b> use train only. \\(\\mu=(2+4+6)/3=4\\) and \\(\\sigma=\\sqrt{(4+0+4)/3}=\\sqrt{8/3}\\approx1.63\\), so the test point gets \\(z=(12-4)/1.63\\approx4.9\\). <b>Leaky:</b> \\(\\mu=(2+4+6+12)/4=6\\). The test point moved the statistics the model trains with. The rule: fit every preprocessing step (scaling, vocabulary, imputation, feature selection) on the training data, then apply it to val and test. In CV, refit it inside each fold, which is what an sklearn <code>Pipeline</code> does for you.", "start": 8.7, "end": 17.4}, {"key": "ex2", "title": "Worked example 2 (edge case): group leakage", "html": "Made-up numbers. 5,000 clips from 50 speakers. A random split puts clips from speaker A in both train and test, so the model can partly memorize each voice: WER 6%. Split <b>by speaker</b>, so the test set has only new voices, and WER is 15%, which is what new callers will actually get. The same goes for patients, users, documents and near-duplicate prompts: if examples come in groups, split by group (<code>GroupKFold</code>).", "start": 17.4, "end": 25.9}, {"key": "kinds", "title": "Three more kinds to recognize", "html": "<b>Time:</b> shuffling a time series lets the model peek at the future, so train on earlier dates and test on later ones. <b>Target leakage:</b> a feature that exists because of the label, such as <code>refund_issued</code> when predicting fraud; drop it. <b>LLM contamination:</b> benchmark questions (say GSM8K) that ended up in the pre-training or fine-tuning data. Deduplicate by n-gram overlap or near-duplicate search, and split your GRPO prompts into train and eval <i>before</i> any augmentation.", "start": 25.9, "end": 34.6}, {"key": "faded", "title": "Your turn: spot the leak", "html": "1,000 features of pure random noise, 100 examples. Step 1: keep the 20 features most correlated with the label, computed on all 100 examples. Step 2: 5-fold CV gives 85% accuracy, on noise. <details><summary>Check your last step: where's the leak?</summary>Step 1 <b>saw the labels of the validation folds</b>. Among 1,000 noise features, some correlate with the label by chance, and selection picked exactly those, using the very examples CV later grades. Do the selection <b>inside each fold</b>, on that fold's training part only, and the CV score drops to about 50%.</details>", "start": 34.6, "end": 41.9}], "check": {"id": "c4", "q": "(a) Train values 1, 3, 5 and a test value of 9. Standardize the test value the right way. What mean would the leaky way use? (b) For each case, name the kind of leak and the fix: (i) X-rays from the same patient end up in train and test; (ii) you predict next week's sales with a randomly shuffled split; (iii) a churn model uses the feature 'support calls after cancelling'. (c) For your own GRPO runs: how would you make sure the eval prompts don't leak into training?", "model": "(a) μ = 3 and σ = √((4 + 0 + 4)/3) ≈ 1.63, so z = (9 − 3)/1.63 ≈ <b>3.7</b>. The leaky way uses μ = (1 + 3 + 5 + 9)/4 = <b>4.5</b>. (b) (i) <b>Group leakage</b>: split by patient. (ii) <b>Time leakage</b>: train on earlier weeks, test on later ones. (iii) <b>Target leakage</b>: that feature only exists after the outcome, so drop it. (c) Split the prompts into train and eval <b>before</b> anything else (augmentation, paraphrasing), deduplicate near-duplicates across the split (n-gram or embedding similarity), check that public benchmarks you report aren't in the training set, and choose hyperparameters on a dev split, not on the final eval."}, "hook": {"id": "h4", "q": "You train a model to detect a frustrated caller from 5,000 call clips recorded from 200 callers. A random 80/20 split gives 95% accuracy, but in production it's 70%. Give two different reasons the held-out score could have been too good.", "model": "Some good answers. (1) <b>Group leakage</b>: the random split put clips from the same callers in both train and test, so the model learned to recognize those voices rather than frustration. Split <b>by caller</b>. (2) <b>Preprocessing leakage</b>: normalization statistics, a vocabulary or a feature selection were computed on all the data, test included. Fit them on train only. (3) <b>Target leakage</b>: a feature that only exists because of the label, such as whether the call was escalated. (4) <b>Time</b>: the production calls come later, and the test set didn't. Split by date. (A distribution shift in production is also possible, but that isn't leakage.)"}, "duration": 41.9}], "summary": ["Three splits, three jobs: train fits the weights, validation makes every choice (λ, learning rate, epochs, which model), and test is run once at the end and reported. The training score can't tell memorizing from learning.", "Choosing on the test set makes its score optimistic, because the winner partly won by luck. The best of 20 coin-flip models scores about 59% on 100 examples, and the more options you try, the bigger the bias.", "k-fold CV: k folds, k trainings, each validated on the fold it didn't see; report the mean and look at the spread. Stratify for rare classes. Cost is k trainings per setting plus one final retrain, and the test set stays untouched.", "Leakage = information the model couldn't have at prediction time: preprocessing fit on all the data, group overlap (same speaker in train and test), shuffled time series, label-derived features, and benchmark contamination. Fit preprocessing inside each fold, and split by group or time when the data calls for it."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;
const store={get:(q,f)=>localStorage.getItem(K(q,f))||"",set:(q,f,v)=>localStorage.setItem(K(q,f),v)};
const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;
const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
