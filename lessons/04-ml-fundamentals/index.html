<style>
/* Lesson player v4: one full-screen chapter at a time. Flow per chapter: question → learn (video steps) → compare → practice. */
:root{--bg:#0e1117;--card:#151a23;--card2:#1b212d;--fg:#e6e6e6;--muted:#8b93a7;--line:#262d3a;--top:52px;--foot:62px;
--pi:#b392f0;--old:#e08fd0;--y:#7aa2f7;--x:#5fc9b6;--R:#9ece6a;--b:#c3e88d;--rho:#ff9e64;--eps:#f7768e;--al:#e0af68;--st:#a9b1d6;--good:#9ece6a;--bad:#f7768e;--ent:#7dcfff}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}
button{font:inherit;font-size:14px;border:1px solid #33405a;background:var(--card2);color:var(--fg);padding:6px 13px;border-radius:8px;cursor:pointer}
button:hover{border-color:#5a6b90}button.on,button.primary{background:#3b3360;border-color:#5b4f93}button:disabled{opacity:.45;cursor:default}
kbd{background:var(--card2);border:1px solid #33405a;border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12.5px;color:var(--fg)}
code{background:var(--card2);padding:1px 6px;border-radius:5px;font-size:.88em}
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
/* top bar */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;background:rgba(14,17,23,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;gap:12px;height:100%}
#top .back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}#top .back:hover{color:var(--fg)}
#top .ttl{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#pills{display:flex;gap:5px;margin-left:auto;flex-wrap:nowrap}
.pill{min-width:28px;height:26px;padding:0 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12.5px;display:grid;place-items:center;cursor:pointer;white-space:nowrap}
.pill.on{border-color:var(--al);color:var(--fg);background:#2a2516}.pill.done{color:var(--good);border-color:#355a2b}
.speed{display:flex;gap:3px;align-items:center;font-size:12.5px;color:var(--muted)}.speed button{padding:1px 7px;font-size:12px}
#bar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--al);width:0;transition:width .3s}
/* footer */
#foot{position:fixed;bottom:0;left:0;right:0;height:var(--foot);z-index:30;background:rgba(14,17,23,.96);border-top:1px solid var(--line)}
#foot .wrap{display:flex;align-items:center;gap:12px;height:100%}
#phases{display:flex;gap:6px;margin:0 auto;font-size:13px;color:var(--muted);align-items:center}
#phases span{padding:2px 10px;border-radius:999px;border:1px solid transparent}#phases span.on{color:var(--fg);border-color:#5b4f93;background:#231f3a}#phases span.done{color:var(--good)}
#fwd{min-width:150px}
/* screens */
main.wrap{padding-top:calc(var(--top) + 18px);padding-bottom:calc(var(--foot) + 18px)}
.screen{display:none;min-height:calc(100vh - var(--top) - var(--foot) - 36px)}.screen.on{display:block}
.phase{display:none}.phase.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px}
.narrow{max-width:860px;margin:3vh auto 0}.roomy{max-width:1120px;margin:0 auto}
.eyebrow{color:var(--muted);font-size:13.5px;text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
h1{font-size:30px;margin:4px 0 6px;letter-spacing:-.02em}h2{font-size:24px;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:19px;margin:0 0 10px}
.lbl{color:var(--al);font-weight:700}
.qtext{font-size:18.5px;line-height:1.6;margin:0 0 14px}
textarea{width:100%;min-height:150px;resize:vertical;background:#0f131b;color:var(--fg);border:1px solid #33405a;border-radius:10px;padding:12px 14px;font:inherit;font-size:15.5px;line-height:1.55}
textarea:focus{outline:none;border-color:#6a5cb0}textarea.note{min-height:80px}
.row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}.saved{font-size:12.5px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:1px 10px;cursor:help}
/* learn */
.lhead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}.lhead h2{margin:0}
.myq{font-size:14px;color:var(--muted);margin:0 0 12px;max-width:100%;overflow-wrap:anywhere}.myq b{color:var(--fg);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:22px;align-items:start}
video{width:100%;display:block;border-radius:12px;border:1px solid var(--line);background:#000;cursor:pointer;aspect-ratio:16/9;max-height:calc(100vh - 290px);object-fit:contain}
.vbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.vbar .status{font-size:13.5px;color:var(--muted);margin-left:auto}
.segbar{height:4px;background:#232a37;border-radius:3px;margin-top:8px;overflow:hidden}.segbar i{display:block;height:100%;width:0;background:var(--al)}
ol.steps{list-style:none;margin:0;padding:0;max-height:calc(100vh - 210px);overflow:auto;position:relative}
ol.steps li{border:1px solid var(--line);background:var(--card);border-radius:12px;margin:0 0 9px;cursor:pointer;transition:border-color .2s,background .2s}
ol.steps li:hover{border-color:#3a4560}ol.steps li.active{border-color:var(--al);background:#1a1f2b}
.sh{display:flex;gap:10px;align-items:center;padding:9px 14px}
.sh .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-weight:700;font-size:13px}
li.active .sh .num{background:var(--al);color:#141414}li.done .sh .num{background:#2f4a26;color:var(--good)}
.sh .t{font-weight:600}.sh .d{margin-left:auto;font-size:12px;color:#5d6577;font-variant-numeric:tabular-nums}
.sb{display:none;padding:0 14px 12px 50px;color:#cfd3dc;font-size:15px;overflow-wrap:break-word}li.active .sb{display:block}
.sb .katex-display{margin:.5em 0;overflow-x:auto;overflow-y:hidden}
.sb details{margin-top:8px;background:#121722;border:1px dashed #3a4560;border-radius:8px;padding:6px 10px}.sb summary{cursor:pointer;color:var(--al)}
.sb table{border-collapse:collapse;font-size:14px;margin:6px 0}.sb td,.sb th{border:1px solid var(--line);padding:2px 8px;text-align:center}
.katex{color:var(--fg)}
/* compare (roomy) */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px}
.cmp>div{border-radius:12px;padding:14px 18px;font-size:15.5px;line-height:1.6;min-height:110px;overflow-wrap:anywhere}
.cmp .mine{background:#1c1a2b;border:1px solid #352f55}.cmp .model{background:#18231a;border:1px solid #2c3d24}
.cmp h5{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cmp .mine p{white-space:pre-wrap;margin:0}.cmp .mine p.empty{color:var(--muted);font-style:italic}.cmp .model p{margin:0}
.rate{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-top:16px;flex-wrap:wrap}
.rate button{padding:3px 12px;font-size:13.5px}.rate button.on.g{background:#2f4a26;border-color:#4b7a3c}.rate button.on.p{background:#4a3f1f;border-color:#7a6430}.rate button.on.m{background:#4a1f27;border-color:#7a3040}
.notewrap{margin-top:12px}.notewrap label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
.qblock{margin:0 0 26px}.qblock+.qblock{border-top:1px solid var(--line);padding-top:22px}
.qblock .tag{color:var(--al);font-weight:700}
.revnote{margin-top:10px;font-size:14.5px;color:#d9c48f;white-space:pre-wrap;overflow-wrap:anywhere}
.summary ol{margin:6px 0;padding-left:22px}
/* symbols */
.sym{cursor:help;border-radius:3px}.sym.hl{background:rgba(224,175,104,.25)}
.k-pi,.k-theta{color:var(--pi)}.k-piold{color:var(--old)}.k-y{color:var(--y)}.k-x{color:var(--x)}.k-R,.k-A{color:var(--R)}.k-b{color:var(--b)}
.k-rho{color:var(--rho)}.k-eps{color:var(--eps)}.k-alpha{color:var(--al)}.k-mu,.k-sigma{color:var(--st)}.k-beta{color:var(--al)}.k-H{color:var(--ent)}
.k-TP{color:#9ece6a}.k-FP{color:#ff9e64}.k-FN{color:#f7768e}.k-TN{color:#7aa2f7}.k-prec{color:#b392f0}.k-rec{color:#7dcfff}.k-F1{color:#e0af68}.k-thr{color:#e08fd0}.k-wS{color:#ff9e64}.k-wD{color:#f7768e}.k-wI{color:#7dcfff}.k-wN{color:#e6e6e6}
#tip{position:fixed;z-index:50;max-width:300px;background:#f1f3f8;color:#11141b;font-size:13.5px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s}#tip b{display:block}
@media(max-width:900px){.grid{grid-template-columns:1fr}ol.steps{max-height:none}video{max-height:none}.cmp{grid-template-columns:1fr}#top .ttl,.speed>span{display:none}#phases{font-size:12px;gap:2px}#phases span{padding:2px 6px}.card{padding:18px}}
@media(max-width:560px){#pills .pill:not(.on){display:none}#phases span:not(.on){display:none}#fwd{min-width:0}}
</style>

<script>
const LESSON = {"id": "l04", "title": "Lesson 4 · ML fundamentals for pen-and-paper interviews", "h1": "ML fundamentals for pen-and-paper interviews", "sub": "8 chapters + interview drill: metrics recall → bias/variance → regularization → splits/leakage → losses as MLE → gradient descent → logistic regression → backprop. Have pen and paper ready.", "drill": [{"id": "d1", "q": "Train WER 3%, val WER 4%, test WER 22% after you spent a week tuning on the test set. What’s wrong with this picture?", "model": "You <b>overfit the test set</b> by tuning on it (plus possible distribution shift). Test is no longer an unbiased estimate. Fix: freeze a true holdout; do all selection on val (or nested CV); report test once."}, {"id": "d2", "q": "Derive in one line why binary cross-entropy is Bernoulli NLL.", "model": "P(y|p)=p^y(1−p)^{1−y} ⇒ −log P = −[y log p+(1−y)log(1−p)], which is BCE."}, {"id": "d3", "q": "w←w−η∇L with L=(w−3)², w=2.5, η=0.1. One step: new w?", "model": "∇L=2(2.5−3)=−1 → w=2.5−0.1(−1)=<b>2.6</b>."}, {"id": "d4", "q": "Logistic regression: p=0.9, y=0, x=[1,2]. Direction of the gradient ∇w — toward x or opposite? Rough magnitude?", "model": "∇w=(p−y)x=(0.9−0)[1,2]=[0.9,1.8] — <b>same direction as x</b> (then descent moves opposite x to lower p). Magnitude ≈ √(0.9²+1.8²)≈2.01."}, {"id": "d5", "q": "Name two data-leakage bugs specific to training a Guava-style voice agent, and the fix for each.", "model": "(1) <b>Same speaker</b> in train and test → split by speaker_id. (2) <b>Normalizing / selecting features with test stats or labels</b> → fit on train only. Bonus: leaking future context in streaming ASR features; using call-center notes that include the post-call label."}, {"id": "d6", "q": "In one sentence each: what do L2, L1, and dropout do differently?", "model": "L2 shrinks weights smoothly (Gaussian prior / weight decay). L1 drives many weights to exact zero via diamond corners (Laplace / sparse). Dropout randomly zeros units in training to force redundancy."}], "key": ["alpha", "lambda", "sig", "loss", "grad", "w", "eta", "p"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: Lesson 3 weak spots", "short": "Recall", "video": "media/ch1-metrics-recall.mp4", "poster": "media/ch1-metrics-recall-poster.jpg", "steps": [{"key": "auroc", "title": "AUROC by counting pairs", "html": "AUROC = P(a random positive outranks a random negative). List every pair; a tie scores <b>½</b>. Positives {0.9, 0.5}, negatives {0.7, 0.5, 0.2}: five wins and one tie → 4.5/6 = <b>0.75</b>.", "start": 0.0, "end": 6.0}, {"key": "fbeta", "title": "Why Fβ uses β² and (1+β²)", "html": "$$F_\\beta=\\frac{(1+\\beta^2)PR}{\\beta^2 P+R}$$ The weights on \\(1/P\\) and \\(1/R\\) are \\(\\frac{1}{1+\\beta^2}\\) and \\(\\frac{\\beta^2}{1+\\beta^2}\\) (they sum to 1). \\(\\beta^2\\) (not \\(\\beta\\)) makes \\(\\partial F/\\partial P=\\partial F/\\partial R\\) exactly when \\(R/P=\\beta\\). Example: \\(P=0.8,\\ R=0.4\\) → \\(F_1\\approx0.53,\\ F_2\\approx0.44,\\ F_{0.5}\\approx0.67\\).", "start": 6.0, "end": 12.4}, {"key": "pr", "title": "When PR-AUC beats AUROC", "html": "ROC’s random baseline is <b>0.5</b> at any prevalence. PR’s baseline is the <b>positive rate</b>. With 1% positives, TPR 0.9 and FPR 0.05 on 10k examples → TP=90, FP≈495, precision≈0.15. AUROC can look great while most flags are false alarms — use PR-AUC (and precision at your threshold).", "start": 12.4, "end": 17.4}, {"key": "wer", "title": "WER can exceed 100%", "html": "$$\\mathrm{WER}=\\frac{S+D+I}{N_{\\mathrm{ref}}}$$ Word-level Levenshtein over reference length. Ref “yes” (N=1), ASR “yes yes okay”: I=2 → WER=<b>200%</b>. Insertions count; the denominator never includes hypothesis-only words.", "start": 17.4, "end": 23.1}], "check": {"id": "c1", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Precision 0.9, recall 0.5. Compute F1 and F2. Then: ref “ok” (N=1), ASR “okay okay” — what is WER if you treat them as different words (1 sub + 1 ins)?", "model": "F1 = 2·0.9·0.5/(0.9+0.5) = 0.9/1.4 ≈ <b>0.643</b>. F2 = 5·0.9·0.5/(4·0.9+0.5) = 2.25/4.1 ≈ <b>0.549</b>. WER = (1+0+1)/1 = <b>200%</b> (or, if a different alignment gives S=0,D=1,I=2, still 300% — either way it exceeds 100%). Strict word match “ok”≠“okay” → typically S=1,I=1 → 200%."}, "hook": {"id": "h1", "q": "Positives score {0.9, 0.5}, negatives score {0.7, 0.5, 0.2}. List every (pos, neg) pair, score each (1 / ½ / 0), and compute AUROC. Then in one sentence: when would you prefer PR-AUC over AUROC?", "model": "6 pairs: (0.9,0.7)→1, (0.9,0.5)→1, (0.9,0.2)→1, (0.5,0.7)→0, (0.5,0.5)→½, (0.5,0.2)→1. Sum = 4.5 → AUROC = <b>4.5/6 = 0.75</b>. Prefer <b>PR-AUC</b> when positives are rare (fraud, escalations): ROC’s random baseline is always 0.5, while PR’s baseline is the prevalence, and precision shows the false-alarm flood."}, "duration": 23.1}, {"title": "Bias–variance and overfitting", "short": "Bias–var", "video": "media/ch2-bias-variance.mp4", "poster": "media/ch2-bias-variance-poster.jpg", "steps": [{"key": "setup", "title": "Error vs complexity", "html": "Plot train and validation error against model complexity (more parameters, less regularization, more training). This is the bias–variance cartoon every interviewer expects.", "start": 0.0, "end": 4.5}, {"key": "curves", "title": "Two curves", "html": "Train error falls as the model gets more flexible. Val error falls, then <b>rises</b>. The rise is overfitting: the model is fitting noise that doesn’t appear in new data.", "start": 4.5, "end": 9.5}, {"key": "under", "title": "Underfitting", "html": "Both errors high and close. The model is too simple (or under-trained). Fix: more capacity, better features, train longer, weaker regularization.", "start": 9.5, "end": 13.0}, {"key": "over", "title": "Overfitting", "html": "Train low, val high — a large <b>gap</b>. Fix: regularization, more data, early stop at the val minimum, reduce capacity.", "start": 13.0, "end": 17.3}, {"key": "sweet", "title": "The sweet spot", "html": "Choose the complexity / checkpoint where <b>validation</b> error is lowest. Never pick it on the test set.", "start": 17.3, "end": 21.2}], "check": {"id": "c2", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Train loss 0.40, val loss 0.42 after epoch 5; by epoch 40 train is 0.05 and val is 0.55. What happened, and what would early stopping have done?", "model": "The model <b>overfit</b> after ~epoch 5: train kept falling while val rose. Early stopping would have saved the epoch-5 weights (lowest val loss) and stopped once val stopped improving."}, "hook": {"id": "h2", "q": "Your ASR model’s training WER is 2%, validation WER is 18%. Underfit, overfit, or roughly right? Name two levers you’d pull.", "model": "<b>Overfit</b>: train error much lower than val error (big generalization gap). Levers: more data / augmentation, stronger regularization (L2, dropout), smaller model, early stopping on val, or simplify features. Do <i>not</i> keep training until train WER hits zero."}, "duration": 21.2}, {"title": "Regularization: L2, L1, dropout", "short": "Regularize", "video": "media/ch3-regularize.mp4", "poster": "media/ch3-regularize-poster.jpg", "steps": [{"key": "l2", "title": "L2 / weight decay", "html": "$$L_{\\mathrm{L2}}=L_{\\mathrm{data}}+\\lambda\\sum_j w_j^2$$ Shrinks weights toward 0 (many small weights). Equivalent update factor \\((1-2\\eta\\lambda)\\) — “weight decay”. Bayesian view: Gaussian prior on \\(w\\).", "start": 0.0, "end": 5.8}, {"key": "l1", "title": "L1 and the diamond", "html": "$$L_{\\mathrm{L1}}=L_{\\mathrm{data}}+\\lambda\\sum_j |w_j|$$ The L1 ball has corners. Contours of \\(L_{\\mathrm{data}}\\) often touch a corner ⇒ some \\(w_j=0\\) (feature selection). Laplace prior.", "start": 5.8, "end": 12.2}, {"key": "drop", "title": "Dropout", "html": "Each training step, randomly zero hidden units (typical \\(p\\approx0.5\\)). Forces redundant representations. At test time, use all units and scale by the keep probability (or use inverted dropout).", "start": 12.2, "end": 18.6}], "check": {"id": "c3", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "You want a sparse linear model that only keeps a few MFCC / pitch features for a keyword spotter. L1 or L2? Why? What prior does each correspond to?", "model": "<b>L1</b> — corners of the diamond give exact zeros, so unused features drop out. L1 ↔ Laplace prior; L2 ↔ Gaussian prior (shrinks but keeps most weights small and nonzero)."}, "hook": {"id": "h3", "q": "L2 and L1 both add a penalty on weights. Which one tends to drive some weights to <b>exactly zero</b>, and what’s the geometric reason people give?", "model": "<b>L1</b>. The L1 constraint set is a diamond; level sets of the data loss often hit a <b>corner</b>, where some coordinates are exactly 0 (sparse solutions). L2’s ball is round, so it shrinks weights but rarely zeros them. Priors: L2 ↔ Gaussian, L1 ↔ Laplace."}, "duration": 18.6}, {"title": "Splits, k-fold, and data leakage", "short": "Splits", "video": "media/ch4-splits-leak.mp4", "poster": "media/ch4-splits-leak-poster.jpg", "steps": [{"key": "three", "title": "Train / val / test", "html": "<b>Train</b> fits weights. <b>Val</b> chooses hyperparameters / early stop / architecture. <b>Test</b> is touched once for the final report. Tuning on test turns it into a second val set.", "start": 0.0, "end": 4.5}, {"key": "kfold", "title": "k-fold cross-validation", "html": "Split train into \\(k\\) folds; each fold is val once while the others train. Average the \\(k\\) scores. Useful when data is scarce; still keep a held-out test set if you can.", "start": 4.5, "end": 8.9}, {"key": "speak", "title": "Speech leakage: speakers", "html": "Utterances from the same speaker are highly correlated. Random utterance splits leak identity into the test set. Split on speaker (or recording session).", "start": 8.9, "end": 13.2}, {"key": "norm", "title": "Normalization leakage", "html": "Fitting mean/std (or PCA, feature selectors) on train+test lets test statistics into training. Fit scalers on <b>train only</b>, then apply those numbers to val/test.", "start": 13.2, "end": 17.9}], "check": {"id": "c4", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "You standardize audio features using mean and variance computed on the full dataset (train+val+test), then train. Is that leakage? What about picking the top-20 features by correlation with the label on the full dataset?", "model": "Yes to both. (1) Test moments entered the scaler. (2) Feature selection used test labels. Fit scaler and select features on <b>train only</b> (inside each CV fold), then apply to val/test."}, "hook": {"id": "h4", "q": "You build an ASR dataset of 200 speakers. You randomly shuffle all utterances 80/10/10 into train/val/test. Name the leakage risk for a voice-AI product like Guava, and the fix.", "model": "<b>Speaker leakage</b>: the same voice can appear in train and test, so the model memorizes speakers and WER looks unrealistically good. Fix: split by <b>speaker_id</b> (or session) so every speaker is in exactly one split."}, "duration": 17.9}, {"title": "Losses as maximum likelihood", "short": "Loss=MLE", "video": "media/ch5-loss-mle.mp4", "poster": "media/ch5-loss-mle-poster.jpg", "steps": [{"key": "idea", "title": "Maximize likelihood = minimize −log likelihood", "html": "Pick a probabilistic model for \\(y\\mid x,\\theta\\). The likelihood is \\(P(\\mathrm{data}\\mid\\theta)\\). Maximizing it is the same as minimizing \\(-\\log P\\) — that is the training loss.", "start": 0.0, "end": 4.5}, {"key": "mse", "title": "MSE from Gaussian noise", "html": "Assume \\(y=f_\\theta(x)+\\varepsilon\\) with \\(\\varepsilon\\sim\\mathcal N(0,\\sigma^2)\\). Then $$-\\log p(y\\mid x)=\\tfrac{1}{2\\sigma^2}(y-f)^2+\\mathrm{const}$$ so (scaled) MSE <b>is</b> Gaussian NLL.", "start": 4.5, "end": 11.1}, {"key": "ce", "title": "Cross-entropy from Bernoulli", "html": "Assume \\(y\\sim\\mathrm{Bernoulli}(p)\\), \\(p=\\sigma(z)\\). Likelihood \\(p^y(1-p)^{1-y}\\). NLL: $$-\\log p=-[y\\log p+(1-y)\\log(1-p)]$$ — binary cross-entropy.", "start": 11.1, "end": 17.4}, {"key": "cat", "title": "Softmax / categorical CE", "html": "For \\(K\\) classes with one-hot \\(y\\) and \\(p=\\mathrm{softmax}(z)\\): \\(L=-\\sum_k y_k\\log p_k=-\\log p_{\\mathrm{correct}}\\). Same story: multinoulli NLL.", "start": 17.4, "end": 22.5}], "check": {"id": "c5", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "A colleague wants to train a probability-calibrated wake-word detector with MSE between σ(z) and the 0/1 label. What likelihood does that imply, and what loss matches the Bernoulli assumption instead?", "model": "MSE on probabilities is <i>not</i> Bernoulli NLL (it’s closer to a Gaussian-on-[0,1] assumption and is often poorly calibrated at extremes). Use <b>binary cross-entropy</b> / log-loss, which is exactly Bernoulli NLL."}, "hook": {"id": "h5", "q": "Why is mean squared error the “right” loss for regression, and binary cross-entropy the “right” loss for logistic regression? Answer in terms of a noise / likelihood model.", "model": "MSE is the negative log-likelihood under <b>Gaussian</b> noise y = f_θ(x) + ε with ε ~ N(0, σ²). Binary CE is the NLL under a <b>Bernoulli</b> with p = σ(z). You’re maximizing likelihood of the observed labels under that noise model."}, "duration": 22.5}, {"title": "Gradient descent by hand", "short": "Grad desc", "video": "media/ch6-grad-desc.mp4", "poster": "media/ch6-grad-desc-poster.jpg", "steps": [{"key": "rule", "title": "The update rule", "html": "$$w \\leftarrow w-\\eta\\,\\nabla_w L(w)$$ Gradient points uphill; the minus sign descends. \\(\\eta\\) is the learning rate (step size).", "start": 0.0, "end": 5.7}, {"key": "lr", "title": "Learning rate too small / too big", "html": "Too small → crawl. Too big → overshoot or diverge. Tune on validation loss; deep nets often use schedules (warmup, decay).", "start": 5.7, "end": 10.8}, {"key": "hand", "title": "Worked 1-D example", "html": "\\(L(w)=(w-3)^2\\), \\(\\nabla L=2(w-3)\\), \\(\\eta=0.25\\), \\(w_0=0\\): 0 → 1.5 → 2.25 → 2.625 → … toward 3. Always compute \\(g\\) first, then the update.", "start": 10.8, "end": 16.0}, {"key": "sgd", "title": "Batch vs SGD vs mini-batch", "html": "<b>Batch</b>: full dataset (exact, expensive). <b>SGD</b>: one example (noisy, cheap). <b>Mini-batch</b> (32–256): the practical default — GPU-friendly, noise helps generalization.", "start": 16.0, "end": 20.8}], "check": {"id": "c6", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Same L(w)=(w−3)², but η=2 and w₀=0. Compute the next two iterates. What goes wrong?", "model": "g=−6 → w=0−2(−6)=<b>12</b>. Next g=2(12−3)=18 → w=12−2·18=<b>−24</b>. The steps diverge: η is far too large for this curvature."}, "hook": {"id": "h6", "q": "L(w)=(w−3)², so ∇L=2(w−3). Start at w=0 with learning rate η=0.25. Do two update steps by hand. What is w after step 2?", "model": "Step 1: g=2(0−3)=−6 → w=0−0.25(−6)=<b>1.5</b>. Step 2: g=2(1.5−3)=−3 → w=1.5−0.25(−3)=<b>2.25</b>. (True minimum is w*=3.)"}, "duration": 20.8}, {"title": "Logistic regression by hand", "short": "Log reg", "video": "media/ch7-log-reg.mp4", "poster": "media/ch7-log-reg-poster.jpg", "steps": [{"key": "sig", "title": "The sigmoid", "html": "$$p=\\sigma(z)=\\frac{1}{1+e^{-z}}\\in(0,1)$$ with \\(z=w\\cdot x\\). \\(\\sigma(0)=0.5\\), and \\(\\sigma'(z)=\\sigma(z)(1-\\sigma(z))\\).", "start": 0.0, "end": 5.8}, {"key": "loss", "title": "Log-loss", "html": "$$L=-[y\\log p+(1-y)\\log(1-p)]$$ If \\(y=1\\), this is \\(-\\log p\\). Confident and wrong → loss → ∞. Same Bernoulli NLL as before.", "start": 5.8, "end": 11.2}, {"key": "grad", "title": "Why (p − y)x", "html": "Chain rule: \\(\\partial L/\\partial z=p-y\\), and \\(\\partial z/\\partial w=x\\), so $$\\nabla_w L=(p-y)\\,x$$ Memorize this — it shows up constantly.", "start": 11.2, "end": 15.8}, {"key": "hand", "title": "Worked update", "html": "\\(x=2,\\ w=0.3,\\ y=1,\\ \\eta=0.5\\): \\(z=0.6\\), \\(p=\\sigma(0.6)\\approx0.646\\), \\(L=-\\log p\\approx0.437\\), \\(\\nabla w=(0.646-1)\\cdot2\\approx-0.709\\), $$w\\leftarrow0.3-0.5(-0.709)\\approx0.654$$ \\(p<y\\) ⇒ \\(w\\) rises ⇒ next \\(p\\) higher. <details><summary>Faded example: you finish it</summary>\\(x=1,\\ w=0,\\ y=0\\). Then \\(p=\\sigma(0)=0.5\\), \\(\\nabla w=(0.5-0)\\cdot1=0.5\\). With \\(\\eta=1\\), \\(w\\leftarrow\\) ?<br><i>Answer: 0−1·0.5=−0.5.</i></details>", "start": 15.8, "end": 21.4}], "check": {"id": "c7", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "x=1, w=0, y=1, η=1. Compute p, ∇w, and the updated w. Does p move in the right direction on the next forward pass?", "model": "p=σ(0)=<b>0.5</b>. ∇w=(0.5−1)·1=<b>−0.5</b>. w←0−1(−0.5)=<b>+0.5</b>. Next z=0.5, p=σ(0.5)≈0.62 > 0.5 — yes, toward y=1."}, "hook": {"id": "h7", "q": "For logistic regression, the gradient of log-loss w.r.t. the weight vector is often written (p − y)x. In words: if the model’s probability p is higher than the label y, which way do the weights move along x?", "model": "If p > y (over-confident toward class 1), then (p − y) > 0, so the update w ← w − η(p − y)x <b>subtracts</b> a positive multiple of x — weights move opposite x, which lowers the score z = w·x and thus lowers p."}, "duration": 21.4}, {"title": "Backprop by hand on a tiny net", "short": "Backprop", "video": "media/ch8-backprop.mp4", "poster": "media/ch8-backprop-poster.jpg", "steps": [{"key": "net", "title": "The network", "html": "$$x\\xrightarrow{w_1}z=w_1 x\\xrightarrow{\\sigma}h=\\sigma(z)\\xrightarrow{w_2}\\hat y=w_2 h,\\quad L=\\tfrac12(\\hat y-y)^2$$ Numbers we’ll use: \\(x=1,\\ w_1=1,\\ w_2=2,\\ y=1\\).", "start": 0.0, "end": 6.1}, {"key": "fwd", "title": "Worked forward pass", "html": "\\(z=1\\), \\(h=\\sigma(1)\\approx0.731\\), \\(\\hat y=2\\cdot0.731\\approx1.462\\), \\(L=\\tfrac12(0.462)^2\\approx0.107\\). Save every intermediate for the backward pass.", "start": 6.1, "end": 10.6}, {"key": "bwd", "title": "Worked backward pass", "html": "$$\\frac{\\partial L}{\\partial\\hat y}=\\hat y-y\\approx0.462$$ $$\\frac{\\partial L}{\\partial w_2}=0.462\\cdot h\\approx0.338$$ $$\\frac{\\partial L}{\\partial h}=0.462\\cdot w_2\\approx0.924,\\quad \\frac{\\partial h}{\\partial z}=h(1-h)\\approx0.197$$ $$\\frac{\\partial L}{\\partial w_1}=0.924\\cdot0.197\\cdot x\\approx0.182$$", "start": 10.6, "end": 15.3}, {"key": "upd", "title": "One update + faded example", "html": "With \\(\\eta=0.5\\): \\(w_2\\leftarrow2-0.5\\cdot0.338\\approx1.831\\), \\(w_1\\leftarrow1-0.5\\cdot0.182\\approx0.909\\). Both fell because \\(\\hat y\\) was too high. <details><summary>Faded example: you finish it</summary>Same net, but \\(y=2\\) (so now \\(\\hat y&lt;y\\)). Sign of \\(\\partial L/\\partial\\hat y\\)? Do \\(w_2\\) and \\(w_1\\) rise or fall?<br><i>Answer: \\(\\partial L/\\partial\\hat y=1.462-2&lt;0\\); both gradients flip sign → both weights <b>increase</b>.</i></details>", "start": 15.3, "end": 20.3}], "check": {"id": "c8", "tag": "✏️ Pen & paper practice", "kind": "practice", "q": "Same architecture with ReLU instead of σ: x=2, w₁=0.5, h=ReLU(w₁x)=1, w₂=−1, ŷ=−1, y=1, L=½(ŷ−y)². Compute ∂L/∂w₂ and ∂L/∂w₁ (ReLU′=1 since 1>0).", "model": "L=½(−1−1)²=2. ∂L/∂ŷ=ŷ−y=−2. ∂L/∂w₂=(−2)·h=<b>−2</b>. ∂L/∂h=(−2)·w₂=(−2)(−1)=2. ∂L/∂w₁=2·ReLU′·x=2·1·2=<b>4</b>. (Update with η>0 would raise w₂ and lower w₁.)"}, "hook": {"id": "h8", "q": "Tiny net: h=σ(w₁x), ŷ=w₂h, L=½(ŷ−y)². With x=1, w₁=1, w₂=2, y=1 you get h≈0.731, ŷ≈1.462. Without re-deriving everything: should the update increase or decrease w₂, and why?", "model": "<b>Decrease</b> w₂. ŷ is already above y (1.462 > 1), so ∂L/∂ŷ=ŷ−y>0 and ∂L/∂w₂=(∂L/∂ŷ)·h>0. Gradient descent subtracts η times that → w₂ falls, which lowers ŷ."}, "duration": 20.3}], "summary": ["AUROC = pair-ranking probability (ties ½). PR-AUC when positives are rare (baseline = prevalence). Fβ weights use β² so R/P=β equalizes the partials. WER = word Levenshtein / N_ref (can exceed 100%).", "Underfit: train & val both high. Overfit: train low, val high. Pick the val minimum.", "L2 = shrink (Gaussian prior); L1 = sparse via diamond corners (Laplace); dropout = random unit masking.", "Split by speaker for ASR. Fit scalers/selectors on train only. Never tune on test.", "MSE = Gaussian NLL; binary CE = Bernoulli NLL; softmax CE = categorical NLL.", "GD: w ← w − η∇L. Mini-batch is the default. Logistic gradient (p−y)x. Backprop = chain rule on saved forward values."]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const K=(q,f)=>`lap:${LESSON.id}:${q}:${f}`;
const store={get:(q,f)=>localStorage.getItem(K(q,f))||"",set:(q,f,v)=>localStorage.setItem(K(q,f),v)};
const fmt=t=>t<60?Math.round(t)+"s":Math.floor(t/60)+"m"+String(Math.round(t%60)).padStart(2,"0");
const CH=LESSON.chapters, DRILL=LESSON.drill||[], NC=CH.length;
const PH=["Question","Learn","Compare","Practice"];
// ---------- question registry (ids are the localStorage keys; keep them stable across edits) ----------
const REV=[];CH.forEach((c,i)=>{REV.push([c.hook,`Chapter ${i+1} prediction`]);REV.push([c.check,`Chapter ${i+1} practice`]);});DRILL.forEach((q,i)=>REV.push([q,`Drill ${i+1}`]));
const QA={};REV.forEach(([q])=>QA[q.id]=q);
// ---------- screens: intro, chapters, drill?, revisit ----------
const SCR=[{type:"intro"},...CH.map((c,ci)=>({type:"ch",ci})),...(DRILL.length?[{type:"drill"}]:[]),{type:"revisit"}];
const cmpHTML=qid=>`<div data-cmp="${qid}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${QA[qid].model}</p></div></div>
  <div class="rate">How did you do? <button class="g" data-r="got">Got it</button><button class="p" data-r="partly">Partly</button><button class="m" data-r="missed">Missed</button></div>
  <div class="notewrap"><label>What was unclear? (optional)</label><textarea class="note" data-note="${qid}" placeholder="Anything that still feels fuzzy…"></textarea></div></div>`;
const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
document.addEventListener("click",e=>{const t=e.target;
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
