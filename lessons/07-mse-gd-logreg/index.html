<script>
const LESSON = {"id": "l07", "title": "Lesson 7 · MSE from Gaussian noise → gradient descent → logistic regression", "h1": "MSE → gradient descent → logistic regression", "sub": "Lesson 7 · a recall warm-up, then 3 new ideas, one per chapter: where squared error comes from, how gradient descent steps, and the sigmoid. The last chapter recaps the pieces and combines them into logistic regression and its (p − y)x gradient. All the numbers work on paper. Have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up: write logistic regression training in plain numpy (no sklearn). X has shape (N, d) and y has shape (N,) with 0/1 labels. Aim for about 8 lines: forward pass, loss, gradient, update.", "model": "<pre><code>def sigmoid(z):\n    return 1 / (1 + np.exp(-z))\n\nN, d = X.shape\nw, b = np.zeros(d), 0.0\nfor step in range(1000):\n    p = sigmoid(X @ w + b)        # (N,)\n    eps = 1e-12                   # keep log away from 0\n    loss = -np.mean(y * np.log(p + eps)\n                    + (1 - y) * np.log(1 - p + eps))\n    # the (p - y)x rule, averaged over N\n    grad_w = X.T @ (p - y) / N    # (d,)\n    grad_b = np.mean(p - y)       # bias: x = 1\n    w -= lr * grad_w\n    b -= lr * grad_b</code></pre>Say out loud: the shapes, averaging over N, the small epsilon so log never sees 0, and that the bias gradient is (p − y) with x = 1."}, {"id": "d2", "q": "Same loop for linear regression with MSE. What changes?", "model": "Two lines. The forward pass has no sigmoid, <code>y_hat = X @ w + b</code>, and the loss is <code>np.mean((y_hat - y)**2)</code>. The gradient is <code>2 * X.T @ (y_hat - y) / N</code>: the same (prediction − truth) × input shape, with a 2 from the square. Using ½·MSE removes the 2."}, {"id": "d3", "q": "Your training loss goes 0.69 → 0.65 → 3.1 → nan. What do you suspect first, and what do you try?", "model": "<b>The learning rate is too large</b>: the overshoot from Chapter 3 (η = 1.1), where each step lands farther away. Lower lr by 10×, and standardize the features so all the slopes are on a similar scale. Also check for <b>log(0)</b>: clip p, or compute the loss from logits (e.g. <code>BCEWithLogitsLoss</code>, which uses a stable log-sum-exp). 0.69 is ln 2, the loss of always predicting p = 0.5, a useful sanity check for the first step."}, {"id": "d4", "q": "Why not train a classifier with MSE between σ(z) and the 0/1 label?", "model": "MSE assumes Gaussian noise, but a 0/1 label follows a Bernoulli distribution; cross-entropy is its likelihood. In practice: with MSE through a sigmoid the gradient is (p − y)·<b>p(1 − p)</b>·x, and when the model is confidently wrong (p ≈ 1, y = 0) the factor p(1 − p) ≈ 0, so it barely learns from its worst mistakes. Cross-entropy cancels that factor and leaves (p − y)x. The MSE version is also non-convex in w."}], "key": ["yhat", "noise", "mse", "w", "eta", "grad", "z", "sig", "p"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: CE = H + KL, KL asymmetry, AUROC with a tie, PPO clip", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "cekl", "title": "Lesson 6: cross-entropy = entropy + KL", "html": "\\(H(P,Q)=H(P)+D_{KL}(P\\|Q)\\), so \\(D_{KL}=2-1.5=\\)<b>0.5 bits</b>. KL is never negative, so no model gets below \\(H(P)=1.5\\). Training can only shrink the KL part, because \\(H(P)\\) is fixed by the data.", "start": 0.0, "end": 7.2}, {"key": "asym", "title": "Lesson 6: KL is not symmetric", "html": "\\(D_{KL}(Q\\|P)=1\\cdot\\log_2\\frac{1}{1/2}+0=1\\) bit, since terms where the first distribution is 0 drop out. \\(D_{KL}(P\\|Q)\\) contains \\(\\tfrac12\\log_2\\frac{1/2}{0}=\\infty\\). It blows up whenever the second distribution gives 0 to something the first one allows.", "start": 7.2, "end": 15.0}, {"key": "auroc", "title": "Lesson 3: AUROC with a tie", "html": "List every positive × negative pair once: 2 × 2 = 4 pairs. A positive scoring higher counts 1, a tie counts <b>½</b>, lower counts 0. \\((1+1+\\tfrac12+1)/4=3.5/4=\\)<b>0.875</b>. AUROC is the probability that a random positive outscores a random negative, with ties split.", "start": 15.0, "end": 23.267}, {"key": "clip", "title": "Lesson 1: PPO clip, inside the range", "html": "For \\(A>0\\) the objective \\(\\min(\\rho A,\\ \\mathrm{clip}(\\rho,0.8,1.2)A)\\) rises with \\(\\rho\\) until 1.2 and then goes flat. \\(\\rho=1.1\\) is still on the rising part: <b>not clipped, gradient ≠ 0</b>. Only past \\(1+\\epsilon\\) (like Lesson 6's \\(\\rho=1.3\\)) does the gradient become 0.", "start": 23.267, "end": 31.367}], "check": {"id": "c1", "q": "Same ideas, new numbers. (a) H(P,Q) = 3 bits and H(P) = 2 bits. What is D_KL(P‖Q), and which of the three numbers does training change? (b) AUROC with positives {0.8, 0.5, 0.3} and negatives {0.5, 0.1}: list every pair. (c) Harder PPO case: a bad response (A &lt; 0) whose ratio has risen to ρ = 1.3, with ε = 0.2. Clipped or not? (Take A = −1 and compare ρA with clip(ρ)·A.)", "model": "(a) D_KL = 3 − 2 = <b>1 bit</b>. Training changes H(P,Q) and D_KL by the same amount; H(P) is fixed by the data. (b) 3 × 2 = 6 pairs: 0.8 vs 0.5 → 1, 0.8 vs 0.1 → 1, 0.5 vs 0.5 → ½ (tie), 0.5 vs 0.1 → 1, 0.3 vs 0.5 → 0, 0.3 vs 0.1 → 1. AUROC = 4.5 / 6 = <b>0.75</b>. (c) <b>Not clipped.</b> ρA = −1.3 and clip(1.3)·A = 1.2·(−1) = −1.2. The min is −1.3, the unclipped term, so the gradient is nonzero and pushes the bad response's probability back down. PPO only stops moves that go <i>further</i> in the direction the advantage wants; a mistake in the wrong direction can always be undone."}, "hook": {"id": "h1", "q": "From memory, four quick ones. (a) A model's cross-entropy on some data is 2 bits, and the data's entropy H(P) is 1.5 bits. What is D_KL(P‖Q)? Could a better model get its cross-entropy below 1.5 bits? (b) P = [½, ½] and Q = [1, 0]. Compute D_KL(Q‖P) and D_KL(P‖Q). (c) AUROC: the positives score 0.9 and 0.6, the negatives score 0.6 and 0.2. Compute it by counting pairs (careful with the tie). (d) PPO: a good response (A &gt; 0) with ratio ρ = 1.1 and ε = 0.2. Is it clipped, and does it still get a gradient?", "model": "(a) H(P,Q) = H(P) + D_KL, so D_KL = 2 − 1.5 = <b>0.5 bits</b>. <b>No</b>: KL ≥ 0, so H(P) = 1.5 is the floor, reached only when Q = P. (b) D_KL(Q‖P) = 1·log₂(1 ÷ ½) + 0 = <b>1 bit</b> (Q's zero term drops out). D_KL(P‖Q) = ½·log₂(½ ÷ 1) + ½·log₂(½ ÷ 0) = <b>∞</b>, because Q gives 0 to b, which P allows. (c) 2 × 2 = 4 pairs: 0.9 vs 0.6 → 1, 0.9 vs 0.2 → 1, 0.6 vs 0.6 → <b>½ (tie)</b>, 0.6 vs 0.2 → 1. AUROC = 3.5 / 4 = <b>0.875</b>. (d) <b>Not clipped.</b> 1.1 is inside [0.8, 1.2], so the objective is still ρA, which rises with ρ: the gradient is nonzero and the response keeps getting pushed up until ρ reaches 1.2."}, "duration": 31.367}, {"title": "MSE from Gaussian noise", "short": "MSE", "video": "media/ch2-mse-gaussian.mp4", "poster": "media/ch2-mse-gaussian-poster.jpg", "steps": [{"key": "noise", "title": "The story: truth = prediction + noise", "html": "A model predicts \\(\\hat y\\); the real \\(y\\) misses it by some noise, \\(y-\\hat y\\). Small misses are common and big misses are rare. To score a model the maximum-likelihood way (Lesson 6), ask: <b>how likely was each real \\(y\\)</b> under this model?", "start": 0.0, "end": 11.1}, {"key": "bell", "title": "The bell curve (Gaussian)", "html": "$$p(y\\mid\\hat y)=\\frac{1}{\\sqrt{2\\pi\\sigma^2}}\\,e^{-\\frac{(y-\\hat y)^2}{2\\sigma^2}}$$ Read it piece by piece: <b>e to the minus squared distance</b> gives the bell shape; \\(\\sigma\\) is how wide the noise is; the front factor only makes the total area 1. With \\(\\sigma=1\\), a 1σ miss is at 0.61 of the peak height and a 3σ miss at 0.01: big misses get rare fast.", "start": 11.1, "end": 20.7}, {"key": "neglog", "title": "Surprise of one point: the log cancels the e", "html": "Loss = surprise = \\(-\\ln p\\), and \\(-\\ln e^{-a}=a\\), so $$-\\ln p(y\\mid\\hat y)=\\frac{(y-\\hat y)^2}{2\\sigma^2}+\\ln\\sqrt{2\\pi\\sigma^2}$$ <b>Worked example 1</b> (\\(\\sigma=1\\)): a miss of 1 costs \\(1^2/2=0.5\\), a miss of 2 costs \\(2^2/2=2\\), a miss of 3 costs \\(3^2/2=4.5\\), each plus the same constant. Double the miss, 4× the surprise.", "start": 20.7, "end": 28.4}, {"key": "sum", "title": "Many points: products become sums, which is MSE", "html": "Independent points: \\(p(\\text{all }y)=\\prod_i p(y_i\\mid\\hat y_i)\\), so the surprises add: $$-\\ln p(\\text{all }y)=\\sum_i\\frac{(y_i-\\hat y_i)^2}{2\\sigma^2}+N\\ln\\sqrt{2\\pi\\sigma^2}$$ \\(\\sigma\\) and the constant don't depend on the model's predictions, so the best model minimizes \\(\\sum_i(y_i-\\hat y_i)^2\\), or equivalently $$\\text{MSE}=\\frac1N\\sum_i(y_i-\\hat y_i)^2$$ Maximum likelihood under Gaussian noise = minimum MSE.", "start": 28.4, "end": 36.2}, {"key": "edge", "title": "Edge case: one outlier", "html": "<b>Worked example 2:</b> model A misses by 1, 1, 1, so MSE = 3/3 = <b>1</b>. Model B misses by 0, 0, 3, so MSE = 9/3 = <b>3</b>. Both have a total miss of 3, but B costs 3× more: the bell curve says a 3σ miss is nearly impossible, so one outlier dominates. With many outliers, use \\(|y-\\hat y|\\) (MAE), which is the loss for heavier-tailed Laplace noise. <details><summary>Check your last step: misses 2, 0, −2</summary>\\((4+0+4)/3=8/3\\approx\\)<b>2.67</b>. The sign disappears when you square.</details>", "start": 36.2, "end": 45.1}], "check": {"id": "c2", "q": "(a) Truth y = [2, 5, 6] and predictions ŷ = [3, 5, 4]. Compute the MSE. (b) With σ = 1 and ignoring the constant, how many times bigger is the Gaussian surprise for a miss of 3 than for a miss of 1? (c) In one sentence: why does one outlier pull an MSE-trained model so hard?", "model": "(a) Misses: −1, 0, 2. Squares: 1, 0, 4. MSE = 5/3 ≈ <b>1.67</b>. (b) 3²/2 = 4.5 and 1²/2 = 0.5, so <b>9×</b> (the square of 3). (c) Gaussian noise says big misses are nearly impossible, so their surprise grows with the <b>square</b> of the miss: one 10-unit miss costs as much as 100 one-unit misses, and the fit bends toward it."}, "hook": {"id": "h2", "q": "You fit a line that predicts how many seconds a clip takes to transcribe. Why do we train it with the <i>squared</i> error (y − ŷ)², rather than |y − ŷ| or (y − ŷ)⁴? Hint: Lesson 6 said a loss is the surprise −log p of what really happened. What would p have to look like for −log p to be a square?", "model": "MSE is the surprise −log p when you assume <b>truth = prediction + Gaussian (bell-curve) noise</b>. The Gaussian is p(y | ŷ) ∝ e^{−(y − ŷ)²/2σ²}, and −ln removes the e, leaving (y − ŷ)²/2σ² + a constant. Independent points multiply probabilities, so their surprises add. Drop the constants (they don't depend on the model) and what's left is the sum of squared errors. So the square comes from the bell curve. |y − ŷ| corresponds to Laplace noise, which has heavier tails and is more robust to outliers."}, "duration": 45.1}, {"title": "Gradient descent, one step at a time", "short": "Grad desc", "video": "media/ch3-gradient-descent.mp4", "poster": "media/ch3-gradient-descent-poster.jpg", "steps": [{"key": "hill", "title": "The slope tells you which way is uphill", "html": "\\(L(w)=(w-3)^2\\) is the squared error of a one-weight model \\(\\hat y=w\\cdot x\\) on a single point \\(x=1,\\ y=3\\) (Chapter 2). The slope is the <b>derivative</b>. Nudge test: \\(L(5)=4\\), \\(L(5.1)=4.41\\), so the slope ≈ \\(0.41/0.1\\approx4\\). Exactly, by the chain rule \\((u^2)'=2u\\cdot u'\\) with \\(u=w-3\\): $$\\frac{dL}{dw}=2(w-3)=2\\cdot2=4$$", "start": 0.0, "end": 10.8}, {"key": "rule", "title": "The update rule", "html": "$$w\\leftarrow w-\\eta\\cdot\\frac{dL}{dw}$$ A positive slope means the loss goes up to the right, so the <b>minus sign</b> steps left, downhill. \\(\\eta\\), the <b>learning rate</b>, sets how far you step per unit of slope. A steep slope here means you're far from the bottom, so you take a bigger step.", "start": 10.8, "end": 19.7}, {"key": "ex1", "title": "Worked example 1: η = 0.25", "html": "Start at \\(w=5\\). Slope 4 → \\(w=5-0.25\\cdot4=4\\). Slope 2 → \\(w=4-0.5=3.5\\). Slope 1 → \\(w=3.5-0.25=3.25\\). The distance to the bottom halves each step: 2 → 1 → 0.5 → 0.25. Why? \\(w-3\\leftarrow(w-3)-\\eta\\cdot2(w-3)=(1-2\\eta)(w-3)\\), and \\(1-2\\cdot0.25=0.5\\).", "start": 19.7, "end": 29.6}, {"key": "ex2", "title": "Worked example 2 (edge case): η too big", "html": "\\(\\eta=1.1\\), start at \\(w=5\\). Slope 4 → \\(w=5-4.4=0.6\\), past the bottom. Slope \\(2(0.6-3)=-4.8\\) → \\(w=0.6+5.28=5.88\\). The distance goes 2 → 2.4 → 2.88: the multiplier \\(1-2\\eta=-1.2\\) flips the side and grows the distance, so it <b>diverges</b>. \\(\\eta=1\\) (multiplier −1) bounces 5, 1, 5, 1 forever. In code this looks like a loss that climbs and then turns into NaN.", "start": 29.6, "end": 40.633}, {"key": "faded", "title": "Your turn, then the real thing", "html": "With many weights, the <b>gradient</b> \\(\\nabla L\\) is one slope per weight and the same rule updates all of them at once: \\(w\\leftarrow w-\\eta\\nabla L\\). The <code>lr = 1e-5</code> in your GRPO config is this \\(\\eta\\). <details><summary>Check your last step: η = 0.5 from w = 5</summary>\\(w=5-0.5\\cdot4=\\)<b>3</b>, the bottom in one step, because \\(1-2\\eta=0\\). That's special to this perfect bowl; real losses aren't this tidy.</details>", "start": 40.633, "end": 47.933}], "check": {"id": "c3", "q": "L(w) = (w + 1)², so dL/dw = 2(w + 1). Start at w = 1. (a) Do two steps with η = 0.25. (b) Do one step with η = 1.5. What happens? (c) The distance to the bottom gets multiplied by (1 − 2η) each step. Which learning rates converge for this loss?", "model": "(a) Slope 2(1 + 1) = 4 → w = 1 − 0.25·4 = <b>0</b>. Slope 2 → w = 0 − 0.5 = <b>−0.5</b>. The distance to −1 goes 2 → 1 → 0.5. (b) Slope 4 → w = 1 − 1.5·4 = <b>−5</b>: the distance goes from 2 to 4, on the other side. It overshoots and doubles, so it <b>diverges</b>. (c) It converges when |1 − 2η| &lt; 1, i.e. <b>0 &lt; η &lt; 1</b>. η = 0.5 lands in one step, η = 1 bounces forever, and above 1 it diverges."}, "hook": {"id": "h3", "q": "The loss is L(w) = (w − 3)² and you're standing at w = 5. You can't see the curve; you can only feel the slope under your feet. (a) Which way should w move? (b) Propose a rule for how far to step. (c) What could go wrong if your steps are too big?", "model": "(a) <b>Toward smaller w.</b> The slope is dL/dw = 2(5 − 3) = 4 &gt; 0, so the loss rises to the right; go left. (b) <b>Gradient descent:</b> w ← w − η·dL/dw. Step against the slope, in proportion to how steep it is, scaled by the learning rate η. (c) Too large an η <b>overshoots</b> the bottom. With η = 1.1 you go 5 → 0.6 → 5.88, a little farther from 3 each time, so it diverges. Too small an η just crawls."}, "duration": 47.933}, {"title": "Logistic regression and the (p − y)x gradient", "short": "Log reg", "video": "media/ch4-logistic-regression.mp4", "poster": "media/ch4-logistic-regression-poster.jpg", "steps": [{"key": "recap", "title": "Recap: the pieces, and the one that's new", "html": "<b>Score</b> \\(z=w\\cdot x\\), like Chapter 3's \\(\\hat y=w\\cdot x\\). <b>Loss</b> = surprise of the true label, \\(-\\ln(\\text{prob of true label})\\) (Lesson 6). <b>Step</b> \\(w\\leftarrow w-\\eta\\,dL/dw\\) (Chapter 3). The only new piece is how to turn a score into a probability.", "start": 0.0, "end": 7.3}, {"key": "sigmoid", "title": "The sigmoid, from log-odds", "html": "Odds are \\(p/(1-p)\\): \\(p=\\tfrac34\\) means odds 3:1. Let the score be the log-odds and solve for \\(p\\): $$\\ln\\frac{p}{1-p}=z\\ \\Rightarrow\\ \\frac{p}{1-p}=e^z\\ \\Rightarrow\\ p=\\frac{e^z}{1+e^z}=\\frac{1}{1+e^{-z}}=\\sigma(z)$$ Checks: \\(z=0\\) → odds 1:1 → \\(p=\\tfrac12\\). \\(z=\\ln3\\approx1.1\\) → odds 3:1 → \\(p=\\tfrac34\\). \\(z=-\\ln3\\) → \\(p=\\tfrac14\\).", "start": 7.3, "end": 18.0}, {"key": "loss", "title": "The loss: binary cross-entropy", "html": "If \\(y=1\\), the loss is \\(-\\ln p\\); if \\(y=0\\), it's \\(-\\ln(1-p)\\). In one formula: $$L=-\\big[y\\ln p+(1-y)\\ln(1-p)\\big]$$ The \\(y\\)'s just switch the right term on. With \\(p=0.8\\): \\(y=1\\) costs \\(-\\ln0.8\\approx0.22\\) nats and \\(y=0\\) costs \\(-\\ln0.2\\approx1.61\\) nats.", "start": 18.0, "end": 26.3}, {"key": "slope", "title": "The sigmoid's slope is p(1 − p)", "html": "$$\\frac{dp}{dz}=\\frac{e^{-z}}{(1+e^{-z})^2}=\\underbrace{\\frac{1}{1+e^{-z}}}_{p}\\cdot\\underbrace{\\frac{e^{-z}}{1+e^{-z}}}_{1-p}=p(1-p)$$ Check: at \\(z=0\\), \\(p=\\tfrac12\\), so the slope is \\(\\tfrac14\\), the steepest point of the S. Keep \\(p(1-p)\\) in mind, because it cancels in the next step.", "start": 26.3, "end": 33.6}, {"key": "chain", "title": "Chain rule: why it's (p − y)x", "html": "$$\\frac{dL}{dw}=\\frac{dL}{dp}\\cdot\\frac{dp}{dz}\\cdot\\frac{dz}{dw}$$ \\(y=1\\): \\(-\\frac1p\\cdot p(1-p)\\cdot x=-(1-p)x=(p-1)x\\). \\(y=0\\): \\(\\frac1{1-p}\\cdot p(1-p)\\cdot x=p\\,x=(p-0)x\\). Both cases are $$\\frac{dL}{dw}=(p-y)\\,x$$ how wrong the probability is, times the input.", "start": 33.6, "end": 42.3}, {"key": "ex1", "title": "Worked example 1: one full update", "html": "\\(x=2,\\ w=0,\\ y=1,\\ \\eta=0.5\\). \\(z=0\\), so \\(p=\\sigma(0)=0.5\\). Gradient \\((0.5-1)\\cdot2=-1\\). Update \\(w\\leftarrow0-0.5\\cdot(-1)=0.5\\). Next pass: \\(z=0.5\\cdot2=1\\), \\(p=\\sigma(1)\\approx0.73\\), up toward \\(y=1\\) ✓.", "start": 42.3, "end": 50.4}, {"key": "ex2", "title": "Worked example 2 (edge cases)", "html": "With \\(x=1\\): <b>confident and right</b> (\\(p=0.99,\\ y=1\\)): \\((0.99-1)\\cdot1=-0.01\\), almost nothing to learn. <b>Confident and wrong</b> (\\(p=0.99,\\ y=0\\)): \\(0.99\\), a big push, though never bigger than \\(|x|\\). <b>Feature absent</b> (\\(x=0\\)): the gradient is 0 whatever \\(p\\) is, so that weight doesn't move. The update is proportional to the error.", "start": 50.4, "end": 57.4}, {"key": "faded", "title": "Your turn, and the same shape as MSE", "html": "Linear regression with \\(\\tfrac12(\\hat y-y)^2\\) has gradient \\((\\hat y-y)\\,x\\); logistic regression with cross-entropy has \\((p-y)\\,x\\). Both are <b>(prediction − truth) × input</b>, because each loss is the right likelihood for its model. <details><summary>Check your last step: p = 0.2, y = 1, x = 3</summary>\\((0.2-1)\\cdot3=\\)<b>−2.4</b>. The gradient is negative, so \\(w\\) rises by \\(\\eta\\cdot2.4\\), and \\(p\\) rises toward 1.</details>", "start": 57.4, "end": 63.8}], "check": {"id": "c4", "q": "x = −1, w = 0, y = 1, η = 1. (a) Compute p, the gradient, and the new w. (b) On the next forward pass, does p go up or down? (Careful: x is negative.) (c) With x = 1, give the gradient for a confidently wrong example (p = 0.95, y = 0) and a confidently right one (p = 0.95, y = 1). Why is it good that they differ so much?", "model": "(a) z = 0, so p = <b>0.5</b>. Gradient (0.5 − 1)·(−1) = <b>0.5</b>. w ← 0 − 1·0.5 = <b>−0.5</b>. (b) New z = (−0.5)·(−1) = 0.5, so p = σ(0.5) ≈ 0.62: it goes <b>up</b>, toward y = 1 ✓. w went down, but because x is negative, the score went up. (c) Wrong: (0.95 − 0)·1 = <b>0.95</b>. Right: (0.95 − 1)·1 = <b>−0.05</b>. The update is proportional to the error, so learning effort goes to the examples the model gets wrong, and the ones it already gets right barely move it."}, "hook": {"id": "h4", "q": "A wake-word detector computes a score z = w·x from one feature x and must output P(wake word). (a) How would you squash any score z between −∞ and ∞ into a probability? (b) Which loss should it use for a label y ∈ {0, 1}? (Think Lesson 6.) (c) Guess the gradient dL/dw for one example.", "model": "(a) The <b>sigmoid</b>, p = σ(z) = 1/(1 + e^{−z}). It comes from saying that the log-odds ln(p/(1 − p)) equals the score z. (b) <b>Binary cross-entropy</b>, the surprise of the true label: −ln p if y = 1 and −ln(1 − p) if y = 0, written together as L = −[y ln p + (1 − y) ln(1 − p)]. (c) <b>dL/dw = (p − y)·x</b>: how wrong the probability is, times the input. By the chain rule, dL/dp · dp/dz · dz/dw, the sigmoid's slope p(1 − p) cancels the 1/p or 1/(1 − p) that comes from the log."}, "duration": 63.8}], "summary": ["MSE = the surprise −log p under Gaussian noise (truth = prediction + bell-curve noise). The log cancels the e and leaves (y − ŷ)²/2σ² + a constant; independent points add. Squaring makes one big miss dominate; MAE corresponds to Laplace noise.", "Gradient descent: w ← w − η·dL/dw. Step against the slope, scaled by the learning rate. On (w − 3)² the distance to the bottom is multiplied by (1 − 2η) each step: η = 0.25 halves it, η = 1.1 diverges.", "Sigmoid σ(z) = 1/(1 + e^{−z}) comes from setting the log-odds ln(p/(1 − p)) equal to the score z. Its slope is p(1 − p).", "Logistic regression = score z = w·x → p = σ(z) → binary cross-entropy → chain rule → dL/dw = (p − y)x. Confidently wrong examples get big updates, confidently right ones almost none."]};

const ansHTML=(qid,ph)=>`<textarea data-ans="${qid}" placeholder="${ph}"></textarea>`;
function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>
  <div class="key">${LESSON.key.map(k=>`<span class="chip sym k-${k}" data-k="${k}">${LESSON.sym[k][0]}</span>`).join("")}</div>
  <p><b>How each chapter works</b></p><ol><li><b>Question:</b> write your prediction. The video stays hidden until you press Start.</li><li><b>Learn:</b> click a step (or press <kbd>→</kbd>) to play just that part. It pauses at the end. <kbd>←</kbd> goes back, <kbd>R</kbd> replays.</li><li><b>Compare:</b> your answer next to the model answer. Rate yourself and note what was unclear.</li><li><b>Practice:</b> a pen-and-paper problem. Answer it, then reveal.</li></ol>
  <p class="hint">${NC} chapters${DRILL.length?" + an interview drill":""}. Answers are saved in this browser. <kbd>→</kbd> / <kbd>Space</kbd> moves forward, <kbd>←</kbd> back.</p>
  <div class="row"><button class="primary" data-go="1">Start chapter 1 →</button></div></div>`;}
function chapterHTML(c,ci){const n=ci+1;return `
  <div class="phase" data-ph="0"><div class="card narrow"><p class="eyebrow">Chapter ${n} of ${NC} · ${PH[0]}</p><h2>${c.title}</h2>
    <p class="qtext"><span class="lbl">Predict first:</span> ${c.hook.q}</p>${ansHTML(c.hook.id,"Your prediction. A rough guess is fine; you'll compare it after the video.")}
    <div class="row"><button class="primary" data-start="${ci}">Start chapter ▶</button><span class="saved" data-saved="${c.hook.id}"></span><span class="hint">The video stays hidden until you start.</span></div></div></div>
  <div class="phase" data-ph="1"><div class="lhead"><p class="eyebrow" style="margin:0">Chapter ${n} of ${NC}</p><h2>${c.title}</h2></div>
    <p class="myq"><span class="lbl">Your question:</span> ${c.hook.q}</p>
    <div class="grid"><div><video id="v${ci}" data-src="${c.video}" data-poster="${c.poster}" muted playsinline preload="none"></video><div class="segbar"><i id="sb${ci}"></i></div>
      <div class="vbar"><button data-act="prev">← Prev</button><button data-act="replay">↻ Replay</button><button class="primary" data-act="next" id="nb${ci}">▶ Play step 1</button><span class="status" id="st${ci}"></span></div></div>
    <ol class="steps">${c.steps.map((s,si)=>`<li data-ci="${ci}" data-si="${si}"><div class="sh"><span class="num">${si+1}</span><span class="t">${s.title}</span><span class="d">${fmt(s.end-s.start)}</span></div><div class="sb">${s.html}</div></li>`).join("")}</ol></div></div>
  <div class="phase" data-ph="2"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[2]}</p><h2>Your prediction vs the answer</h2><p class="qtext">${c.hook.q}</p>${cmpHTML(c.hook.id)}</div></div>
  <div class="phase" data-ph="3"><div class="card roomy"><p class="eyebrow">Chapter ${n} · ${PH[3]}</p><h2>✏️ Pen &amp; paper practice</h2><p class="qtext">${c.check.q}</p>
    ${ansHTML(c.check.id,"Work it out on paper, then write your answer here…")}<div class="row"><button class="primary" data-reveal="${c.check.id}">Reveal model answer</button><span class="saved" data-saved="${c.check.id}"></span></div>
    <div data-revealbox="${c.check.id}" hidden>${cmpHTML(c.check.id)}</div></div></div>`;}
function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>
  ${DRILL.map((q,i)=>`<div class="qblock"><p class="qtext"><span class="tag">⚡ ${i+1}.</span> ${q.q}</p>${ansHTML(q.id,"Your answer…")}<div class="row"><button class="primary" data-reveal="${q.id}">Reveal</button><span class="saved" data-saved="${q.id}"></span></div><div data-revealbox="${q.id}" hidden>${cmpHTML(q.id)}</div></div>`).join("")}</div>`;}
function revisitHTML(){return `<div class="card roomy"><p class="eyebrow">The end</p><h2>Revisit your answers</h2><p class="muted">What you thought, next to the model answers, with your rating and notes.</p>
  ${REV.map(([q,lab])=>`<div class="qblock"><p class="qtext"><span class="tag">${lab} ·</span> ${q.q}</p><div data-cmpro="${q.id}"><div class="cmp"><div class="mine"><h5>Your answer</h5><p></p></div><div class="model"><h5>Model answer</h5><p>${q.model}</p></div></div><div class="rate">Rating: <b class="rv">–</b></div><div class="revnote"></div></div></div>`).join("")}
  <div class="qblock"><p class="qtext"><b>Send me what was shaky.</b> This copies every Partly / Missed rating and every “unclear” note, so you can paste it into chat and it gets re-quizzed next lesson.</p>
    <div class="row"><button class="primary" id="copyrep">Copy my ratings &amp; unclear notes</button><span class="saved" id="copied"></span></div><textarea id="reptext" readonly hidden></textarea></div>
  <div class="summary"><h3>Summary</h3><ol>${LESSON.summary.map(s=>`<li>${s}</li>`).join("")}</ol></div></div>`;}
$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");
// ---------- answers ----------
function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);
  $$(`[data-${f==="answer"?"ans":"note"}="${q}"]`).forEach(x=>{if(x!==t)x.value=t.value;});if(f==="answer")$$(`[data-saved="${q}"]`).forEach(s=>s.textContent="saved ✓");refresh();});
function showReveal(q){$$(`[data-revealbox="${q}"]`).forEach(b=>b.hidden=false);$$(`[data-reveal="${q}"]`).forEach(b=>b.textContent="Revealed ✓");refresh();}
$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));
Object.keys(QA).forEach(q=>{if(store.get(q,"revealed"))showReveal(q);});refresh();
// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];
  if(st.phase===0)return setPhase(ci,1),playStep(ci,0);
  if(st.phase===1){if(st.cur<c.steps.length-1)return playStep(ci,st.cur+1);return setPhase(ci,2);}
  if(st.phase===2)return setPhase(ci,3);
  go(scr+1);}
function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});
// ---------- start ----------
setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
</script>
</body>
</html>
