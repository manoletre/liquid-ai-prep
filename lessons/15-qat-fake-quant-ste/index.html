<script>
const LESSON = {"id": "l15", "title": "Lesson 15 · QAT: fake quantization and the straight-through estimator", "h1": "QAT: let training see the rounding", "sub": "Lesson 15 · a recall warm-up, then 3 new ideas: fake quantization (put the rounding inside the forward pass), the straight-through estimator (how a staircase can still get a gradient), and PTQ vs QAT (what QAT buys, what it costs, and how to measure it). Answers your open question “What is QAT (Quantization aware training)?”. Builds directly on yesterday's quantization lesson. The coding drills at the end double as warm-ups for Monday's Guava coding round. Have a pen ready.", "drill": [{"id": "d1", "q": "Coding-round warm-up (Guava-style, numpy only): write fake_quant(w, s, t) and a QAT loop with the STE for a linear model. Data: rng = np.random.default_rng(0); z = rng.normal(size=(512, 1)); X = z + 0.3 * rng.normal(size=(512, 4)); w_float = [0.36, 0.31, 0.34, 0.32]; y = X @ w_float; s = 0.2. Compare the loss ½·mean((Xŵ − y)²) of plain PTQ vs 300 QAT steps (lr 0.1 decaying linearly to 0).", "model": "<pre><code>import numpy as np\n\ndef fake_quant(w, s, t=7):\n    return s * np.clip(np.round(w / s), -t, t)    # quantize, then dequantize\n\nrng = np.random.default_rng(0)\nz = rng.normal(size=(512, 1))\nX = z + 0.3 * rng.normal(size=(512, 4))           # 4 correlated features\nw_float = np.array([0.36, 0.31, 0.34, 0.32])\ny = X @ w_float\ns, t = 0.2, 7\nloss = lambda wq: 0.5 * np.mean((X @ wq - y) ** 2)\nprint('PTQ:', fake_quant(w_float, s), loss(fake_quant(w_float, s)))  # [.4 .4 .4 .4] 0.0368\n\nw = w_float.copy()                                  # latent weights\nN, eta0 = 300, 0.1\nfor step in range(N):\n    eta = eta0 * (1 - step / N)                     # decay so w settles\n    wq = fake_quant(w, s, t)                        # forward on the grid\n    g = X.T @ (X @ wq - y) / len(y)                 # dL/dŵ\n    g *= np.abs(w / s) &lt;= t                         # STE: 1 inside, 0 if clipped\n    w -= eta * g                                    # update the latent w\nprint('QAT:', fake_quant(w, s), loss(fake_quant(w, s)))  # [.4 .2 .4 .4] 0.0032</code></pre>PTQ rounds all four 0.3x weights up to 0.4 (sum 1.6 vs 1.33); QAT drops one to 0.2 (sum 1.4) and the loss falls about <b>11×</b>. Try a constant lr: the loss flips between values, because weights sitting right at a rounding boundary flip back and forth (a known QAT issue); decaying the lr settles them."}, {"id": "d2", "q": "Recall drill (Lesson 12, due today): write sample_next(logits, T, min_p, rng) in numpy: temperature, softmax, min_p filter, renormalize, sample. Then by hand: logits [4, 1] at T = 1 and T = 3, what's the top token's probability?", "model": "<pre><code>import numpy as np\n\ndef sample_next(logits, T=1.0, min_p=0.0, rng=np.random.default_rng()):\n    z = np.asarray(logits, float) / T            # temperature divides the gaps\n    p = np.exp(z - z.max()); p /= p.sum()        # stable softmax\n    keep = p >= min_p * p.max()                  # min_p: cutoff moves with the top token\n    p = np.where(keep, p, 0.0); p /= p.sum()     # renormalize\n    return rng.choice(len(p), p=p), p</code></pre>Top token: \\(1/(1+e^{-3})\\approx\\)<b>0.953</b> at T = 1, \\(1/(1+e^{-1})\\approx\\)<b>0.731</b> at T = 3. Edge cases interviewers like: subtract the max before exp (overflow), and T → 0 (use argmax instead of dividing by 0)."}, {"id": "d3", "q": "Interview: “What is quantization-aware training, and when would you use it instead of post-training quantization?” Answer in under a minute.", "model": "PTQ rounds a trained model's weights to low-bit integers after training, so the model never sees the rounding error, and at 4 bits that error can cost real accuracy. QAT fine-tunes with <b>fake quantization</b> in the forward pass (quantize then dequantize, so the loss sees exactly the weights we'll ship) and the <b>straight-through estimator</b> in the backward pass (treat rounding as identity so gradients reach the high-precision latent weights). Then we convert to real ints, so the file is identical in size to PTQ, just with better-chosen integers. I'd start with PTQ, evaluate against bf16, and use QAT when 4-bit or lower loses too much, especially for small on-device models. It costs a fine-tuning run; for example, Google's Gemma 3 QAT used about 5k steps distilling from the bf16 model and cut the Q4_0 perplexity drop by about half."}, {"id": "d4", "q": "Your DR Congo project with Jeff: Q4_K_M of a 1.2B model fits the field laptop, but on your eval in the local languages it's clearly worse than bf16, and Q8_0 is too slow. Sketch a QAT plan: what targets would you train on, what hardware do you need, and how do you decide it worked?", "model": "Data: prompts like the field team's (keep it on machines you control, since privacy is the point). Targets: the <b>bf16 model's own output probabilities</b> on those prompts (distillation, as Gemma 3 did), so QAT only learns to survive the rounding, not new behavior. Setup: fake quant with the same bits and group size as the shipped format, STE, a short run (hundreds to a few thousand steps). Hardware: a full QAT fine-tune of 1.2B needs ~19 GB plus activations, so a 24–40 GB GPU, or QAT with LoRA adapters to fit smaller GPUs. Success: on a held-out local-language eval, measure share recovered = (PTQ damage − QAT damage) / PTQ damage on more than one metric, and check the shipped file runs with the same speed as the PTQ one."}], "key": ["qat", "fq", "latent", "ste", "clipt", "qs", "qint", "ptq", "fp16", "bf16", "master", "adam", "grad", "eta"], "sym": {"pi": ["π_θ · policy", "Your LLM with weights θ: a probability for every response / next token."], "piold": ["π_old · sampling policy", "Frozen snapshot of the model that generated the batch."], "x": ["x · prompt (state)", "What the model is conditioned on."], "y": ["y · response (action)", "A generated completion, i.e. a token sequence."], "R": ["R · reward", "Score from a reward function or reward model."], "A": ["A · advantage", "How much better than expected. Positive → more likely, negative → less likely."], "b": ["b · baseline", "Typical reward for this prompt. Subtracting it cuts variance without bias."], "rho": ["ρ · ratio", "π_θ(y|x) / π_old(y|x). 1.5 = now 50% more likely than when sampled."], "eps": ["ε · clip range", "How far ρ may move from 1 before the gradient is cut (typically 0.2)."], "alpha": ["α · learning rate", "Step size of each update."], "mu": ["μ · group mean", "Average reward of the G responses to one prompt: GRPO's baseline."], "sigma": ["σ · group std", "Std of rewards inside one prompt's group (scale_rewards=\"group\")."], "beta": ["β · KL weight", "Penalty for drifting from a reference model. 0 = no reference model."], "H": ["H · entropy", "Average next-token uncertainty of the policy (nats). Lower = more peaked."], "TP": ["TP · true positive", "Actually positive and flagged. A caught case."], "FP": ["FP · false positive", "Actually negative but flagged. A false alarm (type I error)."], "FN": ["FN · false negative", "Actually positive but not flagged. A miss (type II error)."], "TN": ["TN · true negative", "Actually negative and not flagged. Correctly left alone."], "prec": ["P · precision", "TP / (TP + FP). Of everything flagged, the share that is real."], "rec": ["R · recall (TPR, sensitivity)", "TP / (TP + FN). Of all real positives, the share you caught."], "F1": ["F1 score", "Harmonic mean of precision and recall: 2PR / (P + R)."], "thr": ["t · threshold", "Flag if score ≥ t. Raising t → fewer flags → precision up, recall down."], "wS": ["S · substitutions", "Reference word replaced by a different word."], "wD": ["D · deletions", "Reference word missing from the ASR output."], "wI": ["I · insertions", "Extra word in the ASR output that isn't in the reference."], "wN": ["N · reference length", "Number of words in the reference transcript (not the hypothesis)."], "lambda": ["λ · regularization strength", "Weight on the L2/L1 penalty. Bigger λ → stronger shrink / more sparsity."], "sig": ["σ(z) · sigmoid", "1/(1+e^{−z}). Squashes a score to a probability in (0,1)."], "loss": ["L · loss", "Training objective; often −log likelihood under a noise model."], "grad": ["∇L · gradient", "Vector of partial derivatives; direction of steepest ascent of L."], "w": ["w · weights", "Model parameters updated by gradient descent."], "eta": ["η · learning rate", "Step size in w ← w − η∇L. Too big diverges; too small crawls."], "p": ["p · predicted probability", "σ(z) in logistic regression; compared to label y in the gradient (p−y)x."], "surp": ["−log p · surprise", "Cost of an outcome you gave probability p: how many halvings below 1 (bits)."], "Pd": ["P · true distribution", "What really happens: the data or the labels."], "Qd": ["Q · model distribution", "What the model predicts."], "CE": ["H(P,Q) · cross-entropy", "Average surprise when the truth is P and you predict Q. The classification loss."], "HP": ["H(P) · entropy", "Average surprise when you predict with the truth itself. 0 when certain, log K when uniform."], "KL": ["D_KL(P‖Q) · KL divergence", "H(P,Q) − H(P): extra surprise from using Q instead of P. Always ≥ 0, not symmetric."], "yhat": ["ŷ · prediction", "What the model outputs for one example; the truth y misses it by some noise y − ŷ."], "noise": ["σ · noise width", "Standard deviation of the Gaussian noise around the prediction. Doesn't change which model wins."], "mse": ["MSE · mean squared error", "(1/N) Σ (y − ŷ)². The −log likelihood under Gaussian noise, up to constants."], "z": ["z · score (logit)", "w·x (+ b). Any real number; the log-odds ln(p/(1−p))."], "trn": ["train set", "Data gradient descent fits on. Its score can't tell memorizing from learning."], "val": ["validation (dev) set", "Held-out data for every choice: λ, learning rate, epochs, which model."], "tst": ["test set", "Held-out data measured once at the very end. The number you report."], "kf": ["k · folds", "k-fold CV: k trainings, each validated on the one fold it didn't train on."], "leak": ["leakage", "Information the model couldn't have at prediction time reaching training (test data, the future, the label)."], "delta": ["δ · delta", "∂L/∂(node): how much the loss moves per small nudge of that node. Passed backward."], "loraW": ["W · frozen base", "Pretrained weight matrix kept frozen in LoRA; δ still flows through it, but no ∂L/∂W is stored."], "loraA": ["A · LoRA down", "Trainable r × d_in factor. With B forms the low-rank update ΔW = BA."], "loraB": ["B · LoRA up", "Trainable d_out × r factor. Together with A: rank(BA) ≤ r."], "lora_r": ["r · LoRA rank", "Width of the adapter. Capacity of ΔW. Typical 4–64; r ≪ d. GRPO often uses r = 32."], "lora_a": ["α · LoRA alpha", "Strength knob. Effective scale of the adapter is α/r. Often set to r or 2r."], "lora_drop": ["LoRA dropout", "Randomly zeros adapter activations each forward pass; regularizes the update so it doesn't rely on one direction."], "temp": ["T · temperature", "Divides every logit before softmax: p ∝ e^{z/T}. T < 1 sharper, T > 1 flatter, T → 0 greedy."], "topk": ["top-k", "Keep only the k most likely tokens, then renormalize. A fixed count."], "topp": ["top-p (nucleus)", "Keep the fewest top tokens whose probabilities add up to ≥ p, then renormalize. Adapts to how sure the model is."], "minp": ["min_p", "Keep token i only if p_i ≥ p_min · p_max, then renormalize. The cutoff moves with the top token."], "pmax": ["p_max", "Probability of the single most likely token at this step."], "lora_scale": ["α/r · LoRA scale", "Multiplier on BA in the forward pass. Keeps update size stable when you change r."], "fp32": ["fp32 · single precision", "32 bits = 4 bytes: 1 sign, 8 exponent, 23 mantissa. Gap near 1 ≈ 1.2e-7. Used for master weights and optimizer state."], "fp16": ["fp16 · half precision", "16 bits = 2 bytes: 1 sign, 5 exponent, 10 mantissa. Fine ticks (≈ 0.001 near 1) but max 65,504; tiny gradients underflow."], "bf16": ["bf16 · bfloat16", "16 bits = 2 bytes: 1 sign, 8 exponent, 7 mantissa. fp32's range with coarse ticks (≈ 0.008 near 1). Needs Ampere or newer (not a T4)."], "expo": ["exponent bits", "Pick the power of two (the size bucket). More exponent bits → bigger range."], "mant": ["mantissa bits · m", "The fraction digits inside a bucket: 2^m ticks per bucket. More mantissa bits → finer spacing."], "spacing": ["gap (spacing)", "Distance to the next representable number: 2^k / 2^m in [2^k, 2^(k+1)). Anything between ticks is rounded."], "master": ["fp32 master weights", "Full-precision copy of the weights the optimizer updates, so updates smaller than the 16-bit gap aren't lost."], "lscale": ["S · loss scale", "Multiply the loss by S so fp16 gradients stay above underflow; divide by S in fp32 before the update."], "adam": ["AdamW m, v", "Per-weight running averages of the gradient (m) and squared gradient (v), kept in fp32: 8 bytes per trainable param."], "qs": ["s · scale", "Tick spacing of the quantization ruler: s = max|w| / (ticks per side). One per tensor, or one per group."], "qint": ["q · quantized integer", "round(w / s), stored in b bits: int8 holds −127…127, int4 holds −7…7."], "qhat": ["ŵ · dequantized weight", "q · s, what the model actually computes with. Off from w by at most s / 2."], "grp": ["g · group size", "How many consecutive weights share one scale (often 32–128). Smaller g fits better but stores more scales."], "bpw": ["bits per weight", "b + 16 / g: the integer bits plus each group's 16-bit scale spread over its g weights."], "ptq": ["PTQ · post-training quantization", "Quantize an already-trained model: compute scales, round, store. No retraining (vs QAT, which trains with the rounding)."], "fq": ["ŵ · fake-quantized weight", "s · clip(round(w / s), −t, t): quantize then dequantize in one go. A float that can only sit on the int grid; the forward pass uses it."], "latent": ["w · latent weight", "The high-precision weight QAT actually updates. Never used directly in the forward pass; it's rounded to ŵ first."], "ste": ["STE · straight-through estimator", "In the backward pass, treat round() as if it were the identity: dŵ/dw ≈ 1 inside the range, 0 where clipped."], "qat": ["QAT · quantization-aware training", "Fine-tune with fake quantization in the forward pass and STE in the backward pass, then really quantize. Same file as PTQ, better integers."], "clipt": ["t · largest integer", "Ends of the integer grid: q is clipped to −t … t (t = 7 for int4, 127 for int8)."]}, "macros": {"\\pit": ["pi", "\\pi_\\theta"], "\\piold": ["piold", "\\pi_{\\text{old}}"], "\\X": ["x", "x"], "\\Y": ["y", "y"], "\\Rw": ["R", "R"], "\\Adv": ["A", "A"], "\\bb": ["b", "b"], "\\rr": ["rho", "\\rho"], "\\eps": ["eps", "\\epsilon"], "\\lr": ["alpha", "\\alpha"], "\\gmu": ["mu", "\\mu"], "\\gsig": ["sigma", "\\sigma"], "\\bt": ["beta", "\\beta"], "\\Hent": ["H", "H"], "\\th": ["pi", "\\theta"], "\\grad": [null, "\\nabla_\\theta"], "\\E": [null, "\\mathbb{E}"], "\\TP": ["TP", "TP"], "\\FP": ["FP", "FP"], "\\FN": ["FN", "FN"], "\\TN": ["TN", "TN"], "\\Prec": ["prec", "P"], "\\Rec": ["rec", "R"], "\\Fone": ["F1", "F_1"], "\\thr": ["thr", "t"], "\\Sw": ["wS", "S"], "\\Dw": ["wD", "D"], "\\Iw": ["wI", "I"], "\\Nw": ["wN", "N"]}, "chapters": [{"title": "Opening recall: fp16 vs bf16, and training memory", "short": "Recall", "video": "media/ch1-recall.mp4", "poster": "media/ch1-recall-poster.jpg", "steps": [{"key": "formats", "title": "Lesson 13 · fp16 vs bf16: range vs spacing", "html": "Exponent bits buy <b>range</b>, mantissa bits buy <b>spacing</b>. fp16 (5 exponent, 10 mantissa): fine ticks (gap ≈ 0.001 near 1) but max 65,504, and tiny gradients underflow, so it needs loss scaling. bf16 (8 exponent, 7 mantissa): fp32's range but coarse ticks (≈ 0.0078 near 1), so a tiny update to a weight of 1.0 vanishes unless you keep fp32 master weights.", "start": 0.7, "end": 10.0}, {"key": "memory", "title": "Lesson 13 · memory math", "html": "GB = params (billions) × bytes per param. Serving in bf16: 2 bytes → 2.4 GB for LFM2-1.2B. Full fine-tune with AdamW: bf16 weights 2 + bf16 grads 2 + fp32 master 4 + Adam m 4 + Adam v 4 = <b>16 bytes/param</b> → 19.2 GB, too big for a 16 GB T4 (before activations).", "start": 10.0, "end": 19.8}, {"key": "bridge", "title": "Bridge to today", "html": "Lesson 14's PTQ rounds after training: each weight moves up to \\(s/2\\), and the model never saw that error. At 4 bits the ruler is about 18× coarser than at 8 bits, so the damage shows. Today: let training <i>see</i> the rounding. That's <b>quantization-aware training (QAT)</b>, and since it's a fine-tune, it pays the training memory you just recalled.", "start": 19.8, "end": 28.8}], "check": {"id": "c1", "q": "(a) You're training on a T4 (no bf16). Which format do you use, and what two tricks keep it from breaking? (b) LFM2-2.6B: GB to serve in bf16, and GB to fully fine-tune with AdamW?", "model": "(a) <b>fp16 mixed precision</b>: fp16 math with <b>loss scaling</b> (multiply the loss so small gradients don't underflow, unscale in fp32 before the update) and <b>fp32 master weights</b> (so small updates aren't rounded away). In PyTorch: autocast + GradScaler. (b) Serve: \\(2.6\\times2=\\)<b>5.2 GB</b>. Full AdamW: \\(2.6\\times16=\\)<b>41.6 GB</b>."}, "hook": {"id": "h1", "q": "From memory (Lesson 13). (a) An activation of 70,000 and a gradient of 1e-8: which of fp16 / bf16 breaks on each, and how? (b) In bf16, what is 1.0 + 0.001, and why? (c) LFM2-1.2B: how many GB to serve it in bf16, and roughly how many GB to fully fine-tune it with AdamW? Does that fit a 16 GB T4?", "model": "(a) <b>fp16</b> breaks on both: its max is 65,504, so 70,000 overflows to inf, and 1e-8 is below its smallest number (≈ 6e-8), so it underflows to 0. <b>bf16</b> has fp32's range, so both are fine. (b) <b>1.0</b>: bf16 has only 7 mantissa bits, so the gap near 1 is \\(2^{-7}\\approx0.0078\\) and +0.001 is less than half a gap → rounds back. (c) Serve: \\(1.2\\times2=\\)<b>2.4 GB</b>. Full AdamW: 2 + 2 + 4 + 4 + 4 = 16 bytes/param → \\(1.2\\times16=\\)<b>19.2 GB</b>, which doesn't fit a 16 GB T4."}, "duration": 28.8}, {"title": "Fake quantization: the rounding goes inside training", "short": "Fake quant", "video": "media/ch2-fake-quant.mp4", "poster": "media/ch2-fake-quant-poster.jpg", "steps": [{"key": "why", "title": "Why PTQ loses: each weight is rounded alone", "html": "PTQ rounds after training, weight by weight. In the toy, both 0.33s become 0.4 and the errors <i>add up</i> (0.8 vs 0.66), while the pair 0.4 + 0.2 would have been much better (0.6). In a real model, millions of weights each round on their own, and nobody checks whether the errors pile up. The model never got a say.", "start": 0.7, "end": 12.3}, {"key": "formula", "title": "Fake quantization: where the formula comes from", "html": "$$\\hat w=s\\cdot\\mathrm{clip}\\!\\left(\\mathrm{round}\\!\\left(\\frac{w}{s}\\right),-t,\\,t\\right)$$ It's Lesson 14's two lines glued together: \\(q=\\mathrm{round}(w/s)\\), then \\(\\hat w=q\\cdot s\\). The clip to \\(-t\\ldots t\\) (\\(t=7\\) for int4) is what real int4 storage would do. It's called <b>fake</b> because \\(\\hat w\\) stays a float, but it can only land on the grid the deployed model will use. The forward pass uses \\(\\hat w\\), so the loss measures the <i>quantized</i> model. The float \\(w\\) is kept as a hidden <b>latent weight</b>, like Lesson 13's fp32 master copy.", "start": 12.3, "end": 22.75}, {"key": "ex1", "title": "Worked example 1: the toy, fake-quantized", "html": "\\(w=(0.33,\\,0.33)\\), \\(s=0.2\\), \\(t=7\\). \\(w/s=1.65\\) → round → 2 (inside −7…7, no clip) → \\(\\hat w=0.4\\) for both. \\(\\hat y=0.8\\), loss \\(=\\tfrac12(0.8-0.66)^2=\\)<b>0.0098</b>. PTQ never saw this number: the float model's loss was 0. Now training can react: if it nudges \\(w_2\\) below 0.3, \\(\\hat w_2=0.2\\), \\(\\hat y=0.6\\), loss \\(=\\tfrac12(0.06)^2=\\)<b>0.0018</b>.", "start": 22.75, "end": 32.55}, {"key": "ex2", "title": "Worked example 2 (edge case): past the grid's end", "html": "\\(w=1.55\\), \\(s=0.2\\), \\(t=7\\): \\(w/s=7.75\\) → round → 8 → <b>clip</b> → 7 → \\(\\hat w=1.4\\). Error 0.15, bigger than \\(s/2=0.1\\): the “error ≤ s/2” promise only holds <i>inside</i> the range. Same on the negative side: \\(-1.62\\) → \\(-8.1\\) → \\(-8\\) → clip to \\(-7\\) → \\(-1.4\\). Order matters: round first, then clip.", "start": 32.55, "end": 42.35}, {"key": "faded", "title": "Your turn: one weight", "html": "\\(s=0.2,\\ t=7\\). \\(w=-0.47\\): \\(w/s=-2.35\\) → round → \\(-2\\) → \\(\\hat w=\\)? <details><summary>Check your last step</summary>\\(\\hat w=0.2\\times(-2)=\\)<b>−0.4</b> (error 0.07 ≤ 0.1 ✓).</details>", "start": 42.35, "end": 49.65}], "check": {"id": "c2", "q": "\\(s=0.1,\\ t=7\\). (a) Fake-quantize \\(w=[0.26,\\,-0.84,\\,0.93]\\): give \\(w/s\\), the rounded and clipped integers, and \\(\\hat w\\). (b) With \\(x=(1,1,1)\\) and target 0.35 (the float model's exact output), what is the fake-quant output and the loss \\(\\tfrac12(\\hat y-y)^2\\)?", "model": "(a) \\(w/s=[2.6,\\,-8.4,\\,9.3]\\) → round \\([3,\\,-8,\\,9]\\) → clip \\([3,\\,-7,\\,7]\\) → \\(\\hat w=\\)<b>[0.3, −0.7, 0.7]</b>. Two weights got clipped. (b) \\(\\hat y=0.3-0.7+0.7=\\)<b>0.3</b> (float: 0.26 − 0.84 + 0.93 = 0.35). Loss \\(=\\tfrac12(0.05)^2=\\)<b>0.00125</b>. The two clips happened to almost cancel; training with fake quant would see this loss and adjust."}, "hook": {"id": "h2", "q": "A toy model \\(\\hat y=w_1x_1+w_2x_2\\) is trained to \\(w_1=w_2=0.33\\), so with \\(x=(1,1)\\) it outputs exactly the target 0.66. Now both weights must live on an int4 grid with \\(s=0.2\\) (allowed values …, 0.2, 0.4, 0.6, …). (a) PTQ rounds each weight to the nearest grid value. What's the output, and how far off is it? (b) If you could pick any grid values for the two weights, what's the best output? (c) What does that suggest about how to train?", "model": "(a) Both round to 0.4 → output <b>0.8</b>, off by <b>0.14</b>. (b) One weight 0.4 and the other 0.2 → <b>0.6</b>, off by only <b>0.06</b> (sums can only be multiples of 0.2, and 0.6 is the closest to 0.66). (c) Rounding each weight alone ignores how weights work together. If training could <b>see the rounded weights</b>, it could pick a combination of grid values that works, which is exactly what QAT does."}, "duration": 49.65}, {"title": "The straight-through estimator: how a staircase learns", "short": "STE", "video": "media/ch3-ste.mp4", "poster": "media/ch3-ste-poster.jpg", "steps": [{"key": "stair", "title": "The problem: a staircase has no slope", "html": "Rounding turns \\(w\\mapsto\\hat w\\) into a staircase. The chain rule says \\(\\dfrac{dL}{dw}=\\dfrac{dL}{d\\hat w}\\cdot\\dfrac{d\\hat w}{dw}\\), and on every flat step \\(d\\hat w/dw=0\\). So the true gradient is 0 everywhere it exists, and gradient descent would never move \\(w\\).", "start": 0.7, "end": 13.1}, {"key": "ste", "title": "The fix: STE, and why it's fair", "html": "<b>Forward</b>: use the real staircase, so the loss is honest. <b>Backward</b>: pretend the staircase is the line \\(\\hat w=w\\), so \\(d\\hat w/dw\\approx1\\) inside the range (0 where clipped). Why that's fair: the stairs never stray more than \\(s/2\\) from that line, so on average they rise with slope 1. The small gradient steps pile up in the high-precision latent \\(w\\) until it crosses a jump, and then \\(\\hat w\\) snaps to the next grid value.", "start": 13.1, "end": 28.2}, {"key": "ex1", "title": "Worked example 1: three STE steps", "html": "\\(\\hat y=\\hat w\\,x\\), \\(x=2\\), target \\(y=1.2\\), \\(s=0.2\\), \\(\\eta=0.1\\), \\(L=\\tfrac12(\\hat y-y)^2\\). Start \\(w=0.33\\): \\(\\hat w=0.4\\) (1.65 → 2), \\(\\hat y=0.8\\), \\(L=\\tfrac12(0.4)^2=0.08\\). Backward: \\(dL/d\\hat y=\\hat y-y=-0.4\\); \\(dL/d\\hat w=-0.4\\times x=-0.8\\); STE → \\(dL/dw=-0.8\\). <b>Step 1:</b> \\(w=0.33+0.1\\times0.8=0.41\\) → 2.05 → 2 → \\(\\hat w\\) still 0.4. <b>Step 2:</b> same gradient → \\(w=0.49\\) → 2.45 → 2 → still 0.4. <b>Step 3:</b> \\(w=0.57\\) → 2.85 → 3 → \\(\\hat w=0.6\\), \\(\\hat y=1.2\\), \\(L=0\\) ✓. The latent weight crept across the jump at 0.5.", "start": 28.2, "end": 38.0}, {"key": "ex2", "title": "Worked example 2 (edge cases): no STE, and a clipped weight", "html": "Same start with the <i>true</i> gradient: \\(d\\hat w/dw=0\\) → \\(dL/dw=0\\) → \\(w\\) stays 0.33 forever and the loss stays 0.08. Clipped weight: \\(w=1.55\\), \\(s=0.2\\), \\(t=7\\) → \\(\\hat w=1.4\\). The clip is flat out there too, so STE passes <b>0</b> for this weight: it stops being pushed further past the grid's end. STE = slope 1 inside the range, 0 outside.", "start": 38.0, "end": 47.8}, {"key": "faded", "title": "Your turn: one STE step", "html": "\\(x=1\\), target 0.6, \\(s=0.2\\), \\(\\eta=0.5\\). \\(w=0.25\\) → 1.25 → 1 → \\(\\hat w=0.2\\), \\(\\hat y=0.2\\). \\(dL/d\\hat y=-0.4\\); STE: \\(dL/dw=-0.4\\). New \\(w=0.25+0.5\\times0.4=0.45\\) → \\(0.45/0.2=2.25\\) → \\(\\hat w=\\)? <details><summary>Check your last step</summary>round(2.25) = 2 → \\(\\hat w=\\)<b>0.4</b>, \\(\\hat y=0.4\\) (closer to 0.6, loss 0.08 → 0.02).</details>", "start": 47.8, "end": 56.3}], "check": {"id": "c3", "q": "\\(\\hat y=\\hat w\\,x\\), \\(x=1\\), target 1.0, \\(s=0.2\\), \\(\\eta=0.5\\), \\(L=\\tfrac12(\\hat y-y)^2\\). (a) Start at \\(w=0.62\\). Do one STE step: give \\(\\hat w\\), \\(\\hat y\\), the gradient, the new \\(w\\), and the new \\(\\hat w\\). (b) What would \\(w\\) be after the step with the true gradient instead? (c) If \\(w\\) were 1.6 (with \\(t=7\\)), what gradient does STE pass to it?", "model": "(a) \\(0.62/0.2=3.1\\) → 3 → \\(\\hat w=0.6\\), \\(\\hat y=0.6\\). \\(dL/d\\hat y=-0.4\\), \\(dL/d\\hat w=-0.4\\times1=-0.4\\), STE → \\(dL/dw=-0.4\\). New \\(w=0.62+0.5\\times0.4=\\)<b>0.82</b> → 4.1 → 4 → \\(\\hat w=\\)<b>0.8</b>, \\(\\hat y=0.8\\). (b) <b>0.62</b>: the true gradient through round is 0, so nothing moves. (c) <b>0</b>: \\(1.6/0.2=8\\) is past \\(t=7\\), so it's clipped and the clip is flat."}, "hook": {"id": "h3", "q": "Sketch \\(\\hat w=s\\cdot\\mathrm{round}(w/s)\\) as a function of \\(w\\) (with \\(s=0.2\\)). (a) What is \\(d\\hat w/dw\\) almost everywhere? (b) By the chain rule \\(dL/dw=dL/d\\hat w\\cdot d\\hat w/dw\\). What would gradient descent then do to \\(w\\)? (c) Propose a fix.", "model": "(a) A <b>staircase</b>: flat steps with jumps, so \\(d\\hat w/dw=\\)<b>0</b> on every step (undefined at the jumps). (b) \\(dL/dw=0\\) → \\(w\\) <b>never moves</b>; training is stuck. (c) In the backward pass, <b>pretend</b> the rounding isn't there (\\(d\\hat w/dw\\approx1\\)), so the gradient flows “straight through” to \\(w\\). That's the <b>straight-through estimator (STE)</b>. Where \\(w\\) is clipped, pass 0."}, "duration": 56.3}, {"title": "PTQ or QAT? What it buys, what it costs", "short": "PTQ vs QAT", "video": "media/ch4-ptq-vs-qat.mp4", "poster": "media/ch4-ptq-vs-qat-poster.jpg", "steps": [{"key": "bridge", "title": "Recap: the two pieces from today", "html": "Forward: fake-quantize, \\(\\hat w=s\\cdot\\mathrm{clip}(\\mathrm{round}(w/s),-t,t)\\), so the loss is honest. Backward: STE, \\(d\\hat w/dw\\approx1\\) inside the range, so the latent \\(w\\) keeps learning. The latent weights stay in high precision the whole time. Now put them into a real recipe.", "start": 0.7, "end": 7.6}, {"key": "recipe", "title": "The QAT recipe", "html": "(1) Start from the trained bf16 checkpoint: QAT is a short <b>fine-tune</b>, not pretraining. (2) <b>Prepare</b>: insert fake quant into the linear layers with the <i>same</i> bits and group size as the format you'll ship. (3) Fine-tune briefly with STE. Google's Gemma 3 QAT used about 5,000 steps, with the bf16 model's own probabilities as targets (distillation). (4) <b>Convert</b>: really quantize the latent weights into ints + scales. In PyTorch torchao this is <code>quantize_(model, QATConfig(base_config, step=&quot;prepare&quot;))</code>, train, then the same call with <code>step=&quot;convert&quot;</code>. The result is a normal int4 model, a drop-in replacement for the PTQ one.", "start": 7.6, "end": 17.4}, {"key": "ex1", "title": "Worked example 1: what QAT won back (higher is better)", "html": "torchtune's Llama3-8B QAT tutorial (int4 weights + int8 activations), HellaSwag: bf16 76.10, PTQ 73.90, QAT 75.36. <b>Where the formula comes from:</b> the damage is the distance from bf16, and we ask what fraction of PTQ's damage QAT removed: $$\\text{share recovered}=\\frac{\\text{PTQ damage}-\\text{QAT damage}}{\\text{PTQ damage}}$$ PTQ damage \\(=76.10-73.90=2.20\\); QAT damage \\(=76.10-75.36=0.74\\); share \\(=1.46/2.20\\approx\\)<b>66%</b>.", "start": 17.4, "end": 26.0}, {"key": "ex2", "title": "Worked example 2 (edge case): lower is better", "html": "Same models, WikiText perplexity (lower is better): bf16 8.73, PTQ 10.77, QAT 9.91. Now the damage is an <i>increase</i>: PTQ +2.05, QAT +1.19. Share \\(=(2.05-1.19)/2.05\\approx\\)<b>42%</b>. Same models, different metric, different share, so report both. If QAT ended up worse than PTQ, the share would be negative. (Google reports a 54% smaller perplexity drop for Gemma 3 at Q4_0.)", "start": 26.0, "end": 35.8}, {"key": "cost", "title": "What it costs, and when to bother", "html": "PTQ: no training, minutes, only the weights in memory. QAT: a fine-tune. Latent bf16 weights + grads + AdamW ≈ 16 bytes/param → LFM2-1.2B needs ~19.2 GB, too much for a 16 GB T4 (options: QAT with LoRA adapters, or a bigger GPU). The final file is the <b>same size</b> either way (Q4_0: \\(1.2\\times4.5/8\\approx0.68\\) GB). Rule of thumb: run PTQ first and check your own eval. Reach for QAT when PTQ at your target bits (usually 4-bit or lower, and especially on small models) loses too much, and the model ships to many devices, so the one-off training cost is worth it. At 8 bits it's rarely needed.", "start": 35.8, "end": 45.6}, {"key": "faded", "title": "Your turn: made-up numbers", "html": "bf16 70.0, PTQ 64.0, QAT 68.5 (illustrative, not real). PTQ damage 6.0, QAT damage 1.5. Share recovered \\(=(6.0-1.5)/6.0=\\)? <details><summary>Check your last step</summary>4.5 / 6.0 = <b>75%</b>.</details>", "start": 45.6, "end": 54.1}], "check": {"id": "c4", "q": "(a) Made-up perplexities: bf16 12.0, PTQ int4 14.0, QAT int4 12.5. What share of the damage did QAT recover? (b) LFM2-2.6B: roughly how much GPU memory for a full QAT fine-tune with AdamW, and how big is the final Q4_0 file (4.5 bits/weight)? How big would the PTQ Q4_0 file be? (c) In one sentence: when would you skip QAT?", "model": "(a) Damage: PTQ \\(+2.0\\), QAT \\(+0.5\\) → \\((2.0-0.5)/2.0=\\)<b>75%</b>. (b) Training: \\(2.6\\times16\\approx\\)<b>41.6 GB</b> (plus activations). File: \\(2.6\\times4.5/8\\approx\\)<b>1.46 GB</b>, the <b>same</b> for PTQ. (c) When PTQ at your target bits already matches bf16 on your own eval (typical at 8 bits), or you can't afford a fine-tune."}, "hook": {"id": "h4", "q": "Llama3-8B, int4 weights. HellaSwag: bf16 76.10, PTQ 73.90, QAT 75.36. (a) What share of the quantization damage did QAT win back? (b) Is the QAT int4 file bigger, smaller or the same size as the PTQ int4 file? (c) What does QAT cost that PTQ doesn't?", "model": "(a) Damage = bf16 − quantized: PTQ 2.20, QAT 0.74. Share recovered \\(=(2.20-0.74)/2.20\\approx\\)<b>66%</b>. (b) <b>The same.</b> QAT ends in the same int4 format; it only picks better integers. (c) A <b>training run</b>: data, GPU time, and fine-tuning memory (latent weights + grads + AdamW ≈ 16 bytes/param, so ~19.2 GB for a 1.2B model). PTQ takes minutes and only needs the weights."}, "duration": 54.1}], "summary": ["PTQ rounds each weight on its own after training, so errors that could cancel just pile up. QAT puts <b>fake quantization</b> in the forward pass, \\(\\hat w=s\\cdot\\mathrm{clip}(\\mathrm{round}(w/s),-t,t)\\), so the loss measures the model you'll actually ship. Clipping can cost more than \\(s/2\\).", "Rounding is a staircase with zero slope, so the true gradient never moves \\(w\\). The <b>straight-through estimator</b> treats rounding as the identity in the backward pass (slope 1 inside the range, 0 where clipped). Small steps pile up in the high-precision latent \\(w\\) until \\(\\hat w\\) snaps to the next grid value.", "Recipe: start from bf16 → prepare (fake quant, same bits/groups as the target) → short fine-tune (Gemma 3: ~5k steps distilling from bf16) → convert. Same file size as PTQ; costs a training run (~16 bytes/param with AdamW). Share recovered = (PTQ damage − QAT damage) / PTQ damage (≈ 66% on HellaSwag, 42% on perplexity in torchtune's Llama3-8B example). PTQ first; QAT when ≤ 4-bit loses too much."]};

function introHTML(){return `<div class="card narrow"><p class="eyebrow">${LESSON.title.split("·")[0].trim()}</p><h1>${LESSON.h1}</h1><p class="muted">${LESSON.sub}</p>

function chapterHTML(c,ci){const n=ci+1;return `

function drillHTML(){return `<div class="card roomy"><p class="eyebrow">Interview drill</p><h2>Rapid questions</h2><p class="muted">Write each answer before you reveal it, as you would on paper.</p>

$("#screens").innerHTML=SCR.map((s,i)=>`<section class="screen" data-scr="${i}" id="s${i}">${s.type==="intro"?introHTML():s.type==="ch"?chapterHTML(CH[s.ci],s.ci):s.type==="drill"?drillHTML():revisitHTML()}</section>`).join("");
$("#pills").innerHTML=SCR.map((s,i)=>`<span class="pill" data-go="${i}" title="${s.type==="ch"?CH[s.ci].title:s.type}">${s.type==="intro"?"⌂":s.type==="ch"?s.ci+1:s.type==="drill"?"⚡":"✓"}</span>`).join("");

function refresh(){
  $$("[data-cmp]").forEach(el=>{const q=el.dataset.cmp,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    const r=store.get(q,"rating");el.querySelectorAll(".rate button").forEach(b=>b.classList.toggle("on",b.dataset.r===r));});
  $$("[data-cmpro]").forEach(el=>{const q=el.dataset.cmpro,a=store.get(q,"answer").trim(),p=el.querySelector(".mine p");p.textContent=a||"(no answer typed yet)";p.classList.toggle("empty",!a);
    el.querySelector(".rv").textContent={got:"Got it",partly:"Partly",missed:"Missed"}[store.get(q,"rating")]||"not rated";const n=store.get(q,"note").trim();el.querySelector(".revnote").textContent=n?"Unclear: "+n:"";});}
document.addEventListener("input",e=>{const t=e.target,q=t.dataset&&(t.dataset.ans||t.dataset.note);if(!q)return;const f=t.dataset.ans?"answer":"note";store.set(q,f,t.value);

$$("textarea[data-ans]").forEach(t=>{t.value=store.get(t.dataset.ans,"answer");if(t.value)$$(`[data-saved="${t.dataset.ans}"]`).forEach(s=>s.textContent="saved ✓");});
$$("textarea[data-note]").forEach(t=>t.value=store.get(t.dataset.note,"note"));

// ---------- state ----------
const S=CH.map((c,ci)=>({phase:+(store.get("ch"+ci,"phase")||0),cur:-1,done:new Set(JSON.parse(store.get("ch"+ci,"done")||"[]"))}));
let scr=0, speed=+(localStorage.getItem("lap:speed")||1), stopAt=null, raf=null;
const vid=ci=>document.getElementById("v"+ci);
const saveCh=ci=>{store.set("ch"+ci,"phase",S[ci].phase);store.set("ch"+ci,"done",JSON.stringify([...S[ci].done]));};
// Videos: attach a source only while their chapter is on screen in the Learn phase; otherwise paused and unloaded.
function loadVid(ci){const v=vid(ci);if(!v.getAttribute("src")){v.poster=v.dataset.poster;v.preload="auto";v.src=v.dataset.src;v.playbackRate=speed;}}
function unloadVid(ci){const v=vid(ci);if(v.getAttribute("src")){v.pause();v.removeAttribute("src");v.removeAttribute("poster");v.preload="none";v.load();}}
function syncVideos(){cancelAnimationFrame(raf);const cur=SCR[scr];CH.forEach((_,ci)=>{if(cur.type==="ch"&&cur.ci===ci&&S[ci].phase===1)loadVid(ci);else unloadVid(ci);});if(!(cur.type==="ch"&&S[cur.ci].phase===1))stopAt=null;}
function units(ci){const c=CH[ci],s=S[ci];return (s.phase>0?1:0)+s.done.size+(s.phase>=2?1:0)+(store.get(c.check.id,"revealed")?1:0);}
function render(){const cur=SCR[scr];
  $$(".screen").forEach((el,i)=>el.classList.toggle("on",i===scr));
  CH.forEach((c,ci)=>{const st=S[ci];$$(`#s${ci+1} .phase`).forEach(p=>p.classList.toggle("on",+p.dataset.ph===st.phase));
    $$(`li[data-ci="${ci}"]`).forEach(li=>{const si=+li.dataset.si;li.classList.toggle("active",si===st.cur);li.classList.toggle("done",st.done.has(si));});
    const nb=document.getElementById("nb"+ci);nb.textContent=st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →";});
  $$(".pill").forEach((p,i)=>{p.classList.toggle("on",i===scr);const s=SCR[i];p.classList.toggle("done",s.type==="ch"&&units(s.ci)===CH[s.ci].steps.length+3);});
  const tot=CH.reduce((a,c)=>a+c.steps.length+3,0),got=CH.reduce((a,c,ci)=>a+units(ci),0);$("#bar").style.width=(100*got/tot)+"%";
  $("#phases").innerHTML=cur.type==="ch"?PH.map((p,i)=>`<span class="${i===S[cur.ci].phase?"on":i<S[cur.ci].phase?"done":""}">${i+1} ${p}</span>`).join(""):`<span class="on">${cur.type==="intro"?"Overview":cur.type==="drill"?"Interview drill":"Revisit"}</span>`;
  $("#back").disabled=scr===0;$("#fwd").textContent=fwdLabel();$("#fwd").disabled=scr===SCR.length-1;}
function fwdLabel(){const cur=SCR[scr];if(cur.type!=="ch")return scr===SCR.length-1?"Done":SCR[scr+1].type==="ch"?`Chapter ${SCR[scr+1].ci+1} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →";
  const st=S[cur.ci],c=CH[cur.ci];return st.phase===0?"Start chapter ▶":st.phase===1?(st.cur<0?"▶ Play step 1":st.cur<c.steps.length-1?`Next step ${st.cur+2} →`:"Compare →"):st.phase===2?"Practice →":(scr+1<SCR.length&&SCR[scr+1].type==="ch"?`Chapter ${cur.ci+2} →`:SCR[scr+1].type==="drill"?"Interview drill →":"Revisit answers →");}
function go(i){i=Math.max(0,Math.min(SCR.length-1,i));scr=i;localStorage.setItem(K("nav","screen"),i);history.replaceState(null,"","#"+(SCR[i].type==="ch"?"ch"+(SCR[i].ci+1):SCR[i].type));syncVideos();render();window.scrollTo(0,0);}
function setPhase(ci,ph){S[ci].phase=ph;if(ph!==1)S[ci].cur=Math.min(S[ci].cur,CH[ci].steps.length-1);saveCh(ci);syncVideos();render();window.scrollTo(0,0);}
// ---------- player ----------
function setSpeed(s){speed=s;localStorage.setItem("lap:speed",s);$$(".speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s));CH.forEach((_,ci)=>vid(ci).playbackRate=s);}
function playStep(ci,si){const c=CH[ci],s=c.steps[si];if(SCR[scr].ci!==ci||S[ci].phase!==1)return;loadVid(ci);const v=vid(ci);S[ci].cur=si;
  cancelAnimationFrame(raf);stopAt={ci,si,t:s.end-0.1};v.playbackRate=speed;
  const goPlay=()=>{v.currentTime=s.start+0.01;v.play().catch(()=>{});};
  if(v.readyState>=1)goPlay();else v.addEventListener("loadedmetadata",goPlay,{once:true});
  document.getElementById("st"+ci).textContent=`Step ${si+1} of ${c.steps.length} · playing`;render();
  const li=$(`li[data-ci="${ci}"][data-si="${si}"]`),ol=li.parentElement;  // scroll only the step list, never the page
  if(li.offsetTop<ol.scrollTop||li.offsetTop+li.offsetHeight>ol.scrollTop+ol.clientHeight)ol.scrollTop=li.offsetTop-8;tick();}
function tick(){raf=requestAnimationFrame(()=>{if(!stopAt)return;const {ci,si,t}=stopAt,v=vid(ci),s=CH[ci].steps[si];
  document.getElementById("sb"+ci).style.width=(100*Math.max(0,Math.min(1,(v.currentTime-s.start)/(s.end-s.start))))+"%";
  if(v.currentTime>=t){v.pause();stopAt=null;S[ci].done.add(si);saveCh(ci);document.getElementById("st"+ci).textContent=`Step ${si+1} of ${CH[ci].steps.length} · paused`;document.getElementById("sb"+ci).style.width="100%";render();return;}
  tick();});}
function forward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr+1);const ci=cur.ci,st=S[ci],c=CH[ci];

  if(st.phase===2)return setPhase(ci,3);

function backward(){const cur=SCR[scr];if(cur.type!=="ch")return go(scr-1);const ci=cur.ci,st=S[ci];
  if(st.phase===0)return go(scr-1);
  if(st.phase===1){if(st.cur>0)return playStep(ci,st.cur-1);return setPhase(ci,0);}
  if(st.phase===2){setPhase(ci,1);return playStep(ci,CH[ci].steps.length-1);}
  setPhase(ci,2);}
function replay(){const cur=SCR[scr];if(cur.type==="ch"&&S[cur.ci].phase===1)playStep(cur.ci,Math.max(0,S[cur.ci].cur));}
function report(){const strip=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim();};const lab={got:"Got it",partly:"Partly",missed:"Missed"};
  const lines=REV.filter(([q])=>["partly","missed"].includes(store.get(q.id,"rating"))||store.get(q.id,"note").trim()).map(([q,l])=>`- ${l} [${lab[store.get(q.id,"rating")]||"not rated"}]: ${strip(q.q).slice(0,160)}${store.get(q.id,"note").trim()?"\n  Unclear: "+store.get(q.id,"note").trim():""}`);
  const rated=REV.filter(([q])=>store.get(q.id,"rating")).length;
  return `${LESSON.title}\nRated ${rated} of ${REV.length} questions. Shaky or unclear:\n${lines.length?lines.join("\n"):"- nothing, everything rated Got it"}`;}
document.addEventListener("click",e=>{const t=e.target;
  if(t.id==="copyrep"){const txt=report(),ta=$("#reptext");ta.value=txt;ta.hidden=false;ta.select();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>$("#copied").textContent="copied ✓ paste it in chat").catch(()=>{try{document.execCommand("copy");$("#copied").textContent="copied ✓";}catch(_){$("#copied").textContent="select the text below and copy it";}});return;}
  const g=t.closest("[data-go]");if(g){go(+g.dataset.go);return;}
  const stt=t.closest("[data-start]");if(stt){const ci=+stt.dataset.start;setPhase(ci,1);playStep(ci,0);return;}
  const rv=t.closest("[data-reveal]");if(rv){const q=rv.dataset.reveal;store.set(q,"revealed","1");showReveal(q);render();return;}
  const rb=t.closest(".rate button");if(rb){const q=rb.closest("[data-cmp]").dataset.cmp;store.set(q,"rating",rb.dataset.r);refresh();return;}
  if(t.closest("details"))return;
  const li=t.closest("ol.steps li");if(li){playStep(+li.dataset.ci,+li.dataset.si);return;}
  const a=t.closest("[data-act]");if(a){const ci=SCR[scr].ci;({next:forward,prev:backward,replay})[a.dataset.act]();return;}
  const sp=t.closest(".speed button");if(sp){setSpeed(+sp.dataset.s);return;}
  if(t.id==="fwd")return forward();if(t.id==="back")return backward();
  const v=t.closest("video");if(v){const ci=+v.id.slice(1),st=S[ci],s=CH[ci].steps[st.cur];if(!v.paused){v.pause();stopAt=null;}else if(s&&v.currentTime<s.end-0.1&&v.currentTime>=s.start){stopAt={ci,si:st.cur,t:s.end-0.1};v.play();tick();}else replay();}});
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("textarea,input"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();forward();}else if(e.key==="ArrowLeft"){e.preventDefault();backward();}else if(e.key==="r"||e.key==="R"){e.preventDefault();replay();}});
// ---------- tooltips ----------
const tip=$("#tip"),keyOf=el=>el.dataset.k||([...el.classList].find(c=>c.startsWith("k-"))||"").slice(2);
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest(".sym");if(!el)return;const d=LESSON.sym[keyOf(el)];if(!d)return;tip.innerHTML=`<b>${d[0]}</b>${d[1]}`;tip.style.opacity=1;$$(".k-"+keyOf(el)+".sym").forEach(s=>s.classList.add("hl"));});
document.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+18)+"px";});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".sym")){tip.style.opacity=0;$$(".hl").forEach(s=>s.classList.remove("hl"));}});

setSpeed(speed);
(function(){const h=location.hash.slice(1);let i=SCR.findIndex(s=>(s.type==="ch"?"ch"+(s.ci+1):s.type)===h);if(i<0)i=+(localStorage.getItem(K("nav","screen"))||0);if(!(i>=0&&i<SCR.length))i=0;go(i);})();
window.addEventListener("load",()=>{const sym=(k,t)=>"\\htmlClass{sym k-"+k+"}{"+t+"}";const M={};Object.entries(LESSON.macros).forEach(([m,[k,t]])=>M[m]=k?sym(k,t):t);
  if(window.renderMathInElement)renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],macros:M,trust:c=>c.command==="\\htmlClass",strict:"ignore",throwOnError:false});
  else document.body.insertAdjacentHTML("afterbegin",'<div style="background:#3b1d24;padding:8px;text-align:center">Formulas need internet (KaTeX CDN).</div>');
  window.__ready=true;});
